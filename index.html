  async dropOwner(owner){
    try {
      for (const m of await this.msgsFor(owner)) await this.msgDelete(m);
      for (const f of await this.filesAll()) if (f.owner === owner){
        if (this.mode === "desktop"){
          if (f.__asset) await Desktop.api.deleteAsset(f.__asset);
          Desktop.doc.stores.files = Desktop.doc.stores.files.filter(x => x.id !== f.id);
          Desktop.touch();
        }
        else if (this.ok) await this._req(this._os("files","readwrite").delete(f.id));
        else localStorage.removeItem("chamber:file:" + f.id);
      }
    } catch(err){ console.warn("[chamber] dropOwner failed for " + owner, err); }
  },

  /* ---- room layout: { id, x (0-1 of room width), y (px above floor) } ---- */
  async layoutAll(){
    if (this.mode === "desktop") return Desktop.doc.layout.slice();
    if (this.ok) return await this._req(this._os("roomLayout","readonly").getAll());
    const raw = localStorage.getItem("chamber:layout");
    return raw ? JSON.parse(raw) : [];
  },
  async layoutPut(rec){
    if (this.mode === "desktop"){
      const i = Desktop.doc.layout.findIndex(r => r.id === rec.id);
      if (i >= 0) Desktop.doc.layout[i] = rec; else Desktop.doc.layout.push(rec);
      Desktop.touch();
      return;
    }
    if (this.ok){ await this._req(this._os("roomLayout","readwrite").put(rec)); return; }
    const all = (await this.layoutAll()).filter(r => r.id !== rec.id);
    all.push(rec);
    localStorage.setItem("chamber:layout", JSON.stringify(all));
  },
  async layoutDelete(id){
    if (this.mode === "desktop"){
      Desktop.doc.layout = Desktop.doc.layout.filter(r => r.id !== id);
      Desktop.touch();
      return;
    }
    if (this.ok){
      try { await this._req(this._os("roomLayout","readwrite").delete(id)); } catch(err){}
      return;
    }
    const all = (await this.layoutAll()).filter(r => r.id !== id);
    localStorage.setItem("chamber:layout", JSON.stringify(all));
  },
  async layoutClear(){
    if (this.mode === "desktop"){ Desktop.doc.layout = []; Desktop.touch(); return; }
    if (this.ok){ await this._req(this._os("roomLayout","readwrite").clear()); return; }
    localStorage.removeItem("chamber:layout");
  },

  /* ---- generic blob-bearing stores: tracks (audio) and sprites (images) --
     These hold real Blobs, which IndexedDB stores natively. They are never
     written to localStorage - in fallback mode the feature is simply off,
     because base64 audio in localStorage would blow the quota instantly. */
  blobStoreAvailable(){ return this.ok; },

  async allFrom(storeName){
    if (this.mode === "desktop"){
      const arr = Desktop.doc.stores[storeName] || [];
      const out = [];
      for (const r of arr) out.push(await Desktop.hydrate(r));
      return out;
    }
    if (!this.ok) return [];
    try { return await this._req(this._os(storeName,"readonly").getAll()); }
    catch(err){ console.warn("[chamber] read " + storeName + " failed", err); return []; }
  },
  async getFrom(storeName, id){
    if (this.mode === "desktop"){
      const rec = (Desktop.doc.stores[storeName] || []).find(r => r.id === id);
      return rec ? await Desktop.hydrate(rec) : null;
    }
    if (!this.ok) return null;
    try { return await this._req(this._os(storeName,"readonly").get(id)); }
    catch(err){ return null; }
  },
  async putInto(storeName, rec){
    if (this.mode === "desktop"){
      const arr = Desktop.doc.stores[storeName] = Desktop.doc.stores[storeName] || [];
      const stashed = await Desktop.stash(rec);
      const i = arr.findIndex(r => r.id === rec.id);
      if (i >= 0) arr[i] = stashed; else arr.push(stashed);
      Desktop.touch();
      return;
    }
    if (!this.ok) throw new Error("IndexedDB unavailable");
    await this._req(this._os(storeName,"readwrite").put(rec));
  },
  async deleteFrom(storeName, id){
    if (this.mode === "desktop"){
      const arr = Desktop.doc.stores[storeName] || [];
      const rec = arr.find(r => r.id === id);
      if (rec && rec.__asset) await Desktop.api.deleteAsset(rec.__asset);
      Desktop.doc.stores[storeName] = arr.filter(r => r.id !== id);
      Desktop.touch();
      return;
    }
    if (!this.ok) return;
    try { await this._req(this._os(storeName,"readwrite").delete(id)); }
    catch(err){ console.warn("[chamber] delete from " + storeName + " failed", err); }
  }
};

/* =========================================================================
   [SECTION: SCHEMA]
   state = {
     schemaVersion, created,
     rooms: [ { id, name, subtitle, categories: [ {
                  id, name,
                  entries: [ { id, type:"text"|"list", title, body,
                               items:[{id,text,done}], created, updated, daily }
                           ] } ] } ],
     trash: [ { id, kind:"entry"|"category", roomId, catId, index, payload, deletedAt } ],
     meta:  { dailyLog: { roomId: "YYYY-MM-DD" } }
   }
   Chat messages are NOT in here - they live in their own IDB store, keyed by
   the id of the entry or category that owns the thread.
   ========================================================================= */
function mkEntry(type, title, body){
  return { id:uid(), type:type||"text", title:title||"Untitled",
           body:body||"", items:[], created:Date.now(), updated:Date.now(), daily:false };
}
function mkCat(name, entries){ return { id:uid(), name:name, entries:entries||[] }; }

function freshState(){
  return {
    schemaVersion: CONFIG.SCHEMA_VERSION,
    created: Date.now(),
    rooms: [
      { id:"desk", name:"Antique Writing Desk", subtitle:"Education & Work",
        categories:[
          mkCat("Courses", [ mkEntry("text","Semester overview",
            "**This term**\n\n- [ ] register for units\n- [ ] buy the reading list\n- [x] set up this room\n\nUse *italics*, **bold**, `code` and [links](https://example.com).") ]),
          mkCat("Assignments", [ mkEntry("list","Due soon") ]),
          mkCat("Work", [ mkEntry("text","Job log","Notes on shifts, clients, invoices.") ])
        ] },
      { id:"library", name:"The Library", subtitle:"Files, Notes & Reading",
        categories:[
          mkCat("Reading Log", [ mkEntry("list","Currently reading") ]),
          mkCat("Notes", [ mkEntry("text","Commonplace book","> Quotes worth keeping.\n\n---\n\nAnything at all.") ]),
          mkCat("Files", [ mkEntry("text","Where things live","Attach real files from a chat thread on any entry.") ])
        ] },
      { id:"wardrobe", name:"The Wardrobe", subtitle:"Quick Links & Daily Plan",
        categories:[
          mkCat("Quick Links", [ mkEntry("text","Bookmarks",
            "- [Gmail](https://mail.google.com)\n- [Calendar](https://calendar.google.com)\n- [Drive](https://drive.google.com)") ]),
          mkCat("Today", [ mkEntry("list","Plan for today") ]),
          mkCat("Habits", [ mkEntry("list","Daily habits") ])
        ] }
    ],
    trash: [],
    meta: { dailyLog:{} }
  };
}

/* =========================================================================
   [SECTION: MIGRATIONS]
   Ordered chain. Each entry upgrades TO its `to` version. Add new ones at
   the end and bump CONFIG.SCHEMA_VERSION to match. Never edit an old one.
   ========================================================================= */
const MIGRATIONS = [
  { to:2, note:"add meta.dailyLog + entry.daily flag", fn(s){
      s.meta = s.meta || {};
      s.meta.dailyLog = s.meta.dailyLog || {};
      (s.rooms || []).forEach(r => (r.categories || []).forEach(c =>
        (c.entries || []).forEach(e => { if (e.daily === undefined) e.daily = false; })));
      return s;
  }}
];

function migrate(state){
  if (typeof state.schemaVersion !== "number") state.schemaVersion = 1;
  for (const m of MIGRATIONS){
    if (state.schemaVersion < m.to){
      try { state = m.fn(state); state.schemaVersion = m.to; }
      catch(err){ console.error("[chamber] migration to " + m.to + " failed", err); throw err; }
    }
  }
  state.schemaVersion = CONFIG.SCHEMA_VERSION;
  return state;
}

/* =========================================================================
   [SECTION: VALIDATION]
   Checked BEFORE the UI touches the object. A failure falls back to the
   newest rolling backup rather than booting into an empty room.
   ========================================================================= */
function validate(s){
  if (!s || typeof s !== "object") return "not an object";
  if (!Array.isArray(s.rooms)) return "rooms is not an array";
  if (!s.rooms.length) return "no rooms";
  for (const r of s.rooms){
    if (!r || typeof r.id !== "string") return "room missing id";
    if (!Array.isArray(r.categories)) return "room " + r.id + " has no categories array";
    for (const c of r.categories){
      if (!c || typeof c.id !== "string") return "category missing id";
      if (!Array.isArray(c.entries)) return "category " + c.name + " has no entries array";
      for (const e of c.entries){
        if (!e || typeof e.id !== "string") return "entry missing id";
        if (e.type !== "text" && e.type !== "list") return "entry " + e.id + " has bad type";
        if (e.type === "list" && !Array.isArray(e.items)) return "list entry " + e.id + " has no items";
      }
    }
  }
  if (!Array.isArray(s.trash)) return "trash is not an array";
  return null;   // null === valid
}

/* =========================================================================
   PERSISTENCE - debounced autosave, rolling backups, quota handling
   ========================================================================= */
let state = null;
let saveTimer = null;
let lastBackup = 0;
let quotaToast = null;
let recoveredFromBackup = false;   // set by loadState, acted on in boot

function markDirty(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, CONFIG.AUTOSAVE_MS);
}

/* How much real content a state carries. Used to make sure an accidental
   empty state can never evict good data - see writeBackup(). */
function contentCount(s){
  if (!s || !Array.isArray(s.rooms)) return 0;
  let n = 0;
  s.rooms.forEach(r => (r.categories || []).forEach(c => {
    n += 1 + (c.entries ? c.entries.length : 0);
  }));
  return n + (Array.isArray(s.trash) ? s.trash.length : 0);
}

async function saveNow(){
  clearTimeout(saveTimer);
  if (!state) return;
  /* GUARD: never let a structurally broken in-memory state overwrite the
     last good copy on disk. If this ever fires it means a bug corrupted
     `state`, and the right move is to keep what is already saved. */
  const problem = validate(state);
  if (problem){
    console.error("[chamber] refusing to save invalid state:", problem);
    if (!quotaToast || !quotaToast.isConnected){
      quotaToast = toast("Save blocked: the in-memory data failed its shape check (" + problem +
                         "). Your last good save on disk is untouched. Export a backup and reload.",
                         "warn", 30000);
    }
    return;
  }
  try {
    await Store.kvSet("state", state);
    if (Date.now() - lastBackup > CONFIG.BACKUP_EVERY_MS) await writeBackup();
  } catch(err){
    handleWriteError(err);
  }
}

function handleWriteError(err){
  console.error("[chamber] write failed", err);
  const quota = err && (err.name === "QuotaExceededError" ||
                        err.name === "NS_ERROR_DOM_QUOTA_REACHED" ||
                        /quota/i.test(String(err.message || err)));
  if (quota){
    if (!quotaToast || !quotaToast.isConnected){
      quotaToast = toast("STORAGE FULL - changes are NOT being saved. Export your data, then clear old attachments.", "warn", 60000);
    }
  } else {
    toast("Save failed: " + (err && err.message ? err.message : err), "warn", 8000);
  }
}

/* Rolling snapshots, with two rules that keep the ring trustworthy:
     1. a structurally invalid state is never snapshotted at all;
     2. a state carrying no content never evicts a snapshot that has some.
   Without rule 2 an empty boot (or a bad import) could roll three times and
   quietly flush every good backup out of the ring. */
async function writeBackup(){
  try {
    const problem = validate(state);
    if (problem){
      console.warn("[chamber] skipping backup, state invalid:", problem);
      return;
    }
    const slots = (await Store.kvGet("backups")) || [];
    const incoming = contentCount(state);
    if (incoming === 0 && slots.some(s => contentCount(s.data) > 0)){
      console.warn("[chamber] skipping backup: empty state would evict good snapshots");
      lastBackup = Date.now();          // do not retry in a tight loop
      return;
    }
    slots.push({ ts:Date.now(), data:JSON.parse(JSON.stringify(state)), items:incoming });
    while (slots.length > CONFIG.BACKUP_SLOTS) slots.shift();
    await Store.kvSet("backups", slots);
    lastBackup = Date.now();
  } catch(err){ handleWriteError(err); }
}

async function loadState(){
  let raw = null;
  try { raw = await Store.kvGet("state"); } catch(err){ console.warn("[chamber] read failed", err); }

  if (raw){
    let candidate = raw;
    let problem = null;
    try { candidate = migrate(candidate); } catch(e){ problem = "migration threw"; }
    if (!problem) problem = validate(candidate);
    if (!problem) return candidate;

    console.warn("[chamber] saved state rejected:", problem);
    const slots = (await Store.kvGet("backups")) || [];
    for (let i = slots.length - 1; i >= 0; i--){
      let b = slots[i].data;
      try { b = migrate(b); } catch(e){ continue; }
      if (!validate(b)){
        toast("Saved data was damaged (" + problem + "). Restored backup from " + fmtTime(slots[i].ts) + ".", "warn", 12000);
        recoveredFromBackup = true;   // boot writes this straight back over the damaged record
        return b;
      }
    }
    toast("Saved data was damaged and no usable backup existed. Started a fresh room.", "warn", 14000);
  }
  return freshState();
}

/* =========================================================================
   [SECTION: MARKDOWN]  Hand-rolled. Supports:
     # ## ###   headings
     **bold**  *italic*  `code`
     [text](url)   - links, http/https/mailto only
     - item        - bullets
     - [ ] / - [x] - checkboxes (clickable; they rewrite the source line)
     > quote       - blockquote
     ---           - rule
   Checkbox indices are counted document-order so a click can find the Nth
   "- [ ]" line in the raw text and flip it.
   ========================================================================= */
function mdInline(t){
  let s = esc(t);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, txt, url){
    return /^(https?:\/\/|mailto:|#|\/)/i.test(url)
      ? '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + txt + "</a>"
      : txt;
  });
  return s;
}

function mdToHtml(src){
  const lines = String(src == null ? "" : src).split(/\r?\n/);
  const out = [];
  let inList = false, cb = 0;
  const closeList = () => { if (inList){ out.push("</ul>"); inList = false; } };

  for (const line of lines){
    const task = line.match(/^\s*[-*]\s+\[([ xX])\]\s?(.*)$/);
    if (task){
      if (!inList){ out.push("<ul>"); inList = true; }
      const on = task[1] !== " ";
      out.push('<li class="task"><span class="cb' + (on ? " on" : "") + '" data-cb="' + cb + '">[' +
               (on ? "x" : " ") + "]</span><span" + (on ? ' class="done"' : "") + ">" +
               mdInline(task[2]) + "</span></li>");
      cb++;
      continue;
    }
    const bullet = line.match(/^\s*[-*]\s+(.*)$/);
    if (bullet){
      if (!inList){ out.push("<ul>"); inList = true; }
      out.push("<li>" + mdInline(bullet[1]) + "</li>");
      continue;
    }
    closeList();
    if (/^\s*---+\s*$/.test(line)){ out.push("<hr>"); continue; }
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h){ const n = h[1].length; out.push("<h" + n + ">" + mdInline(h[2]) + "</h" + n + ">"); continue; }
    const q = line.match(/^\s*>\s?(.*)$/);
    if (q){ out.push("<blockquote>" + mdInline(q[1]) + "</blockquote>"); continue; }
    if (!line.trim()){ out.push("<br>"); continue; }
    out.push("<p>" + mdInline(line) + "</p>");
  }
  closeList();
  const html = out.join("");
  return html.trim() ? html : '<div class="empty">empty - click EDIT to write something</div>';
}

/* Flip the Nth checkbox in the raw source. Returns the new source. */
function mdToggleCheckbox(src, index){
  let n = 0;
  return String(src).split(/\r?\n/).map(line => {
    const m = line.match(/^(\s*[-*]\s+\[)([ xX])(\].*)$/);
    if (!m) return line;
    const hit = (n === index); n++;
    if (!hit) return line;
    return m[1] + (m[2] === " " ? "x" : " ") + m[3];
  }).join("\n");
}

/* =========================================================================
   LOOKUPS
   ========================================================================= */
function getRoom(id){ return state.rooms.find(r => r.id === id) || null; }
function findCat(catId){
  for (const r of state.rooms){
    const c = r.categories.find(c => c.id === catId);
    if (c) return { room:r, cat:c };
  }
  return null;
}
function findEntry(entryId){
  for (const r of state.rooms) for (const c of r.categories){
    const i = c.entries.findIndex(e => e.id === entryId);
    if (i >= 0) return { room:r, cat:c, entry:c.entries[i], index:i };
  }
  return null;
}
function ownerTitle(ownerId){
  const e = findEntry(ownerId); if (e) return e.entry.title;
  const c = findCat(ownerId);   if (c) return c.cat.name + "  (category)";
  return "Thread";
}
function countOpenTasks(room){
  let n = 0;
  room.categories.forEach(c => c.entries.forEach(e => {
    if (e.type === "list") n += e.items.filter(i => !i.done).length;
    else n += (String(e.body).match(/^\s*[-*]\s+\[ \]/gm) || []).length;
  }));
  return n;
}

/* =========================================================================
   DAILY LOG - guarantees a dated dumping ground exists every day.
   Change which rooms get one via CONFIG.DAILY_LOG_ROOMS.
   ========================================================================= */
function ensureDailyLog(){
  const today = dayKey();
  let changed = false;
  for (const roomId of CONFIG.DAILY_LOG_ROOMS){
    const room = getRoom(roomId);
    if (!room) continue;
    let cat = room.categories.find(c => c.name === "Daily Log");
    if (!cat){ cat = mkCat("Daily Log", []); room.categories.unshift(cat); changed = true; }
    if (state.meta.dailyLog[roomId] === today && cat.entries.some(e => e.title === prettyDay())) continue;
    if (!cat.entries.some(e => e.daily && e.title === prettyDay())){
      const e = mkEntry("text", prettyDay(), "");
      e.daily = true;
      cat.entries.unshift(e);
      changed = true;
    }
    state.meta.dailyLog[roomId] = today;
  }
  if (changed) markDirty();
}

/* =========================================================================
   [SECTION: TRASH]  Soft delete with 30-day retention.
   ========================================================================= */
function trashPush(kind, roomId, catId, index, payload){
  state.trash.push({
    id: uid(), kind, roomId, catId, index,
    payload: JSON.parse(JSON.stringify(payload)),
    name: kind === "entry" ? payload.title : payload.name,
    deletedAt: Date.now()
  });
  markDirty();
  updateBadges();
}
/* every chat-thread owner id carried by a trashed item */
function ownedIds(t){
  if (!t || !t.payload) return [];
  if (t.kind === "category")
    return [t.payload.id].concat((t.payload.entries || []).map(e => e.id));
  return [t.payload.id];
}

/* Destroy for real: drop the record AND its chat thread and attachments, so
   expired notes cannot leave orphans growing in IndexedDB forever. */
async function destroyTrashItem(t){
  for (const owner of ownedIds(t)) await Store.dropOwner(owner);
}

function purgeExpiredTrash(){
  const cutoff = Date.now() - CONFIG.TRASH_DAYS * 86400000;
  const expired = state.trash.filter(t => t.deletedAt < cutoff);
  if (!expired.length) return 0;
  state.trash = state.trash.filter(t => t.deletedAt >= cutoff);
  markDirty();
  // fire-and-forget: the state write above is what matters for correctness
  expired.forEach(t => destroyTrashItem(t));
  return expired.length;
}
function restoreTrash(id){
  const i = state.trash.findIndex(t => t.id === id);
  if (i < 0) return;
  const t = state.trash[i];
  const room = getRoom(t.roomId);
  if (!room){ toast("That room no longer exists.", "warn"); return; }
  if (t.kind === "category"){
    room.categories.splice(Math.min(t.index, room.categories.length), 0, t.payload);
  } else {
    let cat = room.categories.find(c => c.id === t.catId);
    if (!cat){ cat = mkCat("Restored", []); room.categories.push(cat); }
    cat.entries.splice(Math.min(t.index, cat.entries.length), 0, t.payload);
  }
  state.trash.splice(i, 1);
  markDirty(); updateBadges();
  toast("Restored: " + (t.name || "item"), "ok");
}

/* =========================================================================
   ROOM SHELL - intro, hotspots, badges
   One delegated listener on #room (Phase 2 asks for this; it is here now).
   ========================================================================= */
function runIntro(){
  const intro = $("#intro");
  let done = false;
  const finish = () => {
    if (done) return; done = true;
    intro.classList.add("gone");
    $("#room").classList.add("lit");
    $("#hud").classList.remove("hidden");
  };
  requestAnimationFrame(() => setTimeout(() => intro.classList.add("open"), 180));
  const t1 = setTimeout(() => { $("#room").classList.add("lit"); $("#hud").classList.remove("hidden"); }, 900);
  const t2 = setTimeout(finish, 2200);
  intro.addEventListener("click", () => { clearTimeout(t1); clearTimeout(t2); finish(); });
}

/* The little counters that float over the furniture: unfinished tasks per
   room, items in the basket, tracks on the gramophone. Off by default -
   they read as clutter on the pixel art. Settings -> ROOM turns them on. */
function badgesOn(){ return UI.read().showBadges === true; }

function updateBadges(){
  const show = badgesOn();
  state.rooms.forEach(r => {
    const b = document.querySelector('[data-badge="' + r.id + '"]');
    if (!b) return;
    const n = countOpenTasks(r);
    b.textContent = n;
    b.classList.toggle("hidden", !show || n === 0);
  });
  const tb = document.querySelector('[data-badge="trash"]');
  if (tb){ tb.textContent = state.trash.length;
           tb.classList.toggle("hidden", !show || state.trash.length === 0); }
  const gb = document.querySelector('[data-badge="gramophone"]');
  if (gb && !show) gb.classList.add("hidden");
  // the room itself is a readout of the data, so refresh it here too
  if (typeof RoomEcho !== "undefined" && RoomEcho.render) RoomEcho.render();
}

/* ONE delegated listener for the whole room, routed by closest(). */
function wireRoom(){
  $("#room").addEventListener("click", ev => {
    const frame = ev.target.closest("[data-move^='frame']");
    if (Layout.editing){
      // in edit mode a frame click assigns a bookmark instead of following one
      if (frame && !Layout.movedDuringDrag) Frames.edit(frame.getAttribute("data-move"));
      return;                                 // rearrange mode owns everything else
    }
    if (frame){ Frames.open(frame.getAttribute("data-move")); return; }
    const pet = ev.target.closest("[data-sprite]");
    if (pet){ Decor.speak(pet.getAttribute("data-sprite")); return; }
    const hot = ev.target.closest("[data-hotspot]");
    if (hot) openHotspot(hot);
  });

  /* Any pointer press clears the keyboard cursor. Without this the gold
     outline and floating candle from Tab navigation stayed stuck on whatever
     was last focused until you pressed Tab again. */
  document.addEventListener("pointerdown", ev => {
    if (KeyNav.el) KeyNav.blur();
    const held = document.activeElement;
    if (held && held.hasAttribute && held.hasAttribute("data-hotspot") &&
        !ev.target.closest("[data-hotspot]")) held.blur();
  }, true);

  /* right-click a frame to edit its bookmark, in either mode */
  $("#room").addEventListener("contextmenu", ev => {
    const frame = ev.target.closest("[data-move^='frame']");
    if (!frame) return;
    ev.preventDefault();
    Frames.edit(frame.getAttribute("data-move"));
  });
  $("#room").addEventListener("keydown", ev => {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    const hot = ev.target.closest("[data-hotspot]");
    if (!hot) return;
    ev.preventDefault();
    openHotspot(hot);
  });
  document.addEventListener("keydown", ev => {
    /* ---- Ctrl+K opens the grimoire from anywhere ---- */
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === "k" || ev.key === "K")){
      ev.preventDefault();
      if (Palette.open_) Palette.close(); else Palette.open();
      return;
    }
    if (ev.key !== "Escape") return;
    if (Lightbox.isOpen()) return Lightbox.close();
    if (Palette.open_) return Palette.close();
    if ($("#chatRoot").firstChild) return Chat.close();
    if (Layout.editing) return Layout.exitEdit();
    Organizer.close(); Trash.close(); Settings.close(); Music.close();
  });
}

/* =========================================================================
   [SECTION: ORGANIZER]  The modal. Categories on the left, entries right.
   ========================================================================= */
const Organizer = {
  roomId:null, catId:null, editing:{},   // entryId -> true when in edit mode

  /* srcEl: the clicked object, so the panel can fly out of it.
     wantCat: jump straight to a category (used by the command palette). */
  open(roomId, srcEl, wantCat){
    const room = getRoom(roomId);
    if (!room) return;
    this.roomId = roomId;
    const ui = UI.read();
    const remembered = ui.lastCat && ui.lastCat[roomId];
    this.catId = (wantCat && room.categories.some(c => c.id === wantCat)) ? wantCat
      : (remembered && room.categories.some(c => c.id === remembered)) ? remembered
      : (room.categories[0] ? room.categories[0].id : null);
    UI.write({ lastModal:roomId });
    this.mount();
    animateFrom($("#orgWrap").querySelector(".modal"),
                srcEl || document.querySelector('[data-hotspot="' + roomId + '"]'),
                OPEN_STYLE[roomId] || "pop");
  },

  /* highlight and scroll to one entry - the palette lands here */
  flash(entryId){
    const found = findEntry(entryId);
    if (!found) return;
    if (found.cat.id !== this.catId){
      this.catId = found.cat.id;
      this.renderCats(); this.renderEntries();
    }
    const el = document.querySelector('[data-entry="' + entryId + '"]');
    if (!el) return;
    el.scrollIntoView({ block:"center" });
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1600);
  },

  close(){
    $("#modalRoot").innerHTML = "";
    this.roomId = null;
    UI.write({ lastModal:null });
    updateBadges();
  },

  mount(){
    const room = getRoom(this.roomId);
    $("#modalRoot").innerHTML =
      '<div class="modal-wrap" id="orgWrap"><div class="modal">' +
        '<div class="modal-head">' +
          '<span class="h-title">' + esc(room.name) + " &mdash; " + esc(room.subtitle || "") + "</span>" +
          '<button class="tiny" data-org="newcat">+ CATEGORY</button>' +
          '<button class="tiny" data-org="close">CLOSE</button>' +
        "</div>" +
        '<div class="modal-body">' +
          '<aside class="cats" id="orgCats"></aside>' +
          '<main class="entries" id="orgEntries"></main>' +
        "</div>" +
      "</div></div>";

    const wrap = $("#orgWrap");
    wrap.addEventListener("click", ev => { if (ev.target === wrap) this.close(); });
    wrap.addEventListener("click", this.onClick.bind(this));
    wrap.addEventListener("input", this.onInput.bind(this));
    wrap.addEventListener("change", this.onInput.bind(this));
    this.renderCats();
    this.renderEntries();
  },

  renderCats(){
    const room = getRoom(this.roomId);
    $("#orgCats").innerHTML = "<h4>CATEGORIES</h4>" + room.categories.map((c, i) =>
      '<div class="cat-item' + (c.id === this.catId ? " active" : "") + '" data-cat="' + c.id + '">' +
        '<span class="cname">' + esc(c.name) + "</span>" +
        '<span class="ccount">' + c.entries.length + "</span>" +
        '<button class="tiny" data-org="catup"  data-id="' + c.id + '" title="move up">&#9650;</button>' +
        '<button class="tiny" data-org="catdown" data-id="' + c.id + '" title="move down">&#9660;</button>' +
        '<button class="tiny" data-org="catchat" data-id="' + c.id + '" title="chat to myself">&#9993;</button>' +
        '<button class="tiny" data-org="catren" data-id="' + c.id + '" title="rename">&#9998;</button>' +
        '<button class="tiny danger" data-org="catdel" data-id="' + c.id + '" title="delete">&#10005;</button>' +
      "</div>").join("");
  },

  renderEntries(){
    const room = getRoom(this.roomId);
    const cat = room.categories.find(c => c.id === this.catId);
    const host = $("#orgEntries");
    if (!cat){
      host.innerHTML = '<p class="muted">No categories yet. Use + CATEGORY above.</p>';
      return;
    }
    host.innerHTML =
      '<div class="entries-head"><h3>' + esc(cat.name) + "</h3>" +
        '<button class="tiny gold" data-org="newtext">+ NOTE</button>' +
        '<button class="tiny gold" data-org="newlist">+ LIST</button>' +
        '<button class="tiny" data-org="catchat" data-id="' + cat.id + '">&#9993; CHAT TO CATEGORY</button>' +
      "</div>" +
      (cat.entries.length ? cat.entries.map((e, i) => this.entryHtml(e, i, cat.entries.length)).join("")
                          : '<p class="muted">Nothing here yet.</p>');
  },

  entryHtml(e, i, total){
    const editing = !!this.editing[e.id];
    let body;
    if (editing){
      body = '<textarea data-org="body" data-id="' + e.id + '" rows="8" placeholder="Markdown: **bold** *italic* [link](url) - [ ] task">' + esc(e.body) + "</textarea>";
    } else if (e.type === "list"){
      body = e.items.map(it =>
        '<div class="list-item' + (it.done ? " done" : "") + '">' +
          '<span class="li-box" data-org="itemtoggle" data-id="' + e.id + '" data-item="' + it.id + '">' + (it.done ? "&#10003;" : "") + "</span>" +
          '<input class="li-text" data-org="itemtext" data-id="' + e.id + '" data-item="' + it.id + '" value="' + esc(it.text) + '">' +
          '<button class="tiny" data-org="itemup"   data-id="' + e.id + '" data-item="' + it.id + '">&#9650;</button>' +
          '<button class="tiny" data-org="itemdown" data-id="' + e.id + '" data-item="' + it.id + '">&#9660;</button>' +
          '<button class="tiny danger" data-org="itemdel" data-id="' + e.id + '" data-item="' + it.id + '">&#10005;</button>' +
        "</div>").join("") +
        '<div style="margin-top:8px"><button class="tiny gold" data-org="itemadd" data-id="' + e.id + '">+ ITEM</button></div>';
    } else {
      body = '<div class="md" data-md="' + e.id + '">' + mdToHtml(e.body) + "</div>";
    }

    return '<div class="entry' + (e.daily ? " daily" : "") + '" data-entry="' + e.id + '">' +
      '<div class="entry-head">' +
        '<input class="etitle" data-org="title" data-id="' + e.id + '" value="' + esc(e.title) + '">' +
        '<button class="tiny" data-org="up"   data-id="' + e.id + '" ' + (i === 0 ? "disabled" : "") + '>&#9650;</button>' +
        '<button class="tiny" data-org="down" data-id="' + e.id + '" ' + (i === total-1 ? "disabled" : "") + '>&#9660;</button>' +
        (e.type === "text"
          ? '<button class="tiny" data-org="edit" data-id="' + e.id + '">' + (editing ? "DONE" : "EDIT") + "</button>"
          : "") +
        '<button class="tiny" data-org="chat" data-id="' + e.id + '">&#9993; CHAT</button>' +
        '<button class="tiny danger" data-org="del" data-id="' + e.id + '">&#10005;</button>' +
      "</div>" +
      '<div class="entry-body">' + body + "</div>" +
      '<div class="entry-meta">' + (e.type === "list" ? "list" : "note") +
        " &middot; updated " + fmtTime(e.updated) + (e.daily ? " &middot; daily log" : "") + "</div>" +
    "</div>";
  },

  onClick(ev){
    /* checkbox inside rendered markdown */
    const cbEl = ev.target.closest(".cb");
    if (cbEl){
      const holder = cbEl.closest("[data-md]");
      const found = findEntry(holder.getAttribute("data-md"));
      if (found){
        found.entry.body = mdToggleCheckbox(found.entry.body, +cbEl.getAttribute("data-cb"));
        found.entry.updated = Date.now();
        markDirty();
        holder.innerHTML = mdToHtml(found.entry.body);
      }
      return;
    }
    /* category selection */
    const catRow = ev.target.closest(".cat-item");
    if (catRow && !ev.target.closest("button")){
      this.catId = catRow.getAttribute("data-cat");
      const ui = UI.read(); const lc = ui.lastCat || {};
      lc[this.roomId] = this.catId; UI.write({ lastCat:lc });
      this.renderCats(); this.renderEntries();
      return;
    }

    /* Inputs carry data-org too (title / body / itemtext) - those are handled
       by onInput, so only buttons and the list checkbox act on click. */
    const btn = ev.target.closest("[data-org]");
    if (!btn) return;
    if (btn.tagName !== "BUTTON" && !btn.classList.contains("li-box")) return;
    const act = btn.getAttribute("data-org");
    const id  = btn.getAttribute("data-id");
    const room = getRoom(this.roomId);
    const cat  = room.categories.find(c => c.id === this.catId);

    switch(act){
      case "close": this.close(); return;

      case "newcat": {
        const name = prompt("Name the new category:");
        if (!name) return;
        const c = mkCat(name.trim(), []);
        room.categories.push(c); this.catId = c.id;
        markDirty(); this.renderCats(); this.renderEntries();
        return;
      }
      case "catren": {
        const found = findCat(id); if (!found) return;
        const name = prompt("Rename category:", found.cat.name);
        if (!name) return;
        found.cat.name = name.trim(); markDirty(); this.renderCats(); this.renderEntries();
        return;
      }
      case "catdel": {
        const idx = room.categories.findIndex(c => c.id === id);
        if (idx < 0) return;
        const c = room.categories[idx];
        if (!confirm('Move category "' + c.name + '" and its ' + c.entries.length + ' entries to the wastepaper basket?')) return;
        room.categories.splice(idx, 1);
        trashPush("category", room.id, null, idx, c);
        if (this.catId === id) this.catId = room.categories[0] ? room.categories[0].id : null;
        markDirty(); this.renderCats(); this.renderEntries();
        return;
      }
      case "catup": case "catdown": {
        const idx = room.categories.findIndex(c => c.id === id);
        const to = act === "catup" ? idx - 1 : idx + 1;
        if (idx < 0 || to < 0 || to >= room.categories.length) return;
        const [c] = room.categories.splice(idx, 1);
        room.categories.splice(to, 0, c);
        markDirty(); this.renderCats();
        return;
      }
      case "catchat": { const f = findCat(id); if (f) Chat.open(id, "Category: " + f.cat.name); return; }

      case "newtext": case "newlist": {
        if (!cat) return;
        const e = mkEntry(act === "newtext" ? "text" : "list", "Untitled", "");
        if (e.type === "list") e.items = [];
        cat.entries.unshift(e);
        if (e.type === "text") this.editing[e.id] = true;
        markDirty(); this.renderCats(); this.renderEntries();
        return;
      }
      case "edit": {
        this.editing[id] = !this.editing[id];
        this.renderEntries();
        if (this.editing[id]){
          const ta = document.querySelector('textarea[data-id="' + id + '"]');
          if (ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
        }
        return;
      }
      case "del": {
        const f = findEntry(id); if (!f) return;
        if (!confirm('Move "' + f.entry.title + '" to the wastepaper basket?')) return;
        f.cat.entries.splice(f.index, 1);
        trashPush("entry", f.room.id, f.cat.id, f.index, f.entry);
        markDirty(); this.renderCats(); this.renderEntries();
        return;
      }
      case "up": case "down": {
        const f = findEntry(id); if (!f) return;
        const to = act === "up" ? f.index - 1 : f.index + 1;
        if (to < 0 || to >= f.cat.entries.length) return;
        const [e] = f.cat.entries.splice(f.index, 1);
        f.cat.entries.splice(to, 0, e);
        markDirty(); this.renderEntries();
        return;
      }
      case "chat": { const f = findEntry(id); if (f) Chat.open(id, f.entry.title); return; }

      case "itemadd": {
        const f = findEntry(id); if (!f) return;
        f.entry.items.push({ id:uid(), text:"", done:false });
        f.entry.updated = Date.now(); markDirty(); this.renderEntries();
        const boxes = document.querySelectorAll('[data-entry="' + id + '"] .li-text');
        if (boxes.length) boxes[boxes.length-1].focus();
        return;
      }
      case "itemtoggle": {
        const f = findEntry(id); if (!f) return;
        const it = f.entry.items.find(x => x.id === btn.getAttribute("data-item"));
        if (!it) return;
        it.done = !it.done; f.entry.updated = Date.now();
        markDirty(); this.renderEntries();
        return;
      }
      case "itemdel": {
        const f = findEntry(id); if (!f) return;
        f.entry.items = f.entry.items.filter(x => x.id !== btn.getAttribute("data-item"));
        f.entry.updated = Date.now(); markDirty(); this.renderEntries();
        return;
      }
      case "itemup": case "itemdown": {
        const f = findEntry(id); if (!f) return;
        const arr = f.entry.items;
        const i = arr.findIndex(x => x.id === btn.getAttribute("data-item"));
        const to = act === "itemup" ? i - 1 : i + 1;
        if (i < 0 || to < 0 || to >= arr.length) return;
        const [it] = arr.splice(i, 1); arr.splice(to, 0, it);
        f.entry.updated = Date.now(); markDirty(); this.renderEntries();
        return;
      }
    }
  },

  /* typing: debounced through markDirty, no re-render (keeps the caret) */
  onInput(ev){
    const el = ev.target.closest("[data-org]");
    if (!el) return;
    const act = el.getAttribute("data-org");
    const id  = el.getAttribute("data-id");
    const f = findEntry(id);
    if (!f) return;
    if (act === "title"){ f.entry.title = el.value; f.entry.updated = Date.now(); markDirty();
      const row = document.querySelector('[data-cat="' + f.cat.id + '"] .ccount'); if (row) row.textContent = f.cat.entries.length;
      return; }
    if (act === "body"){ f.entry.body = el.value; f.entry.updated = Date.now(); markDirty(); return; }
    if (act === "itemtext"){
      const it = f.entry.items.find(x => x.id === el.getAttribute("data-item"));
      if (it){ it.text = el.value; f.entry.updated = Date.now(); markDirty(); }
      return;
    }
  }
};

/* =========================================================================
   [SECTION: CHAT]  Self-chat threads.
   - Chat.all is the single source of truth: a plain array in memory.
   - Only the last CONFIG.CHAT_PAGE bubbles are in the DOM; scrolling to the
     top sentinel loads the previous chunk via IntersectionObserver.
   - Sending appends one node and does one IndexedDB put. The thread is
     never re-serialized.
   ========================================================================= */
const Chat = {
  owner:null, all:[], start:0, io:null,

  /* focusId: jump to one message (the command palette uses this) */
  async open(ownerId, title, focusId){
    this.owner = ownerId;
    this.pendingAtts = null;              // never carry staged files between threads
    this.pendingImgs = null;
    this.all = await Store.msgsFor(ownerId);
    this.start = Math.max(0, this.all.length - CONFIG.CHAT_PAGE);
    if (focusId){
      const at = this.all.findIndex(m => m.id === focusId);
      // widen the window so the target is inside it, with context above
      if (at >= 0) this.start = Math.max(0, Math.min(this.start, at - 10));
    }

    $("#chatRoot").innerHTML =
      '<div id="chatPanel"><div class="chat">' +
        '<div class="chat-head">' +
          '<span class="c-title">&#9993; ' + esc(title || ownerTitle(ownerId)) + "</span>" +
          '<span class="muted" id="chatCount"></span>' +
          '<button class="tiny" data-chat="close">CLOSE</button>' +
        "</div>" +
        '<div class="chat-log" id="chatLog"><div class="chat-sentinel" id="chatTop"></div></div>' +
        '<div class="chat-staged hidden" id="chatStaged"></div>' +
        '<div class="chat-compose">' +
          '<textarea id="chatInput" placeholder="Talk to yourself. Enter sends, Shift+Enter is a new line. Paste or drop images straight in."></textarea>' +
          '<div style="display:flex;flex-direction:column;gap:6px">' +
            '<button class="tiny" data-chat="attach">&#128206; FILE</button>' +
            '<button class="tiny" data-chat="img">&#128247; IMAGE</button>' +
            '<button class="gold" data-chat="send">SEND</button>' +
          "</div>" +
          '<input type="file" id="chatImgFile" accept="image/*" multiple class="hidden">' +
        "</div>" +
      "</div></div>";

    const panel = $("#chatPanel");
    panel.addEventListener("click", ev => { if (ev.target === panel) this.close(); });
    panel.addEventListener("click", this.onClick.bind(this));
    $("#chatInput").addEventListener("keydown", ev => {
      if (ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); this.send(); }
    });

    /* ---- images: paste from the clipboard or drop onto the thread ---- */
    const grabFiles = list => Array.from(list || []).filter(f => f && /^image\//.test(f.type));
    panel.addEventListener("paste", ev => {
      const items = ev.clipboardData && ev.clipboardData.items;
      if (!items) return;
      const files = [];
      for (const it of items) if (it.kind === "file" && /^image\//.test(it.type)) files.push(it.getAsFile());
      if (files.length){ ev.preventDefault(); this.attachImages(files); }
    });
    const log = $("#chatLog");
    ["dragenter","dragover"].forEach(t => log.addEventListener(t, ev => {
      ev.preventDefault(); log.classList.add("dragover");
    }));
    ["dragleave","drop"].forEach(t => log.addEventListener(t, ev => {
      ev.preventDefault(); log.classList.remove("dragover");
    }));
    log.addEventListener("drop", ev => {
      const files = grabFiles(ev.dataTransfer && ev.dataTransfer.files);
      if (files.length) this.attachImages(files);
    });
    // clicking an image in a bubble blows it up
    log.addEventListener("click", ev => {
      const img = ev.target.closest(".b-img");
      if (img) Lightbox.open(img.getAttribute("src"), img.getAttribute("data-cap") || "");
    });

    this.renderWindow();
    this.observeTop();
    animateFrom($("#chatPanel").querySelector(".chat"), null, "pop");

    const target = focusId && document.querySelector('[data-msg="' + focusId + '"]');
    if (target){
      target.scrollIntoView({ block:"center" });
      target.classList.add("flash");
      setTimeout(() => target.classList.remove("flash"), 1600);
    } else {
      $("#chatLog").scrollTop = $("#chatLog").scrollHeight;
    }
    $("#chatInput").focus();
  },

  close(){
    if (this.io){ this.io.disconnect(); this.io = null; }
    $("#chatRoot").innerHTML = "";
    this.owner = null; this.all = []; this.pendingAtts = null; this.pendingImgs = null;
  },

  /* render the current window [start .. end] */
  renderWindow(){
    const log = $("#chatLog");
    const frag = document.createDocumentFragment();
    for (let i = this.start; i < this.all.length; i++) frag.appendChild(this.bubble(this.all[i]));
    log.innerHTML = '<div class="chat-sentinel" id="chatTop"></div>' +
      (this.start > 0 ? '<div class="chat-older">&#8593; scroll up for ' + this.start + " older</div>" : "");
    log.appendChild(frag);
    this.updateCount();
  },

  updateCount(){
    const c = $("#chatCount");
    if (c) c.textContent = this.all.length + " msg" + (this.all.length === 1 ? "" : "s");
  },

  renderStaged(){
    const strip = $("#chatStaged");
    if (!strip) return;
    const nf = (this.pendingAtts || []).length;
    const ni = (this.pendingImgs || []).length;
    strip.classList.toggle("hidden", nf === 0 && ni === 0);
    if (!nf && !ni){ strip.innerHTML = ""; return; }
    strip.innerHTML =
      (nf ? "&#128206; " + nf + " file(s) " : "") +
      (ni ? '<span class="staged-thumbs">' +
            this.pendingImgs.map(src => '<img src="' + src + '" alt="">').join("") + "</span>" : "") +
      '<button class="tiny danger" data-chat="unstage">CLEAR</button>';
  },

  /* Prepend the previous chunk of history. Called by the IntersectionObserver
     when the top sentinel scrolls into view; kept as its own method so the
     paging logic can be exercised without a scroll gesture. */
  loadOlder(){
    if (this.start === 0) return 0;
    const log = $("#chatLog");
    const top = $("#chatTop");
    const prevHeight = log.scrollHeight;
    const prevTop = log.scrollTop;
    const newStart = Math.max(0, this.start - CONFIG.CHAT_PAGE);
    const frag = document.createDocumentFragment();
    for (let i = newStart; i < this.start; i++) frag.appendChild(this.bubble(this.all[i]));
    const loaded = this.start - newStart;
    this.start = newStart;
    const marker = log.querySelector(".chat-older");
    if (marker){
      if (this.start > 0) marker.textContent = "↑ scroll up for " + this.start + " older";
      else marker.remove();
    }
    (log.querySelector(".chat-older") || top).after(frag);
    log.scrollTop = prevTop + (log.scrollHeight - prevHeight);   // hold reading position
    return loaded;
  },

  observeTop(){
    const log = $("#chatLog");
    const top = $("#chatTop");
    if (this.io) this.io.disconnect();
    this.io = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) this.loadOlder();
    }, { root:log, rootMargin:"120px 0px 0px 0px" });
    this.io.observe(top);
  },

  bubble(m){
    const el = document.createElement("div");
    el.className = "bubble";
    el.setAttribute("data-msg", m.id);
    // pasted/dropped images live in the message record itself as data URLs
    const imgs = (m.imgs || []).map((src, i) =>
      '<img class="b-img" src="' + src + '" alt="pasted image" loading="lazy" data-cap="' +
      esc(fmtTime(m.ts)) + '">').join("");
    el.innerHTML =
      '<div class="b-time">' + fmtTime(m.ts) + "</div>" +
      (m.text ? '<div class="b-text">' + mdInline(m.text) + "</div>" : "") +
      imgs +
      '<div class="b-atts"></div>' +
      '<div class="b-tools"><button class="tiny danger" data-chat="delmsg" data-id="' + m.id + '">&#10005;</button></div>';
    const holder = el.querySelector(".b-atts");
    (m.atts || []).forEach(fid => Files.renderInto(holder, fid));
    return el;
  },

  /* downscale then hold them until SEND, exactly like file attachments */
  async attachImages(files){
    if (!Store.ok){
      toast("Pasting images needs IndexedDB - in localStorage fallback mode they would blow the quota. Serve this over http://localhost.", "warn", 10000);
      return;
    }
    const busy = toast("Processing " + files.length + " image(s)...", null, 30000);
    const out = [];
    for (const f of files){
      const r = await Imaging.shrink(f, CONFIG.CHAT_IMG_MAX_PX, CONFIG.CHAT_IMG_MAX_KB);
      if (r) out.push(r.dataURL);
    }
    busy.remove();
    if (!out.length) return;
    this.pendingImgs = (this.pendingImgs || []).concat(out);
    this.renderStaged();
    toast(out.length + " image(s) ready - press SEND.", "ok");
  },

  async send(){
    const ta = $("#chatInput");
    const text = ta.value.trim();
    const hasAtts = this.pendingAtts && this.pendingAtts.length;
    const hasImgs = this.pendingImgs && this.pendingImgs.length;
    if (!text && !hasAtts && !hasImgs) return;
    const last = this.all[this.all.length - 1];
    const msg = {
      id: uid(),
      owner: this.owner,
      ts: Date.now(),
      seq: Math.max(Date.now(), last ? last.seq + 1 : 0),
      text: text,
      atts: this.pendingAtts || [],
      imgs: this.pendingImgs || []
    };
    this.pendingAtts = null;
    this.pendingImgs = null;
    this.renderStaged();
    this.all.push(msg);                       // in-memory source of truth
    const log = $("#chatLog");
    log.appendChild(this.bubble(msg));        // append ONE node
    log.scrollTop = log.scrollHeight;
    ta.value = "";
    this.updateCount();
    try { await Store.msgPut(msg); }          // append ONE record
    catch(err){ handleWriteError(err); }
  },

  async onClick(ev){
    const btn = ev.target.closest("[data-chat]");
    if (!btn) return;
    const act = btn.getAttribute("data-chat");
    if (act === "close") return this.close();
    if (act === "send")  return this.send();
    if (act === "attach") return Files.attach(this);
    if (act === "img"){
      const inp = $("#chatImgFile");
      inp.onchange = () => { if (inp.files.length) this.attachImages(Array.from(inp.files)); inp.value = ""; };
      inp.click();
      return;
    }
    if (act === "unstage"){ this.pendingAtts = null; this.pendingImgs = null; this.renderStaged(); return; }
    if (act === "delmsg"){
      const id = btn.getAttribute("data-id");
      const i = this.all.findIndex(m => m.id === id);
      if (i < 0) return;
      if (!confirm("Delete this message permanently?")) return;
      const m = this.all[i];
      this.all.splice(i, 1);
      if (this.start > this.all.length) this.start = Math.max(0, this.all.length - CONFIG.CHAT_PAGE);
      const node = document.querySelector('[data-msg="' + id + '"]');
      if (node) node.remove();
      this.updateCount();
      try { await Store.msgDelete(m); } catch(err){ handleWriteError(err); }
    }
  }
};

/* =========================================================================
   [SECTION: FILES]  Attachments.
   Drag-and-drop and <input type=file> do not expose real paths, so:
     - preferred: showOpenFilePicker() -> keep the FileSystemFileHandle in
       IndexedDB. Months later the same handle reopens the real file, after
       re-granting permission (Chrome drops the grant on reload).
     - fallback:  metadata only (name, size, date) + a manual path field you
       type yourself, so at least you know where the file lives.
     - images:    a downscaled JPEG preview blob, capped, stored in IndexedDB.
   Raw file bytes are NEVER written to localStorage.
   ========================================================================= */
const Files = {
  supported: typeof window.showOpenFilePicker === "function",

  async attach(chat){
    if (this.supported) return this.attachViaPicker(chat);
    return this.attachViaInput(chat);
  },

  async attachViaPicker(chat){
    let handles;
    try { handles = await window.showOpenFilePicker({ multiple:true }); }
    catch(err){ return; }                                    // user cancelled
    const ids = [];
    for (const handle of handles){
      try {
        const file = await handle.getFile();
        const rec = {
          id: uid(), owner: chat.owner, name: file.name, size: file.size,
          lastModified: file.lastModified, type: file.type,
          handle: handle, path: "", preview: null, addedAt: Date.now()
        };
        rec.preview = await this.makePreview(file);
        await Store.filePut(rec);
        ids.push(rec.id);
      } catch(err){ handleWriteError(err); }
    }
    if (ids.length) this.stage(chat, ids);
  },

  attachViaInput(chat){
    const input = document.createElement("input");
    input.type = "file"; input.multiple = true;
    input.addEventListener("change", async () => {
      const ids = [];
      for (const file of Array.from(input.files)){
        const path = prompt('This browser cannot keep a link to the real file.\nOptionally type the full path for "' + file.name + '":', "");
        const rec = {
          id: uid(), owner: chat.owner, name: file.name, size: file.size,
          lastModified: file.lastModified, type: file.type,
          handle: null, path: path || "", preview: null, addedAt: Date.now()
        };
        try { rec.preview = await this.makePreview(file); await Store.filePut(rec); ids.push(rec.id); }
        catch(err){ handleWriteError(err); }
      }
      if (ids.length) this.stage(chat, ids);
    });
    input.click();
  },

  /* Files wait in a staging strip above the composer until SEND. The message
     text is never touched, so you can attach first and write afterwards. */
  stage(chat, ids){
    chat.pendingAtts = (chat.pendingAtts || []).concat(ids);
    Chat.renderStaged();
    toast(ids.length + " file(s) attached - press SEND to post them.", "ok");
  },

  /* downscale images to a small JPEG blob; everything else gets no preview */
  async makePreview(file){
    if (!Store.ok) return null;                       // fallback mode: no blobs
    if (!/^image\//.test(file.type || "")) return null;
    try {
      const bmp = await createImageBitmap(file);
      const max = CONFIG.PREVIEW_MAX_PX;
      const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const w = Math.max(1, Math.round(bmp.width * scale));
      const h = Math.max(1, Math.round(bmp.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(bmp, 0, 0, w, h);
      bmp.close && bmp.close();
      const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.7));
      if (!blob || blob.size > CONFIG.PREVIEW_MAX_BYTES) return null;
      return blob;
    } catch(err){ return null; }
  },

  async renderInto(holder, fileId){
    const rec = await Store.fileGet(fileId);
    const btn = document.createElement("button");
    btn.className = "att";
    if (!rec){ btn.textContent = "[missing attachment]"; holder.appendChild(btn); return; }
    const thumb = document.createElement("span");
    thumb.className = "a-thumb";
    if (rec.preview instanceof Blob){ thumb.style.backgroundImage = "url(" + URL.createObjectURL(rec.preview) + ")"; }
    else thumb.innerHTML = "&#128196;";
    const meta = document.createElement("span");
    meta.className = "a-meta";
    meta.innerHTML = '<span class="a-name">' + esc(rec.name) + "</span>" +
      '<span class="a-sub">' + fmtSize(rec.size) + " &middot; " +
      new Date(rec.lastModified || rec.addedAt).toLocaleDateString() +
      (rec.handle ? " &middot; linked" : rec.path ? " &middot; " + esc(rec.path) : " &middot; metadata only") + "</span>";
    btn.appendChild(thumb); btn.appendChild(meta);
    btn.addEventListener("click", ev => { ev.stopPropagation(); this.openFile(rec); });
    holder.appendChild(btn);
  },

  /* Reopening a stored handle after a reload. Chrome drops the permission
     grant on every load, so we always re-ask - inside try/catch, because
     every step here can throw a DOMException (revoked grant, deleted file,
     handle written by an older browser without the permission methods). */
  async openFile(rec){
    if (rec.handle){
      try {
        let perm = "granted";
        if (typeof rec.handle.queryPermission === "function"){
          perm = await rec.handle.queryPermission({ mode:"read" });
          if (perm !== "granted" && typeof rec.handle.requestPermission === "function"){
            // must happen in the click gesture, which is why this is called
            // straight from the attachment button
            perm = await rec.handle.requestPermission({ mode:"read" });
          }
        }
        if (perm !== "granted"){
          toast("Permission to read that file was denied. Click it again to retry.", "warn", 7000);
          return;
        }
        const file = await rec.handle.getFile();     // throws if it moved
        const url = URL.createObjectURL(file);
        const a = document.createElement("a");
        a.href = url; a.download = file.name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        return;
      } catch(err){
        const gone = err && (err.name === "NotFoundError" || err.name === "NotReadableError");
        console.warn("[chamber] handle unusable", err);
        if (gone && confirm('"' + rec.name + '" could not be found where it was.\n\nPick it again to relink?')){
          return this.relink(rec);
        }
        toast("Could not reopen that file: " + (err && err.name ? err.name : "unknown error"), "warn", 7000);
        return;
      }
    }
    if (rec.preview instanceof Blob){ window.open(URL.createObjectURL(rec.preview), "_blank"); return; }
    alert("Metadata only.\n\nName: " + rec.name + "\nSize: " + fmtSize(rec.size) +
          "\nDate: " + new Date(rec.lastModified || rec.addedAt).toLocaleString() +
          (rec.path ? "\nPath: " + rec.path : "\n\nNo path was recorded."));
  },

  /* point an existing attachment at the file's new location */
  async relink(rec){
    if (!this.supported){ toast("This browser cannot relink files.", "warn"); return; }
    try {
      const [handle] = await window.showOpenFilePicker({ multiple:false });
      const file = await handle.getFile();
      rec.handle = handle; rec.name = file.name; rec.size = file.size;
      rec.lastModified = file.lastModified; rec.type = file.type;
      await Store.filePut(rec);
      toast("Relinked to " + file.name, "ok");
      if (Chat.owner) Chat.open(Chat.owner, ownerTitle(Chat.owner));
    } catch(err){ /* cancelled */ }
  }
};

/* =========================================================================
   TRASH MODAL
   ========================================================================= */
const Trash = {
  open(srcEl){
    purgeExpiredTrash();
    const days = CONFIG.TRASH_DAYS;
    const rows = state.trash.slice().sort((a,b) => b.deletedAt - a.deletedAt).map(t => {
      const left = Math.max(0, days - Math.floor((Date.now() - t.deletedAt) / 86400000));
      return '<div class="trash-item">' +
        '<span class="t-meta"><span class="t-name">' + esc(t.name || "(untitled)") + "</span>" +
        '<span class="t-sub">' + t.kind + " &middot; deleted " + fmtTime(t.deletedAt) +
        " &middot; " + left + " day(s) left</span></span>" +
        '<button class="tiny gold" data-trash="restore" data-id="' + t.id + '">RESTORE</button>' +
        '<button class="tiny danger" data-trash="purge" data-id="' + t.id + '">DESTROY</button>' +
      "</div>";
    }).join("");

    $("#modalRoot").innerHTML =
      '<div class="modal-wrap" id="trashWrap"><div class="modal">' +
        '<div class="modal-head"><span class="h-title">WASTEPAPER BASKET</span>' +
          '<button class="tiny" data-trash="close">CLOSE</button></div>' +
        '<div class="modal-body"><main class="entries">' +
          '<p class="muted">Deleted items are kept for ' + days + " days, then destroyed automatically.</p>" +
          (rows || '<p class="muted">The basket is empty.</p>') +
        "</main></div>" +
      "</div></div>";

    const wrap = $("#trashWrap");
    animateFrom(wrap.querySelector(".modal"),
                srcEl || document.querySelector('[data-hotspot="trash"]'), "pop");
    wrap.addEventListener("click", ev => {
      if (ev.target === wrap) return this.close();
      const btn = ev.target.closest("[data-trash]");
      if (!btn) return;
      const act = btn.getAttribute("data-trash");
      const id = btn.getAttribute("data-id");
      if (act === "close") return this.close();
      if (act === "restore"){ restoreTrash(id); this.open(); return; }
      if (act === "purge"){
        if (!confirm("Destroy this permanently?\n\nIts chat thread and attachments go too.")) return;
        const item = state.trash.find(t => t.id === id);
        state.trash = state.trash.filter(t => t.id !== id);
        if (item) destroyTrashItem(item);        // drop chats + attachments
        markDirty(); updateBadges(); this.open();
      }
    });
  },
  close(){ $("#modalRoot").innerHTML = ""; updateBadges(); }
};

/* =========================================================================
   EXPORT / IMPORT
   The export carries the state document, every chat message, and attachment
   METADATA. File handles and preview blobs cannot travel through JSON, so
   they are deliberately dropped (and noted in the file).
   ========================================================================= */
async function exportJson(){
  await saveNow();
  const files = (await Store.filesAll()).map(f => ({
    id:f.id, owner:f.owner, name:f.name, size:f.size, type:f.type,
    lastModified:f.lastModified, path:f.path, addedAt:f.addedAt,
    hadHandle: !!f.handle, hadPreview: !!f.preview
  }));
  /* Sprites travel as data URLs so a restored backup still has your pets and
     their dialogue. Audio tracks deliberately do NOT - a music library would
     turn a text backup into hundreds of megabytes. */
  const sprites = [];
  let spriteBytes = 0;
  for (const s of Decor.sprites){
    const rec = { id:s.id, name:s.name, type:s.type, w:s.w, h:s.h,
                  isPet:s.isPet, lines:s.lines || [], addedAt:s.addedAt, img:null };
    try {
      if (spriteBytes < 8 * 1024 * 1024){
        rec.img = await Imaging.blobToDataURL(s.blob);
        spriteBytes += rec.img.length;
      }
    } catch(err){ /* keep the metadata even if the image will not serialise */ }
    sprites.push(rec);
  }

  const payload = {
    _format: "the-chamber-export",
    _note: "Chat images and custom sprites travel inside this file. File handles, " +
           "image previews for attachments, and gramophone audio are not portable and were omitted.",
    exportedAt: new Date().toISOString(),
    schemaVersion: state.schemaVersion,
    state: state,
    messages: await Store.msgsAll(),
    files: files,
    sprites: sprites,
    wallpaper: Wallpaper.rec || null,
    frameLinks: Frames.links || {},
    layout: await Store.layoutAll(),
    tracks: Music.tracks.map(t => ({ id:t.id, name:t.name, size:t.size, note:"audio blob not exported" }))
  };
  const text = JSON.stringify(payload, null, 2);

  /* On the desktop this is a real Save dialog writing a real file, rather
     than a browser download that may land somewhere you did not choose. */
  if (Store.mode === "desktop"){
    try {
      const res = await Desktop.api.exportJson(text, "chamber-backup-" + dayKey() + ".json");
      if (res && res.canceled) return;
      UI.write({ lastExport: Date.now() });
      toast("Backup written to " + (res && res.path ? res.path : "disk"), "ok", 8000);
    } catch(err){ toast("Export failed: " + err.message, "warn", 8000); }
    return;
  }

  const blob = new Blob([text], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "chamber-backup-" + dayKey() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 20000);
  UI.write({ lastExport: Date.now() });          // resets the backup reminder
  toast("Exported.", "ok");
}

/* A browser can evict site data, and no amount of code in this page can stop
   it. The only real protection is a file on disk, so nag - gently, once per
   session - when the last export is getting old or was never taken. */
function backupReminder(){
  const ui = UI.read();
  const last = ui.lastExport || 0;
  const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
  if (last && days < CONFIG.EXPORT_NAG_DAYS) return;
  const msg = last
    ? "Your last backup was " + days + " days ago. Settings -> EXPORT JSON keeps a copy safe on disk."
    : "No backup taken yet. Browsers can clear site data on their own - Settings -> EXPORT JSON puts a copy on disk.";
  setTimeout(() => toast(msg, "warn", 14000), 3500);   // after the intro settles
}

/* accepts a File (browser) or a raw JSON string (desktop dialog) */
async function importJson(file){
  let payload;
  try { payload = JSON.parse(typeof file === "string" ? file : await file.text()); }
  catch(err){ toast("That file is not valid JSON.", "warn"); return; }

  const incoming = payload.state || payload;   // tolerate a bare state dump
  let candidate;
  try { candidate = migrate(JSON.parse(JSON.stringify(incoming))); }
  catch(err){ toast("Import failed during migration.", "warn"); return; }
  const problem = validate(candidate);
  if (problem){ toast("Import rejected: " + problem, "warn", 9000); return; }
  if (!confirm("Replace everything currently in the room with this backup?")) return;

  await writeBackup();                          // snapshot what we are replacing
  state = candidate;
  try {
    await Store.kvSet("state", state);
    for (const m of (payload.messages || [])) await Store.msgPut(m);
    for (const f of (payload.files || [])) await Store.filePut(f);
    for (const l of (payload.layout || [])) await Store.layoutPut(l);
    if (Store.ok && payload.wallpaper && payload.wallpaper.dataURL){
      await Store.putInto("roomConfig", Object.assign({}, payload.wallpaper, { id:"wallpaper" }));
    }

    /* rebuild custom sprites and their dialogue from the data URLs */
    if (Store.ok && Array.isArray(payload.sprites)){
      for (const s of payload.sprites){
        if (!s.img) continue;
        try {
          const blob = await (await fetch(s.img)).blob();   // data: URL, no network
          await Store.putInto("sprites", { id:s.id, name:s.name, type:s.type || blob.type,
            blob:blob, w:s.w || 120, h:s.h || 120, isPet:!!s.isPet,
            lines:s.lines || [], addedAt:s.addedAt || Date.now() });
        } catch(err){ console.warn("[chamber] sprite import failed", err); }
      }
    }
  } catch(err){ handleWriteError(err); }

  if (Store.ok && payload.frameLinks){
    try { await Store.putInto("roomConfig", { id:"frameLinks", links:payload.frameLinks, updated:Date.now() }); }
    catch(err){ console.warn("[chamber] frame link import failed", err); }
  }

  await Layout.load();
  await Decor.load();
  await Wallpaper.load();
  await Frames.load();
  Lights.refresh();
  ensureDailyLog(); purgeExpiredTrash(); updateBadges();
  Organizer.close();
  Settings.refreshSprites();
  toast("Imported. Sprites and pet dialogue came back; gramophone audio has to be re-added.", "ok", 9000);
}

/* =========================================================================
   ============================== PHASE 2 ==================================
   ========================================================================= */

/* -------------------------------------------------------------------------
   [SECTION: LOOP]  ONE requestAnimationFrame loop for the whole application.
   Parallax, flame flicker, clock hands, drag and audio scheduling are all
   subscribers. Nothing in this file uses setInterval, and no handler does
   layout work on mousemove - handlers only cache values that this loop then
   reads once per frame. The loop stops dead when the tab is hidden.
   ---------------------------------------------------------------------- */
const Loop = {
  subs: [], running:false, last:0, rafId:0,

  add(fn){ this.subs.push(fn); return fn; },

  start(){
    if (this.running) return;
    this.running = true;
    this.last = performance.now();
    const step = now => {
      if (!this.running) return;
      // dt in seconds, clamped so a background stall cannot fling anything
      const dt = Math.min(0.05, (now - this.last) / 1000);
      this.last = now;
      for (let i = 0; i < this.subs.length; i++){
        try { this.subs[i](dt, now); }
        catch(err){ console.error("[chamber] frame task failed", err); }
      }
      this.rafId = requestAnimationFrame(step);
    };
    this.rafId = requestAnimationFrame(step);
  },

  stop(){ this.running = false; cancelAnimationFrame(this.rafId); }
};

/* Frame-rate independent lerp: `smooth` is the fraction still remaining
   after one second, so motion feels identical at 60, 120 or 144 Hz. */
function lerpTo(cur, target, smooth, dt){
  return cur + (target - cur) * (1 - Math.pow(smooth, dt));
}
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

/* cheap smooth value noise - used for flame flicker and crackle timing */
function hash1(n){ const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function vnoise(t){
  const i = Math.floor(t), f = t - i;
  const a = hash1(i), b = hash1(i + 1);
  const u = f * f * (3 - 2 * f);
  return a + (b - a) * u;
}

/* -------------------------------------------------------------------------
   [SECTION: PARALLAX]  Three depth layers at 4 / 10 / 18 px.
   The mousemove handler does nothing but store two numbers. All movement
   happens in the frame loop, on transform only, and vertical travel is
   clamped hard so furniture can never drift off the floor baseline.
   ---------------------------------------------------------------------- */
const Parallax = {
  tx:0, ty:0, x:0, y:0, layers:[], enabled:true,

  init(){
    this.layers = $$(".layer").map(el => ({ el:el, depth:+el.getAttribute("data-depth") || 0 }));
    window.addEventListener("mousemove", ev => {           // cache only
      this.tx = (ev.clientX / window.innerWidth  - 0.5) * 2;
      this.ty = (ev.clientY / window.innerHeight - 0.5) * 2;
    }, { passive:true });
    window.addEventListener("mouseleave", () => { this.tx = 0; this.ty = 0; }, { passive:true });
    Loop.add(this.update.bind(this));
  },

  /* snap every layer back to its neutral position right now */
  reset(){
    this.x = this.y = this.tx = this.ty = 0;
    for (const L of this.layers) L.el.style.transform = "translate3d(0,0,0)";
  },

  update(dt){
    // in rearrange mode the layers freeze, so dragged coordinates stay honest
    const tx = this.enabled ? this.tx : 0;
    const ty = this.enabled ? this.ty : 0;
    this.x = lerpTo(this.x, tx, CONFIG.PARALLAX_SMOOTH, dt);
    this.y = lerpTo(this.y, ty, CONFIG.PARALLAX_SMOOTH, dt);
    for (const L of this.layers){
      const dx = clamp(-this.x * L.depth, -L.depth, L.depth);
      const dy = clamp(-this.y * L.depth * CONFIG.PARALLAX_Y_RATIO,
                       -CONFIG.PARALLAX_Y_CLAMP, CONFIG.PARALLAX_Y_CLAMP);
      L.el.style.transform = "translate3d(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px,0)";
    }
  }
};

/* -------------------------------------------------------------------------
   [SECTION: AMBIENCE]  Time-of-day lighting, dust motes, candle flicker.
   ---------------------------------------------------------------------- */
const Ambience = {
  override:"auto",        // "auto" | "day" | "night"
  lastPeriod:null,
  flameCache:{},

  /* ---- the four moods ----
     No tint or wash any more. Time of day now only changes how heavy the
     vignette sits, how hard the candles burn, and how strong the daylight
     shaft is - so the wallpaper and the wood keep their contrast all day. */
  periods:{
    dawn:    { glass:"#8794a0", vig:.86, lamp:.72, shaft:.55 },
    day:     { glass:"#93a7b4", vig:.60, lamp:.34, shaft:1   },
    evening: { glass:"#6a5a63", vig:.92, lamp:.88, shaft:.45 },
    night:   { glass:"#1b2340", vig:1.0, lamp:1.15,shaft:.12 }
  },

  periodFor(hour){
    if (this.override === "day")   return "day";
    if (this.override === "night") return "night";
    if (hour < 5)  return "night";
    if (hour < 8)  return "dawn";
    if (hour < 17) return "day";
    if (hour < 21) return "evening";
    return "night";                       // after 9pm: candlelight
  },

  applyLighting(force){
    const name = this.periodFor(new Date().getHours());
    if (name === this.lastPeriod && !force) return;
    this.lastPeriod = name;
    const p = this.periods[name];
    const r = document.documentElement.style;
    r.setProperty("--glass",    p.glass);
    r.setProperty("--vig",      String(p.vig));
    r.setProperty("--lamp",     String(p.lamp));
    r.setProperty("--shaft-op", String(p.shaft));
  },

  /* ---- 12 dust specks, seeded once, animated purely by CSS ---- */
  seedMotes(){
    const host = $("#motes");
    if (!host) return;
    host.innerHTML = "";
    const shaft = $(".shaft");
    const room  = $("#room").getBoundingClientRect();
    const box   = shaft ? shaft.getBoundingClientRect() : room;
    for (let i = 0; i < CONFIG.MOTE_COUNT; i++){
      const m = document.createElement("span");
      m.className = "mote";
      // concentrated in the window's light shaft, with a little spill
      const x = box.left - room.left + Math.random() * box.width;
      const y = box.top  - room.top  + box.height * (0.35 + Math.random() * 0.65);
      m.style.left = Math.round(x) + "px";
      m.style.top  = Math.round(y) + "px";
      m.style.animationDuration = (9 + Math.random() * 13).toFixed(1) + "s";
      m.style.animationDelay    = (-Math.random() * 20).toFixed(1) + "s";  // stagger
      m.style.opacity = (0.45 + Math.random() * 0.55).toFixed(2);
      host.appendChild(m);
    }
  },

  /* ---- candle flicker: three noise bands at unrelated speeds, so it never
     settles into a clean sine. Blur is quantised because writing a new
     filter string every frame is the one genuinely expensive part. ---- */
  /* Every flame is on its own noise phase, so nothing pulses in unison.
     The list is built once - querying the DOM every frame is wasteful. */
  buildFlames(){
    this.flames = [
      { el:$("#fgFlame"),               glow:$("#fgGlow"),    key:"fg",  phase:0    },
      { el:$("#shelfFlame"),            glow:$("#shelfGlow"), key:"sh",  phase:40   },
      { el:$("#sconceFlameL"),          glow:null,            key:"scL", phase:117  },
      { el:$("#sconceFlameR"),          glow:null,            key:"scR", phase:213  },
      { el:$("#candlePointer .c-flame"),glow:null,            key:"ptr", phase:71   }
    ].filter(f => f.el);
    this.level = {};        // last flicker value per flame, read by Lights
  },

  flicker(dt, now){
    const t = now * 0.001;
    if (!this.flames) this.buildFlames();
    for (const f of this.flames){
      const jitter = vnoise(t * 5.7 + f.phase) * 0.5 +
                     vnoise(t * 13.3 + f.phase) * 0.32 +
                     vnoise(t * 27.1 + f.phase) * 0.18;
      this.level[f.key] = jitter;
      f.el.style.opacity = (0.70 + jitter * 0.30).toFixed(2);
      f.el.style.transform = "translate3d(0,0,0) scale(" +
        (0.90 + jitter * 0.14).toFixed(3) + "," + (0.84 + jitter * 0.30).toFixed(3) + ")";
      const blur = Math.round(jitter * 3) / 2;                     // 0, .5, 1, 1.5
      if (this.flameCache[f.key] !== blur){
        this.flameCache[f.key] = blur;
        f.el.style.filter = blur ? "blur(" + blur + "px)" : "none";
      }
      if (f.glow) f.glow.style.opacity = (0.45 + jitter * 0.55).toFixed(2);
    }
  },

  init(){
    this.override = UI.read().lighting || "auto";
    this.applyLighting(true);
    this.seedMotes();
    Loop.add(this.flicker.bind(this));
    Loop.add(dt => Decor.typeFrame(dt));      // pet typewriter reveal
    let acc = 0;
    Loop.add(dt => {                       // cheap once-a-second housekeeping
      acc += dt;
      if (acc < 1) return;
      acc = 0;
      this.applyLighting(false);
      Sky.apply();            // sky gradient + sun/moon arc follow the same clock
      Sky.roll();             // "auto" weather rolls the dice on its own schedule
      RoomEcho.clockFace();
      RoomEcho.calendar();
      RoomEcho.candle();
    });
    window.addEventListener("resize", () => {
      this.seedMotes();
      Decor.reclampAll();       // keep speech bubbles on screen after a resize
    }, { passive:true });
  }
};

/* -------------------------------------------------------------------------
   [SECTION: AUDIO]  Procedural Web Audio. No files, no network.
     fireplace = pink-noise bed + randomly scheduled crackle bursts
     rain      = band-passed white noise with two slow LFOs
     clock     = a scheduled tick, twice a second
     creak     = a pitch-bent wooden groan when a drawer/modal opens
   Routing:  source -> sourceGain -> ambientGain -> masterGain -> speakers
             sfx    -> sfxGain    -> masterGain
   The context is only created after a real user gesture (autoplay policy),
   and all burst scheduling happens inside the single rAF loop.
   ---------------------------------------------------------------------- */
const Sound = {
  ctx:null, master:null, ambient:null, sfx:null,
  beds:{}, on:{ fire:false, rain:false, clock:false },
  vol:{ master:.7, ambient:.6 }, sfxOn:true, typeOn:true,
  nextCrackle:0, nextTick:0, started:false,

  /* ---- noise buffers ---- */
  whiteBuffer(seconds){
    const len = Math.floor(this.ctx.sampleRate * seconds);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  },
  pinkBuffer(seconds){                   // Paul Kellet's economy pink filter
    const len = Math.floor(this.ctx.sampleRate * seconds);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i = 0; i < len; i++){
      const w = Math.random() * 2 - 1;
      b0 = 0.99886*b0 + w*0.0555179; b1 = 0.99332*b1 + w*0.0750759;
      b2 = 0.96900*b2 + w*0.1538520; b3 = 0.86650*b3 + w*0.3104856;
      b4 = 0.55000*b4 + w*0.5329522; b5 = -0.7616*b5 - w*0.0168980;
      d[i] = (b0+b1+b2+b3+b4+b5+b6 + w*0.5362) * 0.11;
      b6 = w * 0.115926;
    }
    return buf;
  },

  ensure(){
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ return false; }
    try {
      this.ctx = new AC();
      this.master  = this.ctx.createGain();
      this.ambient = this.ctx.createGain();
      this.sfx     = this.ctx.createGain();
      this.master.connect(this.ctx.destination);
      this.ambient.connect(this.master);
      this.sfx.connect(this.master);
      this.applyVolumes();
      this.nextCrackle = this.ctx.currentTime + 0.4;
      this.nextTick    = this.ctx.currentTime + 1;
      Loop.add(this.schedule.bind(this));
      return true;
    } catch(err){ console.warn("[chamber] audio unavailable", err); return false; }
  },

  applyVolumes(){
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(this.vol.master, t, .02);
    this.ambient.gain.setTargetAtTime(this.vol.ambient, t, .02);
    this.sfx.gain.setTargetAtTime(this.sfxOn ? 1 : 0, t, .02);
  },

  setVolume(which, value){
    this.vol[which] = clamp(value, 0, 1);
    this.applyVolumes();
    UI.write({ volMaster:this.vol.master, volAmbient:this.vol.ambient });
  },

  /* ---- the two continuous beds ---- */
  buildFire(){
    const src = this.ctx.createBufferSource();
    src.buffer = this.pinkBuffer(4); src.loop = true;
    const lp = this.ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 780; lp.Q.value = .6;
    const g = this.ctx.createGain(); g.gain.value = 0;
    src.connect(lp); lp.connect(g); g.connect(this.ambient);
    src.start();
    return { src:src, gain:g };
  },
  buildRain(){
    const src = this.ctx.createBufferSource();
    src.buffer = this.whiteBuffer(4); src.loop = true;
    const bp = this.ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 1400; bp.Q.value = .7;
    const hp = this.ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 420;
    const g = this.ctx.createGain(); g.gain.value = 0;
    // two slow oscillators keep the hiss breathing like weather on glass
