    const lfoF = this.ctx.createOscillator(); lfoF.frequency.value = .07;
    const lfoFg = this.ctx.createGain(); lfoFg.gain.value = 380;
    lfoF.connect(lfoFg); lfoFg.connect(bp.frequency); lfoF.start();
    const lfoA = this.ctx.createOscillator(); lfoA.frequency.value = .13;
    const lfoAg = this.ctx.createGain(); lfoAg.gain.value = .12;
    const amp = this.ctx.createGain(); amp.gain.value = .8;
    lfoA.connect(lfoAg); lfoAg.connect(amp.gain); lfoA.start();
    src.connect(bp); bp.connect(hp); hp.connect(amp); amp.connect(g); g.connect(this.ambient);
    src.start();
    return { src:src, gain:g };
  },

  toggle(which, want){
    if (!this.ensure()) return false;
    if (this.ctx.state === "suspended") this.ctx.resume();
    const on = want === undefined ? !this.on[which] : !!want;
    this.on[which] = on;
    if (which === "fire" || which === "rain"){
      if (!this.beds[which]) this.beds[which] = which === "fire" ? this.buildFire() : this.buildRain();
      const target = on ? (which === "fire" ? .55 : .35) : 0;
      this.beds[which].gain.gain.setTargetAtTime(target, this.ctx.currentTime, .45);
    }
    UI.write({ ambFire:this.on.fire, ambRain:this.on.rain, ambClock:this.on.clock });
    return on;
  },

  /* ---- scheduled one-shots, driven from the frame loop ---- */
  schedule(){
    if (!this.ctx || this.ctx.state !== "running") return;
    const now = this.ctx.currentTime, ahead = now + CONFIG.AUDIO_LOOKAHEAD;
    if (this.on.fire){
      while (this.nextCrackle < ahead){
        this.crackle(Math.max(this.nextCrackle, now));
        // irregular gaps: 60ms .. 620ms, noise-driven so it never pulses
        this.nextCrackle += 0.06 + vnoise(this.nextCrackle * 3.3) * 0.56;
      }
    } else this.nextCrackle = now + 0.3;
    if (this.on.clock){
      while (this.nextTick < ahead){
        this.tick(Math.max(this.nextTick, now));
        this.nextTick += 1;
      }
    } else this.nextTick = now + 1;
  },

  crackle(at){
    const dur = 0.02 + Math.random() * 0.05;
    const src = this.ctx.createBufferSource();
    src.buffer = this.whiteBuffer(dur + .02);
    const bp = this.ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 1200 + Math.random() * 3200;
    bp.Q.value = 3 + Math.random() * 6;
    const g = this.ctx.createGain();
    const peak = 0.05 + Math.random() * 0.30;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    src.connect(bp); bp.connect(g); g.connect(this.ambient);
    src.start(at); src.stop(at + dur + .02);
  },

  tick(at){
    const osc = this.ctx.createOscillator();
    osc.type = "square"; osc.frequency.value = 1800;
    const hp = this.ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 900;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(.06, at + .002);
    g.gain.exponentialRampToValueAtTime(.0001, at + .05);
    osc.connect(hp); hp.connect(g); g.connect(this.ambient);
    osc.start(at); osc.stop(at + .06);
  },

  /* A muted typewriter tick. Deliberately tiny: a short band-passed noise
     burst with a fast decay, so a stream of them reads as typing rather
     than as a rattle. Silenced by the TYPING SOUNDS switch in Settings. */
  type(){
    if (!this.typeOn || !this.sfxOn) return;
    if (!this.ctx || this.ctx.state !== "running") return;
    const t = this.ctx.currentTime, dur = .022;
    const src = this.ctx.createBufferSource();
    src.buffer = this.whiteBuffer(dur + .01);
    const bp = this.ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 2100 + Math.random() * 900;
    bp.Q.value = 9;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.035, t + .002);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(this.sfx);
    src.start(t); src.stop(t + dur + .01);
  },

  /* wooden groan for opening a drawer / modal */
  creak(){
    if (!this.sfxOn || !this.ensure()) return;
    if (this.ctx.state === "suspended") this.ctx.resume();
    const t = this.ctx.currentTime, dur = .34;
    const osc = this.ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(118, t);
    osc.frequency.exponentialRampToValueAtTime(63, t + dur);
    const lp = this.ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 900; lp.Q.value = 4;
    const noise = this.ctx.createBufferSource();
    noise.buffer = this.whiteBuffer(dur);
    const nbp = this.ctx.createBiquadFilter();
    nbp.type = "bandpass"; nbp.frequency.value = 320; nbp.Q.value = 7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.22, t + .05);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(lp); lp.connect(g);
    noise.connect(nbp); nbp.connect(g);
    g.connect(this.sfx);
    osc.start(t); osc.stop(t + dur);
    noise.start(t); noise.stop(t + dur);
  },

  restore(){
    const ui = UI.read();
    if (typeof ui.volMaster  === "number") this.vol.master  = ui.volMaster;
    if (typeof ui.volAmbient === "number") this.vol.ambient = ui.volAmbient;
    if (typeof ui.sfxOn === "boolean") this.sfxOn = ui.sfxOn;
    if (typeof ui.typeOn === "boolean") this.typeOn = ui.typeOn;
    this.pending = { fire:!!ui.ambFire, rain:!!ui.ambRain, clock:!!ui.ambClock };
  },

  /* ambient beds stay off until the first gesture - browsers demand it */
  wake(){
    if (this.started) return;
    this.started = true;
    if (!this.pending) return;
    if (this.pending.fire || this.pending.rain || this.pending.clock){
      if (!this.ensure()) return;
      this.ctx.resume();
      if (this.pending.fire)  this.toggle("fire", true);
      if (this.pending.rain)  this.toggle("rain", true);
      if (this.pending.clock) this.toggle("clock", true);
    }
  }
};

/* -------------------------------------------------------------------------
   [SECTION: REFLECT]  The room reads your data back to you.
   ---------------------------------------------------------------------- */
const RoomEcho = {
  /* progress of one entry as 0..1, or null when it tracks nothing */
  progressOf(e){
    if (e.type === "list"){
      if (!e.items.length) return 0;
      return e.items.filter(i => i.done).length / e.items.length;
    }
    const done = (String(e.body).match(/^\s*[-*]\s+\[[xX]\]/gm) || []).length;
    const open = (String(e.body).match(/^\s*[-*]\s+\[ \]/gm) || []).length;
    if (!done && !open) return null;
    return done / (done + open);
  },

  /* ---- book spines, generated from the Reading Log, coloured by progress -- */
  spines(){
    const shelves = $$("[data-shelf]");
    if (!shelves.length) return;
    const lib = getRoom("library");
    let entries = [];
    if (lib){
      const cat = lib.categories.find(c => /reading/i.test(c.name));
      // every reading-log entry becomes a spine; list items become spines too,
      // so a "Currently reading" list shows one book per line
      if (cat) cat.entries.forEach(e => {
        if (e.type === "list" && e.items.length)
          e.items.forEach(it => entries.push({ title:it.text || "untitled", p:it.done ? 1 : 0 }));
        else entries.push({ title:e.title, p:this.progressOf(e) });
      });
    }
    entries = entries.filter(e => e.title && e.title.trim()).slice(0, CONFIG.MAX_SPINES);

    shelves.forEach(s => s.innerHTML = "");
    entries.forEach((e, i) => {
      const shelf = shelves[i % shelves.length];
      const sp = document.createElement("i");
      sp.className = "spine";
      const p = e.p;
      // unread = cold blue, in progress = amber, finished = gold
      const colour = p === null ? "#3b4a63" : p >= 1 ? "#c9a227"
                   : p > 0 ? "#a86a1e" : "#2c3a5b";
      sp.style.background = colour;
      const h = 58 + (hash1(i * 7.7 + e.title.length) * 34);
      sp.style.height = h.toFixed(0) + "%";
      sp.style.width  = (10 + Math.round(hash1(i * 3.1) * 7)) + "px";
      sp.title = e.title + (p === null ? "" : "  -  " + Math.round(p * 100) + "%");
      shelf.appendChild(sp);
    });

    /* Pad the shelves with dim filler books so a thin reading log still
       reads as a bookshelf. Filler is faded and clearly labelled. */
    shelves.forEach((s, si) => {
      let n = s.children.length;
      for (let i = n; i < 6 + (si % 2); i++){
        const sp = document.createElement("i");
        sp.className = "spine s" + (1 + ((i + si) % 6));
        sp.style.opacity = ".35";
        sp.title = "Add entries to the Reading Log to fill this shelf";
        s.appendChild(sp);
      }
    });
  },

  /* ---- the paper stack grows with unfinished work ---- */
  papers(){
    const host = $("#deskStack");
    if (!host) return;
    let open = 0;
    state.rooms.forEach(r => r.categories.forEach(c => c.entries.forEach(e => {
      if (e.type === "list") open += e.items.filter(i => !i.done).length;
      else open += (String(e.body).match(/^\s*[-*]\s+\[ \]/gm) || []).length;
    })));
    const sheets = Math.min(CONFIG.MAX_SHEETS, open);   // one sheet per open task
    host.innerHTML = "";
    for (let i = 0; i < sheets; i++){
      const s = document.createElement("span");
      s.className = "sheet";
      s.style.bottom = (i * 5) + "px";
      s.style.left = (Math.round(hash1(i * 5.3) * 7) - 3) + "px";
      s.style.transform = "rotate(" + (hash1(i * 2.2) * 4 - 2).toFixed(1) + "deg)";
      host.appendChild(s);
    }
    host.title = open + " unfinished task(s)";
  },

  /* ---- the candle burns down over the day and is whole again at midnight -- */
  candle(){
    const wax = $("#fgWax"), flame = $("#fgFlame");
    if (!wax) return;
    const now = new Date();
    const frac = (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) / 86400;
    const full = 76, low = 16;
    const h = Math.round(full - (full - low) * frac);
    wax.style.height = h + "px";
    if (flame) flame.style.bottom = h + "px";
  },

  /* ---- wall clock: second hand steps, the others glide ---- */
  clockFace(){
    const h = $("#handH"), m = $("#handM"), s = $("#handS");
    if (!h) return;
    const d = new Date();
    const sec = d.getSeconds(), min = d.getMinutes(), hr = d.getHours() % 12;
    /* Second and minute hands STEP, they do not sweep. A real clock creeps
       the minute hand through the minute, but on a pixel dial that reads as
       a misaligned hand at 10:00 sharp, so both snap to their marks. The
       hour hand still travels gradually - it should be halfway at half past. */
    s.style.transform = "translate3d(0,0,0) rotate(" + (sec * 6) + "deg)";
    m.style.transform = "translate3d(0,0,0) rotate(" + (min * 6) + "deg)";
    h.style.transform = "translate3d(0,0,0) rotate(" + (hr * 30 + min * 0.5) + "deg)";
  },

  calendar(){
    const d = new Date();
    const key = dayKey(d);
    if (this._calKey === key) return;          // only redraw when the day turns
    this._calKey = key;
    const mo = $("#calMonth"), dy = $("#calDay"), wd = $("#calWeekday");
    if (!mo) return;
    mo.textContent = d.toLocaleDateString(undefined, { month:"long" }).toUpperCase();
    dy.textContent = d.getDate();
    wd.textContent = d.toLocaleDateString(undefined, { weekday:"long" }).toUpperCase();
  },

  render(){ this.spines(); this.papers(); this.candle(); this.calendar(); this.clockFace(); }
};

/* -------------------------------------------------------------------------
   [SECTION: LAYOUT]  Rearrange mode.
   Positions are stored as { id, x, y } where x is a fraction of the room
   width and y is pixels above the floor line, so a custom arrangement
   survives a window resize instead of sliding off screen.
   ---------------------------------------------------------------------- */
const Layout = {
  data:{}, editing:false, snap:true, drag:null,

  async load(){
    try {
      (await Store.layoutAll()).forEach(r => { this.data[r.id] = { x:r.x, y:r.y }; });
    } catch(err){ console.warn("[chamber] layout load failed", err); }
    this.snap = UI.read().snap !== false;
    this.applyAll();
  },

  applyAll(){ $$("[data-move]").forEach(el => this.apply(el)); },

  apply(el){
    const rec = this.data[el.getAttribute("data-move")];
    if (!rec) return;
    if (typeof rec.x === "number") el.style.left = (rec.x * 100).toFixed(3) + "%";
    if (typeof rec.y === "number") el.style.bottom = "calc(var(--floor-line) + " + Math.round(rec.y) + "px)";
    el.style.transform = (rec.s && rec.s !== 1) ? "scale(" + rec.s + ")" : "";
  },

  scaleOf(id){ const r = this.data[id]; return (r && r.s) || 1; },

  /* Capture an object's current position so it can be given a record the
     first time it is scaled, before it has ever been dragged. */
  measure(el){
    const room = $("#room").getBoundingClientRect();
    if (!room.width || !room.height) return { s:1 };   // no size: scale only
    const r = el.getBoundingClientRect();
    const floorPx = room.height * (parseFloat(getComputedStyle(document.documentElement)
                      .getPropertyValue("--floor-line")) / 100);
    return { x:(r.left - room.left) / room.width,
             y:(room.bottom - r.bottom) - floorPx,
             s:1 };
  },

  /* Resize. Multiplies the stored scale and re-applies; the drag code
     composes this with its translate so moving a scaled object still works. */
  scaleBy(id, factor){
    const el = document.querySelector('[data-move="' + id + '"]');
    if (!el) return;
    if (!this.data[id]) this.data[id] = this.measure(el);
    const rec = this.data[id];
    rec.s = +clamp((rec.s || 1) * factor, 0.35, 3).toFixed(3);
    this.apply(el);
    this.queueSave(id);
    const bar = $("#editScale");
    if (bar) bar.textContent = Math.round(rec.s * 100) + "%";
    return rec.s;
  },

  resetScale(id){
    const rec = this.data[id];
    if (!rec) return;
    rec.s = 1;
    this.apply(document.querySelector('[data-move="' + id + '"]'));
    this.queueSave(id);
  },

  /* the wheel fires fast; coalesce the writes */
  queueSave(id){
    clearTimeout(this._saveTimers && this._saveTimers[id]);
    this._saveTimers = this._saveTimers || {};
    this._saveTimers[id] = setTimeout(() => {
      const r = this.data[id];
      if (r) Store.layoutPut({ id:id, x:r.x, y:r.y, s:r.s || 1 }).catch(handleWriteError);
    }, 250);
  },

  enterEdit(){
    this.editing = true;
    document.body.classList.add("editing");
    $("#editBar").classList.remove("hidden");
    // Freeze AND zero the layers immediately: a half-eased parallax offset
    // would otherwise leak into the coordinates measured on drop.
    Parallax.enabled = false;
    Parallax.reset();
    KeyNav.blur();
    toast("Rearrange mode: drag the furniture. LOCK LAYOUT when you are done.", "ok", 6000);
  },

  exitEdit(){
    this.editing = false;
    document.body.classList.remove("editing");
    $("#editBar").classList.add("hidden");
    Parallax.enabled = true;
  },

  async reset(){
    this.data = {};
    try { await Store.layoutClear(); } catch(err){ handleWriteError(err); }
    $$("[data-move]").forEach(el => { el.style.left = ""; el.style.bottom = ""; el.style.transform = ""; });
    Ambience.seedMotes();
    toast("Layout reset to the original arrangement.", "ok");
  },

  init(){
    const room = $("#room");

    room.addEventListener("pointerdown", ev => {
      if (!this.editing) return;
      const el = ev.target.closest("[data-move]");
      if (!el) return;
      ev.preventDefault();
      this.movedDuringDrag = false;   // so a real drag does not also open a dialog
      const r = el.getBoundingClientRect();
      this.lastTouched = el.getAttribute("data-move");
      const scaleBar = $("#editScale");
      if (scaleBar) scaleBar.textContent = Math.round(this.scaleOf(this.lastTouched) * 100) + "%";
      this.drag = { el:el, id:el.getAttribute("data-move"), s:this.scaleOf(el.getAttribute("data-move")),
                    sx:ev.clientX, sy:ev.clientY, px:ev.clientX, py:ev.clientY,
                    w:r.width, h:r.height, dx:0, dy:0 };
      el.setPointerCapture(ev.pointerId);
      el.classList.add("dragging");
    });

    // the move handler only caches coordinates; the frame loop does the work
    room.addEventListener("pointermove", ev => {
      if (!this.drag) return;
      this.drag.px = ev.clientX; this.drag.py = ev.clientY;
    }, { passive:true });

    const finish = ev => {
      const d = this.drag;
      if (!d) return;
      this.drag = null;
      d.el.classList.remove("dragging");
      try { d.el.releasePointerCapture(ev.pointerId); } catch(e){}
      this.commit(d);
    };
    room.addEventListener("pointerup", finish);
    room.addEventListener("pointercancel", finish);

    Loop.add(() => {
      const d = this.drag;
      if (!d) return;
      d.dx = d.px - d.sx; d.dy = d.py - d.sy;
      if (Math.abs(d.dx) > 3 || Math.abs(d.dy) > 3) this.movedDuringDrag = true;
      // keep any custom scale while dragging, or the object would pop to 100%
      d.el.style.transform = "translate3d(" + d.dx + "px," + d.dy + "px,0)" +
                             (d.s && d.s !== 1 ? " scale(" + d.s + ")" : "");
    });

    /* Scroll over an object in edit mode to resize it. */
    room.addEventListener("wheel", ev => {
      if (!this.editing) return;
      const el = ev.target.closest("[data-move]");
      if (!el) return;
      ev.preventDefault();
      this.lastTouched = el.getAttribute("data-move");
      this.scaleBy(this.lastTouched, ev.deltaY < 0 ? 1.08 : 1 / 1.08);
    }, { passive:false });

    $("#btnLockLayout").addEventListener("click", () => this.exitEdit());
    $("#btnResetLayout").addEventListener("click", () => this.reset());
    const needTarget = () => {
      if (this.lastTouched) return true;
      toast("Click or drag the piece you want to resize first.", null, 4000);
      return false;
    };
    $("#btnSizeUp").addEventListener("click", () => needTarget() && this.scaleBy(this.lastTouched, 1.12));
    $("#btnSizeDown").addEventListener("click", () => needTarget() && this.scaleBy(this.lastTouched, 1/1.12));
    $("#btnSizeReset").addEventListener("click", () => {
      if (!needTarget()) return;
      this.resetScale(this.lastTouched);
      $("#editScale").textContent = "100%";
    });
    $("#snapSwitch").addEventListener("click", () => {
      this.snap = !this.snap;
      $("#snapSwitch").classList.toggle("on", this.snap);
      UI.write({ snap:this.snap });
    });
    $("#snapSwitch").classList.toggle("on", this.snap);
  },

  /* turn the drag delta into stored coordinates and clear the transform */
  commit(d){
    const room = $("#room").getBoundingClientRect();
    /* If the room has no size - window minimised, tab backgrounded mid-drag,
       pane collapsed - every coordinate below divides by zero and would save
       Infinity/NaN over a perfectly good position. Abandon the drag instead. */
    if (!room.width || !room.height){
      d.el.style.transform = "";
      this.apply(d.el);              // put it back exactly where it was
      return;
    }
    d.el.style.transform = "";        // drop the drag transform; apply() re-adds scale

    /* Work in LAYOUT space, not painted space. offsetLeft/offsetTop ignore
       transforms, so a scaled object lands where it was dropped instead of
       jumping by half its scaled overhang. The offset parent is the layer,
       which is inset:0 over the room, so these are room-relative already. */
    const parentH = d.el.offsetParent ? d.el.offsetParent.offsetHeight : room.height;
    const w = d.el.offsetWidth, h = d.el.offsetHeight;
    const floorPx = room.height * (parseFloat(getComputedStyle(document.documentElement)
                      .getPropertyValue("--floor-line")) / 100);

    let x = (d.el.offsetLeft + d.dx) / room.width;
    const bottomPx = parentH - (d.el.offsetTop + h) - d.dy;   // the element's CSS `bottom`
    let y = bottomPx - floorPx;                               // height above the floor line

    // keep everything on screen and above the bottom edge
    x = clamp(x, 0, Math.max(0, 1 - w / room.width));
    const maxY = room.height - floorPx - h;
    const floorItem = d.el.hasAttribute("data-floor");
    if (floorItem && this.snap) y = 0;
    y = clamp(y, floorItem ? 0 : -floorPx + 4, Math.max(0, maxY));

    this.data[d.id] = { x:x, y:y, s:d.s || 1 };
    this.apply(d.el);
    Store.layoutPut({ id:d.id, x:x, y:y, s:d.s || 1 }).catch(handleWriteError);
    if (d.id === "candle" || d.id === "library") Ambience.seedMotes();
  }
};

/* -------------------------------------------------------------------------
   SPATIAL MODAL OPENING
   The panel starts at the clicked object's bounding box and flies to rest.
   A forced reflow between the two states starts the transition, which is
   more reliable than waiting on a frame that a hidden tab never delivers.
   ---------------------------------------------------------------------- */
function animateFrom(panel, srcEl, style){
  if (!panel) return;
  const wrap = panel.parentElement;
  if (wrap && wrap.classList.contains("modal-wrap")) wrap.classList.add("shown");
  if (!srcEl){
    panel.style.opacity = "0";
    void panel.offsetHeight;
    panel.classList.add("anim");
    panel.style.opacity = "1";
    return;
  }
  const s = srcEl.getBoundingClientRect();
  const p = panel.getBoundingClientRect();
  const dx = (s.left + s.width / 2) - (p.left + p.width / 2);
  const dy = (s.top + s.height / 2) - (p.top + p.height / 2);
  let start;
  if (style === "unfold"){                 // the desk unfolds a sheet of paper
    panel.style.transformOrigin = "center center";
    start = "translate3d(" + dx + "px," + dy + "px,0) scale(" +
            clamp(s.width / p.width, .08, 1).toFixed(3) + ",0.03)";
  } else if (style === "swing"){           // the wardrobe opens on its hinge
    panel.style.transformOrigin = "left center";
    start = "translate3d(" + dx + "px," + dy + "px,0) rotateY(-88deg) scale(.72)";
  } else if (style === "slide"){           // a volume slides out of the shelf
    panel.style.transformOrigin = "center center";
    start = "translate3d(" + (dx - 40) + "px," + dy + "px,0) scale(" +
            clamp(s.width / p.width, .1, 1).toFixed(3) + "," +
            clamp(s.height / p.height, .1, 1).toFixed(3) + ")";
  } else {
    panel.style.transformOrigin = "center center";
    start = "translate3d(" + dx + "px," + dy + "px,0) scale(.12)";
  }
  panel.style.transform = start;
  panel.style.opacity = "0.25";
  void panel.offsetHeight;                 // flush, so the transition has a start
  panel.classList.add("anim");
  panel.style.transform = "translate3d(0,0,0)";
  panel.style.opacity = "1";
  Sound.creak();
}
const OPEN_STYLE = { desk:"unfold", library:"slide", wardrobe:"swing", trash:"pop" };

/* -------------------------------------------------------------------------
   [SECTION: COMMAND PALETTE]  Ctrl+K. Fuzzy search over every entry,
   category and chat message.
   ---------------------------------------------------------------------- */
const Palette = {
  items:[], results:[], sel:0, open_:false,

  /* subsequence match: all needle chars in order, consecutive runs score
     higher, a hit at a word boundary scores higher again */
  score(hay, needle){
    if (!needle) return 0;
    const h = hay.toLowerCase(), n = needle.toLowerCase();
    let hi = 0, score = 0, run = 0;
    const hits = [];
    for (let ni = 0; ni < n.length; ni++){
      const c = n[ni];
      if (c === " ") continue;
      const found = h.indexOf(c, hi);
      if (found < 0) return -1;
      if (found === hi && hi > 0) { run++; score += 6 + run * 3; }
      else { run = 0; score += 1; }
      if (found === 0 || /[\s\-_/.,:(\[]/.test(h[found-1] || "")) score += 8;
      hits.push(found);
      hi = found + 1;
    }
    score -= Math.min(20, hi - n.length) * 0.15;    // prefer early, tight hits
    return score;
  },

  mark(text, needle){
    if (!needle) return esc(text);
    const h = text.toLowerCase();
    let hi = 0, out = "", last = 0;
    for (const c of needle.toLowerCase()){
      if (c === " ") continue;
      const f = h.indexOf(c, hi);
      if (f < 0) break;
      out += esc(text.slice(last, f)) + "<b>" + esc(text[f]) + "</b>";
      last = f + 1; hi = f + 1;
    }
    return out + esc(text.slice(last));
  },

  async build(){
    this.items = [];
    state.rooms.forEach(room => room.categories.forEach(cat => {
      this.items.push({ kind:"cat", id:cat.id, roomId:room.id, catId:cat.id,
                        text:cat.name, sub:room.name });
      cat.entries.forEach(e => {
        this.items.push({ kind:"entry", id:e.id, roomId:room.id, catId:cat.id,
                          text:e.title, body:e.body || "",
                          sub:room.name + " / " + cat.name });
        // list items are searchable too
        (e.items || []).forEach(it => {
          if (it.text) this.items.push({ kind:"entry", id:e.id, roomId:room.id, catId:cat.id,
                          text:it.text, sub:e.title + " (item)" });
        });
      });
    }));
    try {
      const msgs = await Store.msgsAll();
      msgs.forEach(m => this.items.push({ kind:"msg", id:m.id, owner:m.owner,
                        ts:m.ts, text:m.text || "", sub:ownerTitle(m.owner) }));
    } catch(err){ console.warn("[chamber] palette could not read chats", err); }
  },

  async open(){
    if (this.open_) return;
    this.open_ = true;
    $("#paletteRoot").innerHTML =
      '<div id="paletteWrap"><div class="palette">' +
        '<div class="p-head"><span>&#128220; THE GRIMOIRE</span><span class="spacer"></span>' +
          '<span class="muted">enter opens &middot; esc closes</span></div>' +
        '<input id="pInput" placeholder="Search entries, categories and every message you ever wrote..." autocomplete="off">' +
        '<div class="p-results" id="pResults"></div>' +
      "</div></div>";
    const wrap = $("#paletteWrap");
    wrap.classList.add("shown");
    animateFrom(wrap.querySelector(".palette"), null, "pop");

    await this.build();
    this.render("");

    const input = $("#pInput");
    input.focus();
    input.addEventListener("input", () => this.render(input.value));
    input.addEventListener("keydown", ev => {
      if (ev.key === "ArrowDown"){ ev.preventDefault(); this.move(1); }
      else if (ev.key === "ArrowUp"){ ev.preventDefault(); this.move(-1); }
      else if (ev.key === "Enter"){ ev.preventDefault(); this.activate(this.sel); }
      else if (ev.key === "Escape"){ ev.preventDefault(); this.close(); }
    });
    wrap.addEventListener("click", ev => {
      if (ev.target === wrap) return this.close();
      const row = ev.target.closest("[data-idx]");
      if (row) this.activate(+row.getAttribute("data-idx"));
    });
  },

  render(q){
    const host = $("#pResults");
    if (!host) return;
    const query = q.trim();
    if (!query){
      this.results = this.items.slice(0, 40);
    } else {
      const scored = [];
      for (const it of this.items){
        let s = this.score(it.text, query);
        if (s < 0 && it.body) { const b = this.score(it.body, query); if (b >= 0) s = b - 12; }
        if (s >= 0) scored.push({ it:it, s:s });
      }
      scored.sort((a,b) => b.s - a.s);
      this.results = scored.slice(0, 60).map(r => r.it);
    }
    this.sel = 0;
    if (!this.results.length){
      host.innerHTML = '<div class="p-empty">Nothing in the chamber matches that.</div>';
      return;
    }
    host.innerHTML = this.results.map((it, i) =>
      '<div class="p-item' + (i === 0 ? " sel" : "") + '" data-idx="' + i + '">' +
        '<span class="p-kind ' + it.kind + '">' +
          (it.kind === "msg" ? "CHAT" : it.kind === "cat" ? "CAT" : "NOTE") + "</span>" +
        '<span class="p-main">' + this.mark(it.text || "(empty)", query) + "</span>" +
        '<span class="p-sub">' + esc(it.sub || "") + "</span>" +
      "</div>").join("");
  },

  move(dir){
    if (!this.results.length) return;
    this.sel = (this.sel + dir + this.results.length) % this.results.length;
    const rows = $$(".p-item");
    rows.forEach((r, i) => r.classList.toggle("sel", i === this.sel));
    if (rows[this.sel]) rows[this.sel].scrollIntoView({ block:"nearest" });
  },

  async activate(i){
    const it = this.results[i];
    if (!it) return;
    this.close();
    if (it.kind === "msg"){
      Chat.open(it.owner, ownerTitle(it.owner), it.id);
      return;
    }
    Organizer.open(it.roomId, null, it.catId);
    if (it.kind === "entry") setTimeout(() => Organizer.flash(it.id), 60);
  },

  close(){
    this.open_ = false;
    $("#paletteRoot").innerHTML = "";
  }
};

/* -------------------------------------------------------------------------
   [SECTION: KEYBOARD NAV]  Tab / arrows cycle the hotspots, Enter opens,
   Escape closes. The focused object gets a floating candle pointer.
   ---------------------------------------------------------------------- */
const KeyNav = {
  order:[], idx:-1, el:null,

  init(){
    this.order = $$("[data-hotspot]");
    Loop.add(this.follow.bind(this));
    document.addEventListener("keydown", ev => {
      if (modalOpen() || Layout.editing) return;
      const tag = (ev.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if (ev.key === "Tab"){
        ev.preventDefault();
        this.step(ev.shiftKey ? -1 : 1);
      } else if (ev.key === "ArrowRight" || ev.key === "ArrowDown"){
        ev.preventDefault(); this.step(1);
      } else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp"){
        ev.preventDefault(); this.step(-1);
      } else if (ev.key === "Enter" && this.el){
        ev.preventDefault(); openHotspot(this.el);
      }
    });
  },

  step(dir){
    if (!this.order.length) return;
    this.idx = (this.idx + dir + this.order.length) % this.order.length;
    this.focus(this.order[this.idx]);
  },

  focus(el){
    this.blur();
    this.el = el;
    el.classList.add("focused");
    el.focus({ preventScroll:true });
    $("#candlePointer").classList.add("on");
  },

  blur(){
    if (this.el){
      this.el.classList.remove("focused");
      if (document.activeElement === this.el) this.el.blur();
    }
    this.el = null;
    const p = $("#candlePointer");
    if (p) p.classList.remove("on");
  },

  /* the pointer is glued to the focused object, so it rides the parallax */
  follow(){
    if (!this.el) return;
    const r = this.el.getBoundingClientRect();
    $("#candlePointer").style.transform =
      "translate3d(" + Math.round(r.left - 34) + "px," +
                       Math.round(r.top + r.height / 2 - 18) + "px,0)";
  }
};

function modalOpen(){
  return !!($("#modalRoot").firstChild || $("#chatRoot").firstChild || Palette.open_);
}

function notReady(){ toast("Still opening the chamber...", "warn", 2000); }

function openHotspot(el){
  if (!state) return notReady();
  const id = el.getAttribute("data-hotspot");
  if (id === "trash") Trash.open(el);
  else if (id === "gramophone") Music.open(el);
  else Organizer.open(id, el);
}

/* -------------------------------------------------------------------------
   [SECTION: IMAGING]  Shared downscaler.
   Animated GIFs are kept whole (re-encoding would kill the animation),
   PNGs stay PNG so transparency survives, everything else becomes JPEG.
   ---------------------------------------------------------------------- */
const Imaging = {
  blobToDataURL(blob){
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(fr.error);
      fr.readAsDataURL(blob);
    });
  },

  /* returns { dataURL, w, h, bytes } or null */
  async shrink(file, maxPx, maxKB){
    try {
      const isGif = /gif/i.test(file.type);
      if (isGif){
        if (file.size > CONFIG.GIF_MAX_KB * 1024){
          toast("That GIF is " + fmtSize(file.size) + " - too big to keep animated. Limit is " +
                CONFIG.GIF_MAX_KB + " KB.", "warn", 8000);
          return null;
        }
        const dataURL = await this.blobToDataURL(file);   // untouched, still animates
        return { dataURL:dataURL, w:0, h:0, bytes:file.size, animated:true };
      }

      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, maxPx / Math.max(bmp.width, bmp.height));
      const w = Math.max(1, Math.round(bmp.width * scale));
      const h = Math.max(1, Math.round(bmp.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      const keepAlpha = /png|webp|svg/i.test(file.type);
      if (!keepAlpha){ ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h); }
      ctx.drawImage(bmp, 0, 0, w, h);
      if (bmp.close) bmp.close();

      let dataURL = canvas.toDataURL(keepAlpha ? "image/png" : "image/jpeg", 0.82);
      // still too heavy? fall back to progressively meaner JPEG
      let q = 0.7;
      while (dataURL.length * 0.75 > maxKB * 1024 && q >= 0.4){
        dataURL = canvas.toDataURL("image/jpeg", q);
        q -= 0.15;
      }
      return { dataURL:dataURL, w:w, h:h, bytes:Math.round(dataURL.length * 0.75) };
    } catch(err){
      console.warn("[chamber] could not process image", err);
      toast("That image could not be read.", "warn");
      return null;
    }
  }
};

      '<div id="lightbox"><img src="' + src + '" alt="">' +
      '<div class="muted">' + esc(caption || "click anywhere to close") + "</div></div>";
    $("#lightbox").addEventListener("click", () => this.close());
  },
  close(){ $("#lightboxRoot").innerHTML = ""; },
  isOpen(){ return !!$("#lightboxRoot").firstChild; }
};

/* -------------------------------------------------------------------------
   [SECTION: SKY & WEATHER]  The view through the gothic window.
   The sky gradient, the sun/moon arc, the stars and the rain are all driven
   from the same clock that drives the room lighting, so the window and the
   room never disagree about the time of day.
   ---------------------------------------------------------------------- */
const Sky = {
  mode:"auto",            // weather: "auto" | "rain" | "clear"
  raining:false,
  lastRoll:0,
  lastPeriod:null,

  looks:{
    dawn: { grad:"linear-gradient(180deg,#2d2a4d 0%,#7d4a72 34%,#d87a56 68%,#f6c98a 100%)",
            ground:"#3a3730", star:.35, cloud:.55, sun:"#ffd9a0", halo:"rgba(255,217,160,.30)" },
    day:  { grad:"linear-gradient(180deg,#4a86c4 0%,#7db4e0 55%,#c6e2f2 100%)",
            ground:"#3f4a33", star:0,   cloud:.85, sun:"#fff4c9", halo:"rgba(255,244,201,.35)" },
    evening:{grad:"linear-gradient(180deg,#241a47 0%,#6b2f63 32%,#c25336 68%,#f0a05e 100%)",
            ground:"#2e2a26", star:.45, cloud:.5,  sun:"#ff9d5c", halo:"rgba(255,157,92,.32)" },
    night:{ grad:"linear-gradient(180deg,#060a1c 0%,#0f1733 55%,#1b2447 100%)",
            ground:"#171b26", star:1,   cloud:.18, sun:"#e8ecff", halo:"rgba(232,236,255,.22)" }
  },

  seedStars(){
    const host = $("#stars");
    if (!host) return;
    let html = "";
    for (let i = 0; i < CONFIG.STAR_COUNT; i++){
      const x = (hash1(i * 3.7) * 100).toFixed(1);
      const y = (hash1(i * 8.1) * 62).toFixed(1);
      const dur = (1.8 + hash1(i * 5.5) * 4).toFixed(1);
      const delay = (-hash1(i * 2.3) * 5).toFixed(1);
      html += '<i style="left:' + x + "%;top:" + y + "%;animation-duration:" + dur +
              "s;animation-delay:" + delay + 's"></i>';
    }
    host.innerHTML = html;
  },

  seedClouds(){
    const host = $("#clouds");
    if (!host) return;
    let html = "";
    for (let i = 0; i < 3; i++){
      const top = 8 + i * 16, dur = 60 + i * 34, delay = -i * 21;
      html += '<div class="cloud" style="top:' + top + "%;left:-30%;animation-duration:" + dur +
              "s;animation-delay:" + delay + 's">' +
                '<i style="left:0;top:8px;width:46px;height:9px"></i>' +
                '<i style="left:10px;top:0;width:26px;height:9px"></i>' +
                '<i style="left:30px;top:3px;width:16px;height:8px"></i>' +
              "</div>";
    }
    host.innerHTML = html;
  },

  seedRain(){
    const host = $("#rainGlass");
    if (!host) return;
    let html = "";
    for (let i = 0; i < CONFIG.RAIN_DROPS; i++){
      const x = (hash1(i * 4.4) * 100).toFixed(1);
      const len = (8 + hash1(i * 6.6) * 22).toFixed(0);
      const dur = (0.9 + hash1(i * 9.2) * 1.5).toFixed(2);
      const delay = (-hash1(i * 1.9) * 3).toFixed(2);
      html += '<span class="drop" style="left:' + x + "%;top:0;height:" + len +
              "px;animation-duration:" + dur + "s;animation-delay:" + delay + 's"></span>';
    }
    host.innerHTML = html;
  },

  /* sun/moon position: a simple arc across the pane */
  celestial(now){
    const mins = now.getHours() * 60 + now.getMinutes();
    const night = mins < 6 * 60 || mins >= 18 * 60;
    // day runs 06:00-18:00, night 18:00-06:00; map each onto 0..1
    const t = night
      ? ((mins < 6 * 60 ? mins + 6 * 60 : mins - 18 * 60) / (12 * 60))
      : ((mins - 6 * 60) / (12 * 60));
    const x = 12 + t * 76;                       // left to right across the pane
    const y = 58 - Math.sin(t * Math.PI) * 42;   // arc up and back down
    return { x:x, y:y, night:night };
  },

  apply(force){
    const now = new Date();
    const period = Ambience.periodFor(now.getHours());
    const look = this.looks[period] || this.looks.day;
    const r = document.documentElement.style;
    const c = this.celestial(now);
    r.setProperty("--sky-grad", look.grad);
    r.setProperty("--sky-ground", look.ground);
    r.setProperty("--star-op", String(this.raining ? Math.min(look.star, .25) : look.star));
    r.setProperty("--cloud-op", String(this.raining ? Math.min(1, look.cloud + .25) : look.cloud));
    r.setProperty("--celestial", c.night ? "#e8ecff" : look.sun);
    r.setProperty("--celestial-halo", look.halo);
    r.setProperty("--celestial-op", this.raining ? "0.25" : "1");
    r.setProperty("--celestial-x", c.x.toFixed(1) + "%");
    r.setProperty("--celestial-y", c.y.toFixed(1) + "%");
    this.lastPeriod = period;
  },

  setRain(on, quiet){
    on = !!on;
    if (on === this.raining && !quiet) return;
    this.raining = on;
    const g = $("#rainGlass");
    if (g) g.classList.toggle("on", on);
    this.apply(true);
    // blend the rain bed into the synthesis engine, but only if audio is live
    if (Sound.ctx) Sound.toggle("rain", on);
    else Sound.pending = Object.assign(Sound.pending || {}, { rain:on });
  },

  setMode(mode){
    this.mode = mode;
    UI.write({ weather:mode });
    if (mode === "rain") this.setRain(true);
    else if (mode === "clear") this.setRain(false);
    else { this.lastRoll = 0; this.roll(true); }     // auto: decide right now
  },

  /* "auto" rolls the dice every so often - the weather drifts on its own */
  roll(force){
    if (this.mode !== "auto") return;
    const now = Date.now();
    if (!force && now - this.lastRoll < CONFIG.WEATHER_CYCLE_MS) return;
    this.lastRoll = now;
    // ~30% of the time it is raining; sticky, so it does not strobe
    const wet = hash1(Math.floor(now / CONFIG.WEATHER_CYCLE_MS)) < 0.3;
    this.setRain(wet);
  },

  init(){
    this.mode = UI.read().weather || "auto";
    this.seedStars(); this.seedClouds(); this.seedRain();
    if (this.mode === "rain") this.setRain(true, true);
    else if (this.mode === "auto") this.roll(true);
    this.apply(true);
  }
};

/* -------------------------------------------------------------------------
   [SECTION: POINT LIGHTS]
   One screen-blended radial per real light source, parked exactly over the
   flame or bulb it belongs to. They live in #lighting, which sits above the
   three room layers but creates no stacking context, so the glow genuinely
   lights the wall, floor and furniture underneath instead of sitting on top
   as a flat wash. Positions are refreshed every frame from each source's own
   screen box, so the lights follow parallax and rearrange mode for nothing.
   ---------------------------------------------------------------------- */
const Lights = {
  defs:[
    /* selector,           radius, gain, flicker key, cold? */
    { sel:"#fgFlame",       r:420, g:1.00, k:"fg"  },
    { sel:"#shelfFlame",    r:230, g:0.70, k:"sh"  },
    { sel:"#sconceFlameL",  r:260, g:0.80, k:"scL" },
    { sel:"#sconceFlameR",  r:260, g:0.80, k:"scR" },
    { sel:".d-lamp",        r:300, g:0.85, k:null  },   // the desk lamp bulb
    { sel:".window",        r:520, g:0.55, k:null, cold:true }  // daylight spill
  ],
  items:[],

  init(){
    const host = $("#lighting");
    if (!host) return;
    host.innerHTML = "";
    this.items = [];
    for (const d of this.defs){
      const src = document.querySelector(d.sel);
      if (!src) continue;
      const el = document.createElement("div");
      el.className = "plight" + (d.cold ? " cold" : "");
      el.style.width = d.r + "px";
      el.style.height = d.r + "px";
      el.style.marginLeft = (-d.r / 2) + "px";
      el.style.marginTop  = (-d.r / 2) + "px";
      host.appendChild(el);
      this.items.push({ el:el, src:src, def:d });
    }
    Loop.add(this.frame.bind(this));
  },

  /* re-seat after anything that moves a light source */
  refresh(){ this.init(); },

  frame(){
    if (!this.items.length) return;
    const room = $("#room").getBoundingClientRect();
    const lamp = parseFloat(getComputedStyle(document.documentElement)
                   .getPropertyValue("--lamp")) || 1;
    for (const it of this.items){
      const r = it.src.getBoundingClientRect();
      if (!r.width && !r.height){ it.el.style.opacity = "0"; continue; }
      const x = r.left - room.left + r.width / 2;
      const y = r.top  - room.top  + r.height / 2;
      it.el.style.transform = "translate3d(" + Math.round(x) + "px," + Math.round(y) + "px,0)";
      // flame-driven lights breathe with their own flame; fixed ones are steady
      const jit = it.def.k && Ambience.level ? (Ambience.level[it.def.k] || .5) : .5;
      const base = it.def.cold ? 1 : lamp;                 // daylight ignores --lamp
      it.el.style.opacity = clamp(it.def.g * base * (0.72 + jit * 0.42), 0, 1).toFixed(3);
    }
  }
};

/* -------------------------------------------------------------------------
   [SECTION: PORTRAIT LINKS]  Wall frames double as bookmarks.
   Edit mode: click or right-click a frame to assign a URL + title.
   Normal mode: clicking it opens that URL in a new tab.
   Links live in roomConfig under "frameLinks"; the frames' screen positions
   stay in roomLayout with every other movable object, so there is exactly
   one source of truth for position instead of two copies that can drift.
   ---------------------------------------------------------------------- */
const Frames = {
  links:{},          // { frameAstro: {url, title}, ... }

  async load(){
    const rec = await Store.getFrom("roomConfig", "frameLinks");
    this.links = (rec && rec.links) || {};
    this.paint();
  },

  async save(){
    try { await Store.putInto("roomConfig", { id:"frameLinks", links:this.links, updated:Date.now() }); }
    catch(err){ handleWriteError(err); }
  },

  /* only http/https may be launched - blocks javascript:, data:, file: etc. */
  safe(url){
    const u = String(url || "").trim();
    if (!u) return null;
    const withScheme = /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : "https://" + u;
    try {
      const parsed = new URL(withScheme);
      if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return null;
      return parsed.href;
    } catch(err){ return null; }
  },

  paint(){
    $$("[data-move^='frame']").forEach(el => {
      const id = el.getAttribute("data-move");
      const link = this.links[id];
      el.classList.toggle("linked", !!(link && link.url));
      const base = el.getAttribute("data-art") || el.title || "";
      if (!el.getAttribute("data-art")) el.setAttribute("data-art", base);
      el.title = link && link.url
        ? (link.title || link.url) + "  -  click to open"
        : el.getAttribute("data-art") + "  -  no link yet";
      let tag = el.querySelector(".f-tag");
      if (link && link.url){
        if (!tag){ tag = document.createElement("span"); tag.className = "f-tag"; el.appendChild(tag); }
        tag.textContent = link.title || new URL(link.url).hostname;
      } else if (tag) tag.remove();
    });
  },

  open(id){
    const link = this.links[id];
    const url = link && this.safe(link.url);
    if (!url){
      toast("No link on that frame yet. Open REARRANGE ROOM and click it to assign one.", null, 6000);
      return;
    }
    window.open(url, "_blank", "noopener,noreferrer");
  },

  /* the little assignment modal, shown in edit mode */
  edit(id){
    const el = document.querySelector('[data-move="' + id + '"]');
    const cur = this.links[id] || { url:"", title:"" };
    const art = el ? (el.getAttribute("data-art") || id) : id;
    $("#modalRoot").innerHTML =
      '<div class="modal-wrap" id="linkWrap"><div class="settings" style="width:min(460px,92vw)">' +
        '<div class="modal-head"><span class="h-title">BOOKMARK &mdash; ' + esc(art) + "</span>" +
          '<button class="tiny" data-lnk="cancel">CANCEL</button></div>' +
        '<div class="set-sec">' +
          '<p class="muted">Hang a link on this frame. In normal mode, clicking the picture opens it in a new tab.</p>' +
          '<div class="set-row"><span class="lbl">Title</span></div>' +
          '<input id="lnkTitle" placeholder="Reading list" value="' + esc(cur.title || "") + '">' +
          '<div class="set-row" style="margin-top:10px"><span class="lbl">URL</span></div>' +
          '<input id="lnkUrl" placeholder="https://github.com" value="' + esc(cur.url || "") + '">' +
          '<p class="muted" id="lnkNote">&nbsp;</p>' +
          '<div class="set-row"><button class="gold" data-lnk="save">SAVE LINK</button>' +
            '<button class="tiny danger" data-lnk="clear">REMOVE LINK</button></div>' +
        "</div>" +
      "</div></div>";

    const wrap = $("#linkWrap");
    animateFrom(wrap.querySelector(".settings"), el, "pop");
    const urlEl = $("#lnkUrl"), noteEl = $("#lnkNote");
    const check = () => {
      const v = urlEl.value.trim();
      if (!v){ noteEl.textContent = " "; return; }
      const ok = this.safe(v);
      noteEl.textContent = ok ? "opens: " + ok : "only http:// and https:// links are allowed";
      noteEl.style.color = ok ? "" : "var(--gold-lt)";
    };
    urlEl.addEventListener("input", check);
    check();
    $("#lnkTitle").focus();

    wrap.addEventListener("click", async ev => {
      if (ev.target === wrap) return Settings.closeLink();
      const btn = ev.target.closest("[data-lnk]");
      if (!btn) return;
      const act = btn.getAttribute("data-lnk");
      if (act === "cancel") return Settings.closeLink();
      if (act === "clear"){
        delete this.links[id];
        await this.save(); this.paint();
        toast("Link removed.", "ok");
        return Settings.closeLink();
      }
      if (act === "save"){
        const url = this.safe(urlEl.value);
        if (!url){ toast("That is not a usable http/https address.", "warn"); return; }
        this.links[id] = { url:url, title:$("#lnkTitle").value.trim() };
        await this.save(); this.paint();
        toast("Bookmark hung on the frame.", "ok");
        return Settings.closeLink();
      }
    });
    // Enter saves from either field
    wrap.addEventListener("keydown", ev => {
      if (ev.key === "Enter"){ ev.preventDefault(); wrap.querySelector('[data-lnk="save"]').click(); }
    });
  }
};

/* -------------------------------------------------------------------------
   [SECTION: WALLPAPER]  User-supplied wall covering.
   Stored in the roomConfig store as a data URL, applied to the Layer 1 wall
   so it parallaxes at background depth like the rest of the far plane.
   ---------------------------------------------------------------------- */
const Wallpaper = {
  rec:null,

  async load(){
    this.rec = await Store.getFrom("roomConfig", "wallpaper");
    this.apply();
  },

  apply(){
    const r = document.documentElement.style;
    if (!this.rec || !this.rec.dataURL){
      r.setProperty("--wall-image", "none");
      return;
    }
    r.setProperty("--wall-image", 'url("' + this.rec.dataURL + '")');
    if (this.rec.mode === "cover"){
      r.setProperty("--wall-size", "cover");
      r.setProperty("--wall-repeat", "no-repeat");
    } else {
      r.setProperty("--wall-size", (this.rec.tile || 256) + "px auto");
      r.setProperty("--wall-repeat", "repeat");
    }
  },

  async set(file){
    if (!Store.blobStoreAvailable()){
      toast("Custom wallpaper needs IndexedDB. Serve this over http://localhost.", "warn", 9000);
      return;
    }
    if (!/^image\//.test(file.type || "")){ toast("That is not an image.", "warn"); return; }
    // gifs keep their animation; stills are downscaled so the wall stays cheap
    const shrunk = await Imaging.shrink(file, 1400, 900);
    if (!shrunk) return;
    const rec = { id:"wallpaper", name:file.name, type:file.type,
                  dataURL:shrunk.dataURL, mode:(this.rec && this.rec.mode) || "tile",
                  tile:(this.rec && this.rec.tile) || 256, addedAt:Date.now() };
    try {
      await Store.putInto("roomConfig", rec);
      this.rec = rec;
      this.apply();
      toast("Wallpaper applied" + (shrunk.animated ? " (animated GIF kept whole)." : "."), "ok");
      Store.nagIfRisky();
    } catch(err){ handleWriteError(err); }
  },

  async setMode(mode){
    if (!this.rec) return;
    this.rec.mode = mode;
    this.apply();
    try { await Store.putInto("roomConfig", this.rec); } catch(err){ handleWriteError(err); }
  },

  async setTile(px){
    if (!this.rec) return;
    this.rec.tile = clamp(px, 32, 1024);
    this.apply();
    try { await Store.putInto("roomConfig", this.rec); } catch(err){ handleWriteError(err); }
  },

  async clear(){
    this.rec = null;
    await Store.deleteFrom("roomConfig", "wallpaper");
    this.apply();
    toast("Reverted to the default striped wallpaper.", "ok");
  }
};

/* -------------------------------------------------------------------------
   [SECTION: GRAMOPHONE]  Local audio, stored as Blobs in IndexedDB.
   Nothing leaves the machine and nothing is fetched: the <audio> element
   plays an object URL made from the stored Blob, routed through the same
   Web Audio graph as the ambience so the master volume governs everything.
   ---------------------------------------------------------------------- */
const Music = {
  tracks:[], current:-1, loop:false, vol:.8, playing:false,
  el:null, node:null, gain:null, noteAcc:0, urls:{},

  async load(){
    this.tracks = (await Store.allFrom("tracks")).sort((a,b) => a.addedAt - b.addedAt);
    const ui = UI.read();
    if (typeof ui.musicVol === "number") this.vol = ui.musicVol;
    this.loop = !!ui.musicLoop;
    this.el = $("#player");
    this.el.loop = false;                       // handled manually for playlists
    this.el.volume = this.vol;
    this.el.addEventListener("ended", () => this.next(true));
    this.el.addEventListener("play",  () => { this.playing = true;  this.paintRoom(); this.paintDrawer(); });
    this.el.addEventListener("pause", () => { this.playing = false; this.paintRoom(); this.paintDrawer(); });
    this.el.addEventListener("error", () => {
      if (this.current >= 0) toast("That track could not be decoded by this browser.", "warn", 7000);
    });
    Loop.add(this.frame.bind(this));
    this.paintRoom();
  },

  /* route the element through Web Audio once, so master volume applies */
  ensureGraph(){
    if (this.node) return true;
    if (!Sound.ensure()) return false;
    try {
      this.node = Sound.ctx.createMediaElementSource(this.el);
      this.gain = Sound.ctx.createGain();
      this.gain.gain.value = this.vol;
      this.node.connect(this.gain);
      this.gain.connect(Sound.master);
      this.el.volume = 1;                        // the graph owns the level now
      return true;
    } catch(err){
      console.warn("[chamber] media graph unavailable, using element volume", err);
      this.node = null;
      return false;
    }
  },

  urlFor(rec){
    if (!this.urls[rec.id]) this.urls[rec.id] = URL.createObjectURL(rec.blob);
    return this.urls[rec.id];
  },

  async add(files){
    if (!Store.blobStoreAvailable()){
      toast("Audio needs IndexedDB. Serve this file over http://localhost for the gramophone to work.", "warn", 10000);
      return;
    }
    let added = 0;
    for (const file of files){
      if (!/^audio\//.test(file.type || "") && !/\.(mp3|wav|ogg|oga|flac|m4a|aac)$/i.test(file.name)){
        toast('"' + file.name + '" is not an audio file.', "warn");
        continue;
      }
      const rec = { id:uid(), name:file.name.replace(/\.[^.]+$/, ""), fileName:file.name,
                    type:file.type || "audio/mpeg", size:file.size, blob:file, addedAt:Date.now() };
      try { await Store.putInto("tracks", rec); this.tracks.push(rec); added++; }
      catch(err){ handleWriteError(err); }
    }
    if (added){
      toast(added + " track(s) added to the gramophone.", "ok");
      this.paintDrawer();
      Store.nagIfRisky();
    }
  },

  async remove(id){
    const i = this.tracks.findIndex(t => t.id === id);
    if (i < 0) return;
    if (this.current === i) this.stop();
    if (this.urls[id]){ URL.revokeObjectURL(this.urls[id]); delete this.urls[id]; }
    await Store.deleteFrom("tracks", id);
    this.tracks.splice(i, 1);
    if (this.current > i) this.current--;
    this.paintDrawer(); this.paintRoom();
  },

  play(i){
    if (i !== undefined) this.current = i;
    const rec = this.tracks[this.current];
    if (!rec) return;
    this.ensureGraph();
    if (Sound.ctx && Sound.ctx.state === "suspended") Sound.ctx.resume();
    const url = this.urlFor(rec);
    if (this.el.getAttribute("data-track") !== rec.id){
      this.el.src = url;
      this.el.setAttribute("data-track", rec.id);
    }
    const p = this.el.play();
    if (p && p.catch) p.catch(err => {
      console.warn("[chamber] playback blocked", err);
      toast("The browser blocked playback. Click the gramophone again.", "warn", 6000);
    });
    this.paintDrawer();
  },

  toggle(){
    if (!this.tracks.length) return;
    if (this.current < 0) return this.play(0);
    if (this.el.paused) this.play(); else this.el.pause();
  },

  stop(){ this.el.pause(); this.el.removeAttribute("src"); this.el.load();
          this.el.removeAttribute("data-track"); this.playing = false; this.paintRoom(); },

  next(auto){
    if (!this.tracks.length) return;
    if (auto && this.loop && this.tracks.length === 1){ this.el.currentTime = 0; return this.play(); }
    let n = this.current + 1;
    if (n >= this.tracks.length){
      if (auto && !this.loop){ this.playing = false; this.paintRoom(); this.paintDrawer(); return; }
      n = 0;
    }
    this.play(n);
  },
  prev(){
    if (!this.tracks.length) return;
    if (this.el.currentTime > 3){ this.el.currentTime = 0; return; }
    this.play((this.current - 1 + this.tracks.length) % this.tracks.length);
  },

  setVolume(v){
    this.vol = clamp(v, 0, 1);
    if (this.gain && Sound.ctx) this.gain.gain.setTargetAtTime(this.vol, Sound.ctx.currentTime, .02);
    else this.el.volume = this.vol;
    UI.write({ musicVol:this.vol });
  },

  setLoop(on){ this.loop = !!on; UI.write({ musicLoop:this.loop }); this.paintDrawer(); },

  /* ---- the room reacts: spinning disc + notes out of the horn ---- */
  paintRoom(){
    const obj = $(".obj-gramo"), disc = $("#gDisc"), badge = document.querySelector('[data-badge="gramophone"]');
    if (obj) obj.classList.toggle("playing", this.playing);
    if (disc) disc.classList.toggle("spin", this.playing);
    if (badge){
      badge.textContent = this.tracks.length;
      badge.classList.toggle("hidden", !badgesOn() || this.tracks.length === 0);
    }
    if (!this.playing){
      const host = $("#gNotes");
      if (host) host.innerHTML = "";      // stop the particles dead when paused
    }
  },

  frame(dt){
    if (this.playing){
      this.noteAcc += dt;
      if (this.noteAcc >= CONFIG.NOTE_EVERY){ this.noteAcc = 0; this.spawnNote(); }
    }
    if (this._drawerOpen) this.paintProgress();
  },

  spawnNote(){
    // no document.hidden guard needed: Loop.stop() already parks the whole
    // frame loop while the tab is in the background
    const host = $("#gNotes");
    if (!host) return;
    const n = document.createElement("span");
    n.className = "note";
    n.textContent = Math.random() < 0.5 ? "♪" : "♫";
    n.style.left = (6 + Math.random() * 34) + "px";
    n.style.bottom = "0px";
    n.style.setProperty("--nx", (Math.random() * 46 - 12).toFixed(0) + "px");
    n.style.setProperty("--nr", (Math.random() * 50 - 25).toFixed(0) + "deg");
    n.style.animationDuration = (2.4 + Math.random() * 1.6).toFixed(2) + "s";
    n.style.fontSize = (13 + Math.round(Math.random() * 7)) + "px";
    n.addEventListener("animationend", () => n.remove());
    host.appendChild(n);
    while (host.children.length > 14) host.firstChild.remove();
  },

  /* ---- the media drawer ---- */
  open(srcEl){
    this._drawerOpen = true;
    $("#modalRoot").innerHTML =
      '<div class="modal-wrap" id="gramoWrap"><div class="drawer">' +
        '<div class="modal-head"><span class="h-title">THE GRAMOPHONE</span>' +
          '<button class="tiny" data-mus="add">+ ADD MUSIC</button>' +
          '<button class="tiny" data-mus="close">CLOSE</button></div>' +
        '<div class="track-list" id="trackList"></div>' +
        '<div class="player-bar">' +
          '<div class="now" id="nowPlaying">nothing loaded</div>' +
          '<div class="seek" id="seekBar"><div class="fill" id="seekFill"></div></div>' +
          '<div class="player-ctl">' +
            '<button data-mus="prev">&#9664;&#9664;</button>' +
            '<button class="gold" data-mus="toggle" id="btnPlay">&#9654; PLAY</button>' +
            '<button data-mus="next">&#9654;&#9654;</button>' +
            '<button class="tiny" data-mus="loop" id="btnLoop">LOOP: OFF</button>' +
            '<span class="time" id="playTime">0:00 / 0:00</span>' +
            '<span class="lbl">VOL</span>' +
            '<input type="range" id="musVol" min="0" max="100" value="' + Math.round(this.vol*100) + '" style="width:120px">' +
          "</div>" +
        "</div>" +
        '<input type="file" id="musFile" accept="audio/*,.mp3,.wav,.ogg,.oga,.flac,.m4a" multiple class="hidden">' +
      "</div></div>";

    const wrap = $("#gramoWrap");
    animateFrom(wrap.querySelector(".drawer"), srcEl || $(".obj-gramo"), "pop");
    this.paintDrawer();

    wrap.addEventListener("click", ev => {
      if (ev.target === wrap) return this.close();
      const row = ev.target.closest("[data-track-id]");
      const btn = ev.target.closest("[data-mus]");
      if (row && !btn){ this.play(this.tracks.findIndex(t => t.id === row.getAttribute("data-track-id"))); return; }
      if (!btn) return;
      const act = btn.getAttribute("data-mus");
      if (act === "close")  return this.close();
      if (act === "add")    return $("#musFile").click();
      if (act === "toggle") return this.toggle();
      if (act === "next")   return this.next(false);
      if (act === "prev")   return this.prev();
      if (act === "loop")   return this.setLoop(!this.loop);
      if (act === "del"){
        const id = btn.getAttribute("data-id");
        const t = this.tracks.find(t => t.id === id);
        if (t && confirm('Remove "' + t.name + '" from the gramophone?')) this.remove(id);
      }
    });

    $("#musFile").addEventListener("change", ev => {
      if (ev.target.files.length) this.add(Array.from(ev.target.files));
      ev.target.value = "";
    });
    $("#musVol").addEventListener("input", ev => this.setVolume(+ev.target.value / 100));
    $("#seekBar").addEventListener("click", ev => {
      if (!this.el.duration) return;
      const r = ev.currentTarget.getBoundingClientRect();
      this.el.currentTime = ((ev.clientX - r.left) / r.width) * this.el.duration;
    });
  },

  close(){ this._drawerOpen = false; $("#modalRoot").innerHTML = ""; },

  paintDrawer(){
    const list = $("#trackList");
    if (!list) return;
    list.innerHTML = this.tracks.length ? this.tracks.map((t, i) =>
      '<div class="track' + (i === this.current ? " current" : "") + '" data-track-id="' + t.id + '">' +
        '<span class="t-num">' + (i === this.current && this.playing ? "&#9654;" : (i + 1)) + "</span>" +
        '<span class="t-name">' + esc(t.name) + "</span>" +
        '<span class="t-size">' + fmtSize(t.size) + "</span>" +
        '<button class="tiny danger" data-mus="del" data-id="' + t.id + '">&#10005;</button>' +
      "</div>").join("")
      : '<p class="muted" style="padding:16px">No music yet. Use + ADD MUSIC to load files from this machine - they are stored inside the page, not linked.</p>';

    const now = $("#nowPlaying");
    if (now){
      const rec = this.tracks[this.current];
      now.textContent = rec ? (this.playing ? "♪ now playing: " : "paused: ") + rec.name : "nothing loaded";
    }
    const bp = $("#btnPlay");
    if (bp) bp.innerHTML = this.playing ? "&#10074;&#10074; PAUSE" : "&#9654; PLAY";
    const bl = $("#btnLoop");
    if (bl) bl.textContent = "LOOP: " + (this.loop ? "ON" : "OFF");
  },

  paintProgress(){
    const fill = $("#seekFill"), t = $("#playTime");
    if (!fill || !this.el) return;
    const d = this.el.duration || 0, c = this.el.currentTime || 0;
    fill.style.width = (d ? (c / d) * 100 : 0).toFixed(2) + "%";
    const mm = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
    if (t) t.textContent = mm(c) + " / " + mm(d || 0);
  }
};

/* -------------------------------------------------------------------------
   [SECTION: DECOR & PETS]  Custom sprites uploaded by the user.
   Each sprite is a Blob in IndexedDB; its position lives in roomLayout under
   "sprite:<id>" so it uses exactly the same rearrange machinery as the
   furniture. A sprite flagged as a pet speaks when clicked.
   ---------------------------------------------------------------------- */
const Decor = {
  sprites:[], speaking:null, speakTimer:0,

  async load(){
    this.sprites = (await Store.allFrom("sprites")).sort((a,b) => a.addedAt - b.addedAt);
    this.render();
  },

  async add(files){
    if (!Store.blobStoreAvailable()){
      toast("Custom sprites need IndexedDB. Serve the file over http://localhost.", "warn", 9000);
      return;
    }
    for (const file of files){
      if (!/^image\//.test(file.type || "")){ toast('"' + file.name + '" is not an image.', "warn"); continue; }
      if (file.size > CONFIG.SPRITE_MAX_KB * 1024){
        toast('"' + file.name + '" is ' + fmtSize(file.size) + " - the sprite limit is " +
              CONFIG.SPRITE_MAX_KB + " KB.", "warn", 8000);
        continue;
      }
      let w = 120, h = 120;
      try {
        const bmp = await createImageBitmap(file);
        const scale = Math.min(1, 200 / Math.max(bmp.width, bmp.height));
        w = Math.max(24, Math.round(bmp.width * scale));
        h = Math.max(24, Math.round(bmp.height * scale));
        if (bmp.close) bmp.close();
      } catch(err){ /* gifs can refuse createImageBitmap; the default size is fine */ }
      const rec = { id:uid(), name:file.name.replace(/\.[^.]+$/, ""), type:file.type,
                    blob:file, w:w, h:h, isPet:false, lines:[], addedAt:Date.now() };
      try {
        await Store.putInto("sprites", rec);
        this.sprites.push(rec);
        toast('"' + rec.name + '" added. Use REARRANGE ROOM to place it.', "ok", 6000);
      } catch(err){ handleWriteError(err); }
    }
    this.render();
    Settings.refreshSprites();
    Store.nagIfRisky();
  },

  async save(rec){
    try { await Store.putInto("sprites", rec); }
    catch(err){ handleWriteError(err); }
  },

  async remove(id){
    const i = this.sprites.findIndex(s => s.id === id);
    if (i < 0) return;
    await Store.deleteFrom("sprites", id);
    this.sprites.splice(i, 1);
    delete Layout.data["sprite:" + id];
    await Store.layoutDelete("sprite:" + id);
    this.render();
    Settings.refreshSprites();
  },

  render(){
    const host = $("#spriteHost");
    if (!host) return;
    host.querySelectorAll(".deco").forEach(el => {
      const u = el.getAttribute("data-url");
      if (u) URL.revokeObjectURL(u);
    });
    host.innerHTML = "";
    this.sprites.forEach((s, i) => {
      const el = document.createElement("div");
      el.className = "deco" + (s.isPet ? " is-pet" : "");
      el.setAttribute("data-move", "sprite:" + s.id);
      el.setAttribute("data-sprite", s.id);
      el.style.width = s.w + "px";
      el.style.height = s.h + "px";
      el.style.left = (12 + (i * 9) % 60) + "%";        // default spot until moved
      const url = URL.createObjectURL(s.blob);
      el.setAttribute("data-url", url);
      el.innerHTML = '<img src="' + url + '" alt="' + esc(s.name) + '">' +
                     '<span class="pet-tag">' + (s.isPet ? "PET" : "DECOR") + "</span>";
      el.title = s.name + (s.isPet ? " - click me" : "");
      host.appendChild(el);
      Layout.apply(el);
    });
  },

  /* ---- pet dialogue with a typewriter reveal ----
     The reveal is stepped from the shared rAF loop, not a timer, so it stays
     in lockstep with everything else and pauses with the tab. At ~15ms per
     character a 60Hz frame owes more than one character, so the accumulator
     emits however many the elapsed time has earned. */
  speak(id){
    const s = this.sprites.find(x => x.id === id);
    if (!s || !s.isPet) return;
    const lines = (s.lines && s.lines.length) ? s.lines : PET_LINES_DEFAULT;
    if (!lines.length) return;
    const el = document.querySelector('[data-sprite="' + id + '"]');
    if (!el) return;

    const old = el.querySelector(".speech");
    if (old) old.remove();

    // avoid repeating the previous line back to back
    let line = lines[Math.floor(Math.random() * lines.length)];
    if (lines.length > 1 && line === this.lastLine)
      line = lines[(lines.indexOf(line) + 1 + Math.floor(Math.random() * (lines.length - 1))) % lines.length];
    this.lastLine = line;

    const b = document.createElement("div");
    b.className = "speech go typing";
    b.innerHTML = '<span class="sp-text"></span><span class="sp-caret">_</span>';
    el.appendChild(b);
    this.clampBubble(b);

    this.typing = { el:b, span:b.querySelector(".sp-text"), full:line, i:0, acc:0, sinceTick:0 };
    clearTimeout(this.speakTimer);

    // clicking the bubble mid-reveal snaps it to the whole line
    b.addEventListener("click", ev => { ev.stopPropagation(); this.finishTyping(); });
  },

  /* stepped once per frame by the main loop */
  typeFrame(dt){
    const t = this.typing;
    if (!t) return;
    t.acc += dt;
    const per = CONFIG.TYPE_MS / 1000;
    let wrote = 0;
    while (t.acc >= per && t.i < t.full.length){
      t.acc -= per;
      t.i++;
      wrote++;
      if (wrote > 12) break;            // never blow a frame on a huge catch-up
    }
    if (wrote){
      t.span.textContent = t.full.slice(0, t.i);
      this.clampBubble(t.el);
      // one muted tick every other character - a tick per char is a machine gun
      t.sinceTick += wrote;
      if (t.sinceTick >= 2){ t.sinceTick = 0; Sound.type(); }
    }
    if (t.i >= t.full.length) this.finishTyping();
  },

  finishTyping(){
    const t = this.typing;
    if (!t) return;
    t.span.textContent = t.full;
    t.el.classList.remove("typing");
    this.typing = null;
    this.clampBubble(t.el);
    clearTimeout(this.speakTimer);
    const bubble = t.el;
    this.speakTimer = setTimeout(() => { if (bubble.parentNode) bubble.remove(); }, CONFIG.SPEECH_MS);
  },

  /* Keep the bubble on screen no matter where the pet stands or how the
     window is resized. It is anchored to the sprite, so we only nudge the
     horizontal offset when it would spill past the room edge. */
  clampBubble(b){
    if (!b || !b.parentNode) return;
    const room = $("#room").getBoundingClientRect();
    b.style.setProperty("--sp-shift", "0px");
    const r = b.getBoundingClientRect();
    let shift = 0;
    const pad = 12;
    if (r.left < room.left + pad) shift = (room.left + pad) - r.left;
    else if (r.right > room.right - pad) shift = (room.right - pad) - r.right;
    if (shift) b.style.setProperty("--sp-shift", Math.round(shift) + "px");
  },

  reclampAll(){ $$(".speech").forEach(b => this.clampBubble(b)); },

  /* import dialogue: one line per response, blank lines and // comments out */
  parseLines(text){
    return String(text).split(/\r?\n/).map(l => {
      let s = l.trim();
      s = s.replace(/\/\/\s*$/, "").trim();
      s = s.replace(/,\s*$/, "").trim();
      if (s.length >= 2 && s[0] === '"' && s[s.length-1] === '"') s = s.slice(1, -1);
      return s.replace(/\\"/g, '"').trim();
    }).filter(s => s.length > 0);
  },

  dialogueModal(id){
    const s = this.sprites.find(x => x.id === id);
    if (!s) return;
    $("#modalRoot").innerHTML =
      '<div class="modal-wrap" id="dlgWrap"><div class="settings">' +
        '<div class="modal-head"><span class="h-title">DIALOGUE &mdash; ' + esc(s.name) + "</span>" +
          '<button class="tiny" data-dlg="cancel">CANCEL</button></div>' +
        '<div class="set-sec">' +
          '<p class="muted">One response per line. Quotes, trailing commas and <code>//</code> markers are stripped automatically, so a list copied straight out of a script file works.</p>' +
          '<div class="set-row"><button class="tiny" data-dlg="import">IMPORT .TXT</button>' +
            '<button class="tiny" data-dlg="bundled">LOAD BUNDLED (' + PET_LINES_DEFAULT.length + ')</button>' +
            '<span class="lbl s-lines" id="dlgCount"></span></div>' +
          '<textarea id="dlgText" rows="14" spellcheck="false"></textarea>' +
          '<div class="set-row"><button class="gold" data-dlg="save">SAVE DIALOGUE</button>' +
            '<button class="tiny danger" data-dlg="clear">CLEAR</button></div>' +
        "</div>" +
        '<input type="file" id="dlgFile" accept=".txt,text/plain" class="hidden">' +
      "</div></div>";

    const ta = $("#dlgText");
    ta.value = (s.lines && s.lines.length ? s.lines : []).join("\n");
    const count = () => { $("#dlgCount").textContent = this.parseLines(ta.value).length + " line(s)"; };
    count();
    ta.addEventListener("input", count);

    const wrap = $("#dlgWrap");
    animateFrom(wrap.querySelector(".settings"), null, "pop");
    wrap.addEventListener("click", async ev => {
      const btn = ev.target.closest("[data-dlg]");
      if (!btn) return;
      const act = btn.getAttribute("data-dlg");
      if (act === "cancel"){ $("#modalRoot").innerHTML = prior; Settings.rebind(); return; }
      if (act === "import"){ $("#dlgFile").click(); return; }
      if (act === "bundled"){ ta.value = PET_LINES_DEFAULT.join("\n"); count(); return; }
      if (act === "clear"){ ta.value = ""; count(); return; }
      if (act === "save"){
        s.lines = this.parseLines(ta.value);
        if (!s.isPet && s.lines.length) s.isPet = true;      // dialogue implies pet
        await this.save(s);
        this.render();
        toast("Saved " + s.lines.length + " line(s) for " + s.name + ".", "ok");
        Settings.open();
      }
    });
    $("#dlgFile").addEventListener("change", async ev => {
      const f = ev.target.files[0];
      ev.target.value = "";
      if (!f) return;
      try {
        const text = await f.text();
        ta.value = text; count();
        toast("Loaded " + this.parseLines(text).length + " line(s) from " + f.name + ". Press SAVE.", "ok", 6000);
      } catch(err){ toast("Could not read that file.", "warn"); }
    });
  }
};

/* =========================================================================
   BOOT
   ========================================================================= */
(async function boot(){
  runIntro();

  /* Wire the header and the room BEFORE any awaits. The intro uncovers the
     HUD on a timer, so without this a quick click can land on a button that
     is not listening yet while IndexedDB is still opening. */
  wireRoom();
  $("#btnExport").addEventListener("click", () => state ? exportJson() : notReady());
  $("#btnImport").addEventListener("click", async () => {
    if (!state) return notReady();
    if (Store.mode === "desktop"){
      const res = await Desktop.api.importJson();
      if (res && !res.canceled) importJson(res.text);
      return;
    }
    $("#importFile").click();
  });
  $("#btnSettings").addEventListener("click", ev => state ? Settings.open(ev.currentTarget) : notReady());
  $("#btnPalette").addEventListener("click", () => state ? Palette.open() : notReady());
  $("#importFile").addEventListener("change", ev => {
    if (ev.target.files[0]) importJson(ev.target.files[0]);
    ev.target.value = "";
  });

  await Store.open();
  await Store.requestPersistence();     // ask before writing anything of value

  $("#storageMode").textContent = Store.mode === "desktop"
    ? "Desktop — files on disk"
    : (Store.ok ? "IndexedDB" + (Files.supported ? " + file links" : " (no file links)")
                : "localStorage fallback") + (Store.persisted ? " - persisted" : "");

  /* menu bar items in the desktop shell talk back to the page */
  if (Store.mode === "desktop" && Desktop.api.onMenu){
    Desktop.api.onMenu(async which => {
      if (which === "export") return exportJson();
      const res = await Desktop.api.importJson();
      if (res && !res.canceled) importJson(res.text);
    });
    // flush any pending write before the window disappears
    window.addEventListener("beforeunload", () => Desktop.flush());
  }
  if (!Store.ok){
    toast("IndexedDB is blocked here (this happens on file:// in Chrome). Running on localStorage: no file links, no image previews. Serve the file over http://localhost for the full feature set.", "warn", 15000);
  }

  state = await loadState();
  // A recovered document only lives in memory until something changes it.
  // Write it back at once so the damaged record cannot linger on disk.
  if (recoveredFromBackup) await saveNow();
  purgeExpiredTrash();
  ensureDailyLog();

  /* ---- Phase 2 + 3 systems ---- */
  await Layout.load();          // custom furniture placement, before measuring
  Layout.init();
  await Decor.load();           // custom sprites and pets onto the room plane
  await Music.load();           // gramophone playlist from IndexedDB
  await Wallpaper.load();       // custom wall covering onto the far plane
  await Frames.load();          // bookmarks hanging on the wall portraits
  Ambience.init();              // vignette weight, motes, flame flicker
  Lights.init();                // warm point lights over every real flame
  Sky.init();                   // sky gradient, stars, clouds, rain
  Parallax.init();
  KeyNav.init();
  Sound.restore();              // volumes from localStorage; audio waits for a gesture
  updateBadges();               // also renders spines / papers / candle / clock
  Loop.start();
  Store.nagIfRisky();           // one quiet nudge if the data looks fragile
  backupReminder();             // and one if there is no recent file on disk

  // browsers require a gesture before any sound; the first click is enough
  document.addEventListener("pointerdown", () => Sound.wake(), { once:true });

  window.addEventListener("beforeunload", () => { if (saveTimer) saveNow(); });

  /* Hidden tab: stop the frame loop, park the CSS animations and silence
     the audio graph. Nothing animates in the background. */
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){
      saveNow();
      Loop.stop();                       // animation always parks in the background
      document.body.classList.add("paused");
      /* The audio graph only sleeps when nothing is actually playing. The
         gramophone routes through this same context, so suspending it while
         a track is running would cut the music the moment you switch tabs -
         which is not what anyone expects from a music player. */
      if (Sound.ctx && Sound.ctx.state === "running" && !Music.playing) Sound.ctx.suspend();
    } else {
      document.body.classList.remove("paused");
      Loop.start();
      Ambience.applyLighting(true);
      if (Sound.ctx && (Music.playing || Sound.on.fire || Sound.on.rain || Sound.on.clock))
        Sound.ctx.resume();
    }
  });

  await writeBackup();          // one snapshot at every boot
  lastBackup = Date.now();

  // handy for poking at things from the console while you edit
  window.chamber = { state:() => state, save:saveNow, Store, Organizer, Chat, Files, Trash,
                     CONFIG, Loop, Parallax, Ambience, Sound, RoomEcho, Layout, Settings,
                     Palette, KeyNav, mdToHtml, purgeExpiredTrash,
                     Sky, Music, Decor, Imaging, Lightbox, PET_LINES_DEFAULT,
                     Lights, Wallpaper, Frames, contentCount, validate, writeBackup };
})();
</script>
