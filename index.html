<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Chamber</title>
<!--
=============================================================================
  THE CHAMBER  -  Phase 1
  A pixel-art Victorian study that works as a personal organizer.
  Single file. No build step. No dependencies. Edit by hand.

  HOW TO OPEN
    Double-clicking this file (file://) works, but Chrome disables IndexedDB
    and the File System Access API on file:// origins. The app detects that
    and falls back to localStorage + metadata-only attachments.
    For the full feature set, serve it from localhost, e.g.
        py -m http.server 8000
    then visit  http://localhost:8000/victorian-chamber.html

  MAP OF THIS FILE  (search for the bracketed tags)
    [SECTION: PALETTE]          colour custom properties
    [SECTION: FLOOR BASELINE]   the single floor line every object sits on
    [SECTION: OBJECT GEOMETRY]  size + horizontal position of each object
    [SECTION: SPRITE SWAP]      where to drop in your own image URLs
    [SECTION: ROOM MARKUP]      the three depth layers
    [SECTION: CONFIG]           tunable numbers (autosave, trash days, ...)
    [SECTION: SCHEMA]           the data shape + seed content
    [SECTION: MIGRATIONS]       ordered upgrade chain
    [SECTION: VALIDATION]       shape check + backup fallback
    [SECTION: STORAGE]          IndexedDB adapter + localStorage fallback
    [SECTION: MARKDOWN]         the hand-rolled parser
    [SECTION: ORGANIZER]        modal CRUD
    [SECTION: CHAT]             self-chat threads
    [SECTION: FILES]            attachments, handles, previews
    [SECTION: TRASH]            30-day wastepaper basket
=============================================================================
-->
<style>
/* =========================================================================
   [SECTION: PALETTE]
   Every colour in the app resolves from here. Change these, change the mood.
   ========================================================================= */
:root{
  /* Charcoal-espresso base. The room is lit by point lights and shaped by a
     multiply vignette - there is deliberately NO flat colour wash on top, so
     wallpaper and wood keep their full contrast. */
  --ink:        #0e0906;   /* deepest shadow / page background            */
  --mahogany:   #18110b;   /* charcoal-espresso: wall + panel base         */
  --wainscot:   #18110b;   /* wainscoting dark stave                       */
  --wainscot-2: #23180f;   /* wainscoting light stave                      */
  --wood:       #4a3728;   /* furniture body                              */
  --wood-lt:    #6b4f37;   /* furniture highlight                         */
  --wood-dk:    #1d1208;   /* furniture shadow (deepened)                  */
  --gold:       #c9a227;   /* accent / focus                              */
  --gold-lt:    #f0d27a;   /* accent highlight                            */
  --gold-dk:    #7d6316;   /* gold in shadow - toolbar + frame moulding    */
  --brass:      #b08d3a;   /* sconce metal                                 */
  --parchment:  #e8d9b8;   /* body text                                   */
  --parchment-d:#b8a781;   /* muted text                                  */
  --candle:     #ffcf7a;   /* candle light                                */
  --velvet:     #4e1a20;   /* curtains (deepened)                          */
  --glass:      #6a7b86;   /* window pane fallback behind the live sky     */
  --shadow:     #050302;   /* offset pixel drop-shadow colour              */
  --vignette-c: #080503;   /* the multiply vignette colour                 */
  --danger:     #8f2f2f;
  --ok:         #4f6b3a;

  /* Pixel-ish font stack. No webfont = no external dependency.
     Drop in a real 8-bit .ttf with @font-face below if you want one. */
  --font-pixel: "Perfect DOS VGA 437","Fixedsys Excelsior","Fixedsys",
                "Consolas","Lucida Console","Courier New",monospace;

  /* -----------------------------------------------------------------------
     [SECTION: FLOOR BASELINE]
     ONE number. It is both the height of the floor plane and the `bottom`
     of every object in the room, so nothing can ever float. Raise it to
     push the horizon up; every object follows automatically.
     -------------------------------------------------------------------- */
  --floor-line: 22%;

  /* -----------------------------------------------------------------------
     [SECTION: OBJECT GEOMETRY]
     Width / height / horizontal placement of each hotspot. Vertical
     placement is deliberately NOT here - it is always the floor line.
     -------------------------------------------------------------------- */
  --desk-w:  320px;  --desk-h:  190px;  --desk-x:  5%;
  --shelf-w: 250px;  --shelf-h: 400px;  --shelf-x: 37%;
  --ward-w:  225px;  --ward-h:  370px;  --ward-x:  73%;
  --bin-w:   78px;   --bin-h:   92px;   --bin-x:   28%;
  --gramo-w: 120px;  --gramo-h: 150px;  --gramo-x: 61%;
  --window-w:300px;  --window-h:330px;  --window-x:52%;
  /* wall-mounted props: x, plus height ABOVE the floor line (same anchoring
     scheme as the furniture, so rearrange mode treats them identically) */
  --clock-x: 20%;    --clock-y: 300px;
  --cal-x:   85%;    --cal-y:   300px;

  /* Lighting defaults - Ambience.applyLighting() overwrites these each hour.
     No tint/wash properties any more: only vignette weight, point-light gain
     and the daylight shaft. */
  --vig:1;          /* how heavy the corner vignette sits                  */
  --lamp:1;         /* gain applied to every warm point light              */
  --shaft-op:1;     /* daylight shaft through the window                   */

  /* [SECTION: WALLPAPER] --wall-image is set by the uploader in Settings;
     --sprite-wall stays as the hand-edit hook. Uploaded wins. */
  --wall-image:none; --wall-size:256px 256px; --wall-repeat:repeat;

  /* -----------------------------------------------------------------------
     [SECTION: SPRITE SWAP]
     To replace the CSS pixel art with your own sprite cut-outs:
       1. set the url() here
       2. set the matching --art-* property to `none`
     e.g.   --sprite-desk: url("sprites/desk.png");   --art-desk: none;
     -------------------------------------------------------------------- */
  --sprite-desk:  none;   --art-desk:  block;
  --sprite-shelf: none;   --art-shelf: block;
  --sprite-ward:  none;   --art-ward:  block;
  --sprite-bin:   none;   --art-bin:   block;
  --sprite-gramo: none;   --art-gramo: block;
  --sprite-wall:  none;   /* tiles over the wall gradient  */
  --sprite-floor: none;   /* tiles over the floor gradient */
}

/* Everything is pixelated, everything is hard-edged. */
*,*::before,*::after{
  box-sizing:border-box;
  /* Order matters: the LAST value a browser understands wins, so the modern
     `pixelated` keyword must come after the legacy vendor fallbacks. */
  image-rendering:-webkit-optimize-contrast;
  image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges;
  image-rendering:pixelated;
  -ms-interpolation-mode:nearest-neighbor;
  border-radius:0 !important;
}
html,body{
  height:100%;margin:0;overflow:hidden;
  background:var(--ink);color:var(--parchment);
  font-family:var(--font-pixel);font-size:13px;line-height:1.55;letter-spacing:.4px;
  -webkit-font-smoothing:none;
}

/* ---------- retro controls ------------------------------------------- */
button,.btn{
  font:inherit;letter-spacing:inherit;color:var(--parchment);
  background:var(--wood);border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--shadow);            /* solid offset pixel shadow */
  padding:5px 10px;cursor:pointer;display:inline-block;text-decoration:none;
}
button:hover,.btn:hover{background:var(--wood-lt);color:var(--gold-lt)}
button:active,.btn:active,button.is-pressed{
  transform:translate(4px,4px);box-shadow:0 0 0 var(--shadow);background:var(--wood-dk);
}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.gold{background:var(--gold);color:var(--ink);border-color:var(--wood-dk)}
button.gold:hover{background:var(--gold-lt);color:var(--ink)}
button.danger{background:var(--danger)}
button.danger:hover{background:#a83a3a;color:var(--parchment)}
button.tiny{padding:2px 7px;box-shadow:3px 3px 0 var(--shadow)}
button.tiny:active{transform:translate(3px,3px)}
input,textarea,select{
  font:inherit;letter-spacing:inherit;color:var(--parchment);
  background:var(--ink);border:3px solid var(--wood);padding:6px;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;width:100%;line-height:1.6}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:var(--ink);border-left:3px solid var(--wood-dk)}
::-webkit-scrollbar-thumb{background:var(--wood);border:3px solid var(--ink)}
::-webkit-scrollbar-thumb:hover{background:var(--wood-lt)}
.hidden{display:none !important}
.muted{color:var(--parchment-d)}

/* =========================================================================
   INTRO - the heavy double doors. ~2.2s total, click anywhere to skip.
   ========================================================================= */
#intro{position:fixed;inset:0;z-index:900;background:var(--ink);cursor:pointer}
#intro.gone{display:none}
#intro .door{
  position:absolute;top:0;bottom:0;width:50.5%;
  background:repeating-linear-gradient(90deg,var(--wood) 0 18px,var(--wood-dk) 18px 22px),var(--wood);
  border-top:10px solid var(--wood-dk);border-bottom:10px solid var(--wood-dk);
  transition:transform 1.5s cubic-bezier(.6,.02,.3,1);will-change:transform;
}
#intro .door.l{left:0;border-right:6px solid var(--ink)}
#intro .door.r{right:0;border-left:6px solid var(--ink)}
#intro .door .panel{
  position:absolute;left:14%;right:14%;border:8px solid var(--wood-dk);
  background:rgba(0,0,0,.22);box-shadow:inset 6px 6px 0 rgba(255,255,255,.04);
}
#intro .door .panel.a{top:9%;height:36%}
#intro .door .panel.b{top:53%;height:36%}
#intro .door .knob{
  position:absolute;top:48%;width:22px;height:22px;background:var(--gold);
  border:4px solid var(--wood-dk);box-shadow:4px 4px 0 var(--shadow);
}
#intro .door.l .knob{right:22px}
#intro .door.r .knob{left:22px}
#intro.open .door.l{transform:translateX(-101%)}
#intro.open .door.r{transform:translateX(101%)}
#intro .crack{
  position:absolute;top:0;bottom:0;left:50%;width:0;transform:translateX(-50%);
  background:var(--candle);opacity:0;
  transition:width 1.2s ease-out,opacity 1.2s ease-out;
}
#intro.open .crack{width:60%;opacity:.18}
#intro .plate{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:4;
  text-align:center;color:var(--gold-lt);font-size:20px;pointer-events:none;
  text-shadow:3px 3px 0 var(--shadow);transition:opacity .45s ease-out;
}
#intro.open .plate{opacity:0}
#intro .hint{
  position:absolute;left:0;right:0;bottom:26px;text-align:center;z-index:5;
  color:var(--parchment-d);font-size:11px;animation:blink 1.4s steps(2,end) infinite;
}
@keyframes blink{0%,60%{opacity:.85}61%,100%{opacity:.2}}

/* =========================================================================
   ROOM - three depth layers (back wall / mid furniture / foreground)
   Phase 2 parallax will translate .layer-back, .layer-mid, .layer-fore.
   ========================================================================= */
#room{position:fixed;inset:0;overflow:hidden;background:var(--ink);opacity:0}
#room.lit{opacity:1;transition:opacity .5s ease-out}
.layer{position:absolute;inset:0;pointer-events:none}
.layer > *{pointer-events:auto}

/* --- back layer: wall, window, floor ---------------------------------- */
/* Layer 1 background. Three stacked background layers, in priority order:
   the uploaded wallpaper, the hand-edited sprite hook, then the default
   striped pattern. Setting --wall-image to none simply skips the first. */
.wall{
  position:absolute;left:0;right:0;top:0;bottom:var(--floor-line);
  background-image:
    var(--wall-image,none),
    var(--sprite-wall),
    repeating-linear-gradient(90deg,var(--wainscot) 0 26px,var(--wainscot-2) 26px 52px);
  background-size:var(--wall-size,256px 256px),auto,auto;
  background-repeat:var(--wall-repeat,repeat),repeat,repeat;
  background-position:center top,top left,top left;
  border-bottom:8px solid var(--wood-dk);
}
.wainscot{
  position:absolute;left:0;right:0;bottom:calc(var(--floor-line) + 8px);height:90px;
  background:repeating-linear-gradient(90deg,#2a1d12 0 40px,var(--wood-dk) 40px 46px);
  border-top:6px solid #4b3a24;
}
.floor{
  position:absolute;left:0;right:0;bottom:0;height:var(--floor-line);
  background-image:var(--sprite-floor),
    repeating-linear-gradient(0deg,#3b2a19 0 14px,#2f2112 14px 28px);
}
.rug{
  position:absolute;bottom:2%;left:50%;transform:translateX(-50%);
  width:56%;height:60%;background:var(--velvet);
  border:8px solid #3d1418;box-shadow:inset 0 0 0 10px #6d2830;
}
.window{
  position:absolute;bottom:calc(var(--floor-line) + 150px);
  left:var(--window-x);transform:translateX(-50%);
  width:var(--window-w);height:var(--window-h);
  background:var(--glass);border:12px solid var(--wood-dk);
  box-shadow:10px 10px 0 rgba(0,0,0,.35);
}
/* gothic arch, built from stacked bars so it stays hard-edged (no radius) */
.window .arch{position:absolute;left:0;right:0;top:0;height:110px;overflow:hidden}
.window .arch i{
  display:block;margin:0 auto;background:var(--wood-dk);height:11px;
}
.window .mullion-v{position:absolute;top:0;bottom:0;left:50%;width:10px;
  transform:translateX(-50%);background:var(--wood-dk)}
.window .mullion-h{position:absolute;left:0;right:0;height:10px;background:var(--wood-dk)}
.shaft{  /* light shaft from the window onto the floor */
  position:absolute;left:calc(var(--window-x) - 150px);
  bottom:var(--floor-line);width:300px;height:260px;
  background:linear-gradient(180deg,rgba(255,231,168,.16),rgba(255,231,168,0));
  transform:skewX(-14deg);transform-origin:top center;
}

/* --- mid layer: the furniture ----------------------------------------- */
.obj{
  position:absolute;bottom:var(--floor-line);   /* <- the single baseline  */
  cursor:pointer;transform-origin:bottom center;
}
.obj .sprite{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}
.obj-desk  .sprite{background-image:var(--sprite-desk)}
.obj-shelf .sprite{background-image:var(--sprite-shelf)}
.obj-ward  .sprite{background-image:var(--sprite-ward)}
.obj-bin   .sprite{background-image:var(--sprite-bin)}
.obj-gramo .sprite{background-image:var(--sprite-gramo)}
.obj-desk  .art{display:var(--art-desk)}
.obj-shelf .art{display:var(--art-shelf)}
.obj-ward  .art{display:var(--art-ward)}
.obj-bin   .art{display:var(--art-bin)}
.obj-gramo .art{display:var(--art-gramo)}
.obj .art{position:absolute;inset:0}
.obj:hover{filter:brightness(1.18) saturate(1.05)}
.obj:hover,.obj.focused{outline:4px solid var(--gold);outline-offset:6px}
.obj .label{
  position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  margin-bottom:14px;white-space:nowrap;background:var(--ink);color:var(--gold-lt);
  border:3px solid var(--gold);padding:4px 9px;box-shadow:4px 4px 0 var(--shadow);
  opacity:0;font-size:12px;
}
.obj:hover .label,.obj.focused .label{opacity:1}
.obj .badge{
  position:absolute;top:-14px;right:-14px;min-width:26px;height:26px;
  background:var(--gold);color:var(--ink);border:3px solid var(--wood-dk);
  font-size:11px;text-align:center;line-height:20px;box-shadow:3px 3px 0 var(--shadow);
}

/* desk ------------------------------------------------------------------ */
.obj-desk{left:var(--desk-x);width:var(--desk-w);height:var(--desk-h)}
.d-top{position:absolute;left:0;right:0;top:34%;height:16px;background:var(--wood-lt);
  border:4px solid var(--wood-dk)}
.d-body{position:absolute;left:6%;right:6%;top:calc(34% + 16px);bottom:16%;
  background:var(--wood);border:4px solid var(--wood-dk)}
.d-drawer{position:absolute;left:8%;right:8%;height:26%;background:var(--wood-lt);
  border:3px solid var(--wood-dk)}
.d-drawer.a{top:10%}.d-drawer.b{top:44%}
.d-drawer i{position:absolute;top:40%;left:50%;width:26px;height:6px;
  transform:translateX(-50%);background:var(--gold)}
.d-leg{position:absolute;bottom:0;width:16px;height:18%;background:var(--wood-dk)}
.d-leg.l{left:8%}.d-leg.r{right:8%}
.d-paper{position:absolute;top:22%;left:16%;width:56px;height:42px;background:var(--parchment);
  border:3px solid #9c8c68;box-shadow:5px -5px 0 rgba(0,0,0,.3)}
.d-paper.two{left:26%;top:18%;transform:rotate(-4deg)}
.d-ink{position:absolute;top:20%;right:18%;width:26px;height:30px;background:#141414;
  border:3px solid #000}
.d-ink::after{content:"";position:absolute;top:-16px;left:6px;width:6px;height:20px;
  background:var(--parchment);transform:rotate(18deg)}
.d-lamp{position:absolute;top:2%;right:8%;width:40px;height:34px;background:var(--gold);
  border:4px solid var(--wood-dk)}
.d-lamp::after{content:"";position:absolute;left:14px;top:100%;width:8px;height:26px;
  background:var(--wood-dk)}

/* bookshelf ------------------------------------------------------------- */
.obj-shelf{left:var(--shelf-x);width:var(--shelf-w);height:var(--shelf-h)}
.b-frame{position:absolute;inset:0;background:var(--wood);border:8px solid var(--wood-dk);
  box-shadow:inset 0 0 0 4px var(--wood-lt)}
.b-shelf{position:absolute;left:8px;right:8px;height:22%;border-bottom:8px solid var(--wood-dk);
  display:flex;align-items:flex-end;gap:3px;padding:0 8px 6px}
.b-shelf:nth-child(2){top:4%}
.b-shelf:nth-child(3){top:28%}
.b-shelf:nth-child(4){top:52%}
.b-shelf:nth-child(5){top:76%;border-bottom:none}
.spine{width:12px;background:var(--velvet);border:2px solid var(--ink);
  border-bottom:none;height:70%}
.spine.s2{background:#2f4a34;height:82%}
.spine.s3{background:#2c3a5b;height:64%;width:15px}
.spine.s4{background:#6b4f1f;height:78%}
.spine.s5{background:#4a2350;height:88%;width:10px}
.spine.s6{background:#7a4a1c;height:60%;width:16px}
.b-cand{position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  width:14px;height:30px;background:var(--parchment)}
.b-cand::after{content:"";position:absolute;top:-16px;left:2px;width:10px;height:16px;
  background:var(--candle);box-shadow:0 0 0 4px rgba(255,207,122,.25)}

/* wardrobe -------------------------------------------------------------- */
.obj-ward{left:var(--ward-x);width:var(--ward-w);height:var(--ward-h)}
.w-body{position:absolute;inset:0;top:26px;background:var(--wood);
  border:8px solid var(--wood-dk)}
.w-ped{position:absolute;top:0;left:-10px;right:-10px;height:30px;background:var(--wood-lt);
  border:6px solid var(--wood-dk)}
.w-door{position:absolute;top:14px;bottom:40px;width:44%;background:var(--wood-lt);
  border:5px solid var(--wood-dk)}
.w-door.l{left:12px}.w-door.r{right:12px}
.w-door::after{content:"";position:absolute;inset:14px;border:5px solid var(--wood-dk);
  background:rgba(0,0,0,.16)}
.w-knob{position:absolute;top:46%;width:12px;height:12px;background:var(--gold);
  border:3px solid var(--wood-dk);z-index:2}
.w-knob.l{left:calc(12px + 44% - 20px)}
.w-knob.r{right:calc(12px + 44% - 20px)}
.w-foot{position:absolute;bottom:0;width:22px;height:22px;background:var(--wood-dk)}
.w-foot.l{left:6px}.w-foot.r{right:6px}

/* wastepaper basket ----------------------------------------------------- */
.obj-bin{left:var(--bin-x);width:var(--bin-w);height:var(--bin-h)}
.bin-row{position:absolute;left:50%;transform:translateX(-50%);
  background:var(--wood-lt);border:3px solid var(--wood-dk)}
.bin-row.r1{bottom:0;   width:70%;height:22%}
.bin-row.r2{bottom:22%; width:82%;height:24%}
.bin-row.r3{bottom:46%; width:92%;height:24%}
.bin-row.r4{bottom:70%; width:100%;height:22%;background:var(--wood)}
.bin-ball{position:absolute;top:-10px;left:8px;width:22px;height:20px;
  background:var(--parchment);border:3px solid #9c8c68}
.bin-ball.two{left:38px;top:-4px;width:18px;height:16px}

/* --- foreground layer -------------------------------------------------- */
.curtain{position:absolute;top:0;bottom:0;width:120px;
  background:repeating-linear-gradient(90deg,var(--velvet) 0 14px,#41161c 14px 28px);
  border-bottom:10px solid #2b0e12}
.curtain.l{left:0;box-shadow:12px 0 0 rgba(0,0,0,.35)}
.curtain.r{right:0;box-shadow:-12px 0 0 rgba(0,0,0,.35)}
.fg-candle{position:absolute;bottom:2%;left:8%;width:54px;height:120px}
.fg-candle .wax{position:absolute;bottom:0;left:10px;width:34px;height:76px;
  background:var(--parchment);border:4px solid #9c8c68}
.fg-candle .dish{position:absolute;bottom:-10px;left:-4px;width:62px;height:16px;
  background:var(--gold);border:4px solid var(--wood-dk)}
.fg-candle .flame{position:absolute;bottom:76px;left:20px;width:14px;height:24px;
  background:var(--candle);box-shadow:0 0 0 6px rgba(255,207,122,.18)}
/* Heavy dark-academia vignette. Multiply, so it deepens what is underneath
   instead of fogging it with a flat wash. Weighted hard into the two upper
   corners, and kept light near the floor so candlelight can carry. */
.vignette{position:absolute;inset:0;pointer-events:none;
  mix-blend-mode:multiply;opacity:var(--vig,1);
  transition:opacity 1.6s linear;
  background:
    radial-gradient(78% 62% at 0% 0%,   var(--vignette-c) 0%, rgba(8,5,3,.72) 30%, rgba(8,5,3,0) 66%),
    radial-gradient(78% 62% at 100% 0%, var(--vignette-c) 0%, rgba(8,5,3,.72) 30%, rgba(8,5,3,0) 66%),
    radial-gradient(120% 108% at 50% 68%, rgba(8,5,3,0) 30%, rgba(8,5,3,.42) 62%,
                    rgba(8,5,3,.86) 86%, var(--vignette-c) 100%)}

/* --- HUD --------------------------------------------------------------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;gap:8px;
  align-items:center;padding:10px 14px;background:linear-gradient(180deg,rgba(13,8,6,.9),rgba(13,8,6,0))}
#hud .title{color:var(--gold-lt);font-size:15px;text-shadow:2px 2px 0 var(--shadow);flex:1}
#hud .mode{font-size:11px;color:var(--parchment-d);margin-right:6px}
#toasts{position:fixed;right:14px;bottom:14px;z-index:1200;display:flex;
  flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--wood);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--shadow);
  padding:8px 12px;max-width:380px}
.toast.warn{background:var(--danger)}
.toast.ok{background:var(--ok)}

/* =========================================================================
   MODAL - the organizer. 84vw x 84vh as specified.
   ========================================================================= */
.modal-wrap{position:fixed;inset:0;z-index:500;background:rgba(8,5,3,.78);
  display:flex;align-items:center;justify-content:center;
  perspective:1600px;                     /* lets the wardrobe swing in 3D */
  opacity:0;transition:opacity .18s linear}
.modal-wrap.shown{opacity:1}
.modal{width:84vw;height:84vh;background:var(--mahogany);
  border:8px solid var(--wood-dk);box-shadow:14px 14px 0 var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
  transform:translate3d(0,0,0);will-change:transform,opacity}
/* Spatial open: the panel flies from the clicked object's bounding box.
   Easing is a real cubic-bezier - stepped keyframes made this stutter. */
.modal.anim,.chat.anim,.settings.anim,.palette.anim,.drawer.anim{
  transition:transform .34s cubic-bezier(.16,.84,.30,1),opacity .26s linear}
.modal-head{display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:var(--wood);border-bottom:6px solid var(--wood-dk)}
.modal-head .h-title{flex:1;color:var(--gold-lt);font-size:16px;
  text-shadow:2px 2px 0 var(--shadow)}
.modal-body{flex:1;display:flex;min-height:0}
.cats{width:250px;flex:none;background:var(--ink);border-right:6px solid var(--wood-dk);
  overflow-y:auto;padding:10px}
.cats h4{margin:0 0 8px;color:var(--gold);font-size:12px;letter-spacing:1px}
.cat-item{display:flex;align-items:center;gap:4px;margin-bottom:6px;
  border:3px solid var(--wood);background:var(--mahogany);padding:5px 6px;cursor:pointer}
.cat-item:hover{border-color:var(--wood-lt)}
.cat-item.active{border-color:var(--gold);background:var(--wood)}
.cat-item .cname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-item .ccount{color:var(--parchment-d);font-size:11px}
.entries{flex:1;overflow-y:auto;padding:14px 18px;min-width:0}
.entries-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.entries-head h3{margin:0;flex:1;color:var(--gold-lt);font-size:15px}
.entry{background:var(--ink);border:4px solid var(--wood);
  box-shadow:6px 6px 0 var(--shadow);margin-bottom:16px}
.entry.daily{border-color:var(--gold)}
.entry-head{display:flex;align-items:center;gap:6px;padding:7px 9px;
  background:var(--wood);border-bottom:4px solid var(--wood-dk);flex-wrap:wrap}
.entry-head .etitle{flex:1;min-width:120px;background:transparent;border:3px solid transparent;
  color:var(--gold-lt);font-size:14px;padding:3px 5px}
.entry-head .etitle:hover{border-color:var(--wood-lt)}
.entry-head .etitle:focus{border-color:var(--gold);background:var(--ink)}
.entry-body{padding:10px 12px}
.md{word-wrap:break-word}
.md h1,.md h2,.md h3{color:var(--gold-lt);margin:.5em 0 .3em;font-size:15px}
.md h1{font-size:18px;border-bottom:3px solid var(--wood)}
.md a{color:var(--gold);text-decoration:underline}
.md code{background:var(--wood-dk);border:2px solid var(--wood);padding:0 4px}
.md blockquote{border-left:6px solid var(--gold);margin:6px 0;padding:2px 10px;
  color:var(--parchment-d);background:rgba(0,0,0,.25)}
.md hr{border:none;border-top:4px solid var(--wood);margin:10px 0}
.md ul{margin:6px 0;padding-left:22px}
.md li{margin:2px 0}
.md li.task{list-style:none;margin-left:-22px;display:flex;gap:8px;align-items:flex-start}
.md .cb{cursor:pointer;color:var(--gold);border:2px solid var(--wood);
  padding:0 4px;user-select:none;flex:none}
.md .cb:hover{background:var(--wood);color:var(--gold-lt)}
.md .cb.on{color:var(--ok);border-color:var(--ok)}
.md .done{text-decoration:line-through;color:var(--parchment-d)}
.md .empty{color:var(--parchment-d);font-style:italic}
.list-item{display:flex;align-items:center;gap:8px;padding:4px 0;
  border-bottom:2px solid rgba(255,255,255,.05)}
.list-item .li-text{flex:1;background:transparent;border:3px solid transparent;padding:3px 5px}
.list-item .li-text:hover{border-color:var(--wood)}
.list-item .li-text:focus{border-color:var(--gold);background:var(--ink)}
.list-item.done .li-text{text-decoration:line-through;color:var(--parchment-d)}
.li-box{width:20px;height:20px;flex:none;border:3px solid var(--wood);background:var(--ink);
  cursor:pointer;color:var(--ok);text-align:center;line-height:14px;font-size:13px}
.li-box:hover{border-color:var(--gold)}
.entry-meta{font-size:11px;color:var(--parchment-d);padding:0 12px 8px}

/* =========================================================================
   CHAT - self-chat thread
   ========================================================================= */
#chatPanel{position:fixed;inset:0;z-index:700;background:rgba(8,5,3,.86);
  display:flex;align-items:center;justify-content:center}
.chat{width:72vw;height:84vh;max-width:900px;background:var(--mahogany);
  border:8px solid var(--wood-dk);box-shadow:14px 14px 0 var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--wood);
  border-bottom:6px solid var(--wood-dk)}
.chat-head .c-title{flex:1;color:var(--gold-lt);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.chat-log{flex:1;overflow-y:auto;padding:14px;background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 2px,transparent 2px 4px),var(--ink)}
.chat-sentinel{height:1px}
.chat-older{text-align:center;color:var(--parchment-d);font-size:11px;padding:6px 0}
.bubble{max-width:78%;margin:0 0 12px auto;background:var(--wood);
  border:4px solid var(--wood-dk);box-shadow:5px 5px 0 var(--shadow);padding:8px 10px}
.bubble .b-time{font-size:10px;color:var(--parchment-d);margin-bottom:4px}
.bubble .b-text{white-space:pre-wrap;word-wrap:break-word}
.bubble .b-tools{margin-top:6px;display:flex;gap:6px;justify-content:flex-end}
.att{display:flex;align-items:center;gap:8px;margin-top:8px;width:100%;text-align:left;
  background:var(--ink);border:3px solid var(--gold);box-shadow:4px 4px 0 var(--shadow);
  padding:6px 8px;cursor:pointer;color:var(--parchment)}
.att:hover{background:var(--wood-dk);color:var(--gold-lt)}
.att .a-thumb{width:44px;height:44px;flex:none;border:2px solid var(--wood);
  background:var(--wood-dk) center/cover no-repeat;text-align:center;line-height:44px}
.att .a-meta{flex:1;min-width:0}
.att .a-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .a-sub{font-size:10px;color:var(--parchment-d)}
.chat-staged{background:var(--wood-dk);border-top:4px solid var(--gold);padding:6px 10px;
  color:var(--gold-lt);font-size:11px;display:flex;gap:8px;align-items:center}
.chat-compose{border-top:6px solid var(--wood-dk);background:var(--wood);padding:10px;
  display:flex;gap:8px;align-items:flex-end}
.chat-compose textarea{flex:1;min-height:56px;max-height:180px}

/* =========================================================================
   TRASH
   ========================================================================= */
.trash-item{display:flex;align-items:center;gap:10px;background:var(--ink);
  border:4px solid var(--wood);box-shadow:5px 5px 0 var(--shadow);padding:8px 10px;
  margin-bottom:10px}
.trash-item .t-meta{flex:1;min-width:0}
.trash-item .t-name{color:var(--gold-lt);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.trash-item .t-sub{font-size:11px;color:var(--parchment-d)}

/* =========================================================================
   ============================ PHASE 2 ====================================
   ========================================================================= */

/* -------------------------------------------------------------------------
   GPU PROMOTION
   Everything that ever moves gets its own composited layer, so motion is a
   transform on the GPU instead of a paint on the main thread. Anything not
   in this list is deliberately static.
   ---------------------------------------------------------------------- */
.layer,#lighting,.modal,.chat,.settings,.palette,#candlePointer,#editBar,.mote,
.wallclock .hand,.fg-candle .flame,.b-flame,.switch i{
  will-change:transform;
  transform:translate3d(0,0,0);
  backface-visibility:hidden;
}
.obj{will-change:transform}
body.paused .mote,body.paused .hint{animation-play-state:paused}

/* -------------------------------------------------------------------------
   [SECTION: LIGHTING]  One overlay, two blended planes, driven by the clock.
   Ambience.applyLighting() swaps the custom properties; CSS does the fade.
   ---------------------------------------------------------------------- */
/* NO z-index here on purpose: a z-index would make #lighting its own
   stacking context and the screen-blended lights would stop lighting the
   room behind them. DOM order alone puts it above the three layers. */
#lighting{position:absolute;inset:0;pointer-events:none}

/* One warm point light per real flame / bulb. Positions are written by
   Lights.frame() from each source's actual screen box, so they ride the
   parallax and the rearrange mode for free. */
.plight{position:absolute;left:0;top:0;pointer-events:none;
  mix-blend-mode:screen;will-change:transform,opacity;
  background:radial-gradient(circle closest-side,
    rgba(255,206,130,.95) 0%,
    rgba(255,170,80,.55) 34%,
    rgba(255,140,50,.20) 58%,
    rgba(255,120,40,0) 78%)}
.plight.cold{background:radial-gradient(circle closest-side,
    rgba(198,222,245,.55) 0%,
    rgba(150,185,225,.28) 40%,
    rgba(120,160,210,0) 76%)}
.shaft{opacity:var(--shaft-op,1);transition:opacity 1.6s linear}
.window{transition:background 1.6s linear}

/* -------------------------------------------------------------------------
   DUST MOTES - 12 two-pixel squares drifting up the light shaft.
   Pure CSS keyframes; JS only seeds position/duration/delay once.
   ---------------------------------------------------------------------- */
#motes{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.mote{position:absolute;width:2px;height:2px;background:rgba(255,231,168,.8);
  animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drift{
  0%  {transform:translate3d(0,0,0);        opacity:0}
  12% {opacity:.9}
  50% {transform:translate3d(16px,-96px,0); opacity:.55}
  88% {opacity:.4}
  100%{transform:translate3d(-12px,-204px,0);opacity:0}
}

/* candle flame on the bookshelf is a real element now so JS can flicker it */
.b-flame{position:absolute;top:-16px;left:2px;width:10px;height:16px;background:var(--candle)}
.b-glow,.fg-glow{position:absolute;pointer-events:none;background:radial-gradient(
  circle,rgba(255,207,122,.45),rgba(255,207,122,0) 70%);will-change:opacity,transform}
.b-glow{width:70px;height:70px;top:-44px;left:-28px}
.fg-glow{width:180px;height:180px;bottom:30px;left:-63px}

/* -------------------------------------------------------------------------
   WALL CLOCK + TEAR-OFF CALENDAR
   Both anchored the same way as furniture: left + a height above the floor
   line, so the rearrange code treats every movable object identically.
   ---------------------------------------------------------------------- */
.wallclock{position:absolute;left:var(--clock-x);bottom:calc(var(--floor-line) + var(--clock-y));
  width:96px;height:96px;background:var(--parchment);border:6px solid var(--wood-dk);
  box-shadow:6px 6px 0 rgba(0,0,0,.4)}
.wallclock .pip{position:absolute;width:6px;height:6px;background:var(--wood-dk)}
.wallclock .hand{position:absolute;left:50%;bottom:50%;background:var(--ink);
  transform-origin:50% 100%}
.wallclock .hand.h{width:6px;height:24px;margin-left:-3px}
.wallclock .hand.m{width:4px;height:32px;margin-left:-2px}
.wallclock .hand.s{width:2px;height:34px;margin-left:-1px;background:var(--danger)}
.wallclock .cap{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
  background:var(--gold);z-index:2}
.calendar{position:absolute;left:var(--cal-x);bottom:calc(var(--floor-line) + var(--cal-y));
  width:84px;height:102px;background:var(--parchment);border:5px solid var(--wood-dk);
  box-shadow:6px 6px 0 rgba(0,0,0,.4);text-align:center;color:var(--ink);overflow:hidden}
.calendar .m{background:var(--danger);color:var(--parchment);font-size:11px;padding:2px 0;
  border-bottom:4px solid var(--wood-dk)}
.calendar .d{font-size:34px;line-height:1.15;padding-top:4px}
.calendar .w{font-size:10px;color:#5a4a33}
.calendar .tear{position:absolute;left:0;right:0;bottom:0;height:8px;
  background:repeating-linear-gradient(90deg,var(--wood-dk) 0 5px,transparent 5px 11px)}

/* dynamic desk paper stack - height tracks unfinished tasks */
.d-stack{position:absolute;left:14%;bottom:calc(66% - 6px);width:58px}
.d-stack .sheet{position:absolute;left:0;width:56px;height:8px;background:var(--parchment);
  border:2px solid #9c8c68}

/* -------------------------------------------------------------------------
   [SECTION: REARRANGE MODE]
   ---------------------------------------------------------------------- */
body.editing [data-move]{cursor:grab;outline:3px dashed var(--gold);outline-offset:5px}
body.editing [data-move]:hover{outline-color:var(--gold-lt)}
body.editing [data-move].dragging{cursor:grabbing;outline-style:solid;outline-color:var(--gold-lt);z-index:60}
body.editing .obj:hover{filter:none}
body.editing .obj .label,body.editing .obj .badge{opacity:0 !important}
body.editing .vignette{opacity:.3}
#editBar{position:fixed;left:50%;bottom:18px;z-index:400;
  transform:translate3d(-50%,0,0);display:flex;gap:10px;align-items:center;
  background:var(--wood);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--shadow);
  padding:8px 12px;font-size:12px}
#editBar .hintline{color:var(--gold-lt)}
#editBar .scaleval{color:var(--gold-lt);min-width:44px;text-align:right;
  border:2px solid var(--gold-dk);padding:1px 5px;background:rgba(0,0,0,.35)}

/* -------------------------------------------------------------------------
   SETTINGS
   ---------------------------------------------------------------------- */
.settings{width:min(580px,90vw);max-height:86vh;overflow-y:auto;background:var(--mahogany);
  border:8px solid var(--wood-dk);box-shadow:14px 14px 0 var(--shadow);
  transform:translate3d(0,0,0);will-change:transform,opacity}
.set-sec{border-bottom:5px solid var(--wood-dk);padding:12px 16px}
.set-sec:last-child{border-bottom:none}
.set-sec h4{margin:0 0 10px;color:var(--gold);font-size:12px;letter-spacing:1.4px}
.set-row{display:flex;align-items:center;gap:12px;margin:9px 0}
.set-row .lbl{flex:1;min-width:0}
.set-row .val{width:46px;text-align:right;color:var(--gold-lt);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:190px;height:20px;padding:0;
  background:var(--ink);border:3px solid var(--wood);cursor:pointer}
input[type=range]:focus{border-color:var(--gold)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:14px;
  background:var(--gold);border:3px solid var(--wood-dk);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:14px;background:var(--gold);
  border:3px solid var(--wood-dk);border-radius:0;cursor:pointer}
.switch{width:54px;height:26px;background:var(--ink);border:3px solid var(--wood);
  position:relative;cursor:pointer;flex:none}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:16px;background:var(--wood-lt);
  transition:transform .18s cubic-bezier(.2,.8,.25,1)}
.switch.on{border-color:var(--gold)}
.switch.on i{background:var(--gold);transform:translate3d(22px,0,0)}
.gear{position:relative;display:inline-block;width:14px;height:14px;background:var(--gold);
  vertical-align:-2px;margin-right:4px}
.gear i{position:absolute;background:var(--gold);width:4px;height:4px}
.gear i:nth-child(1){top:-4px;left:5px}
.gear i:nth-child(2){bottom:-4px;left:5px}
.gear i:nth-child(3){left:-4px;top:5px}
.gear i:nth-child(4){right:-4px;top:5px}
.gear b{position:absolute;left:5px;top:5px;width:4px;height:4px;background:var(--wood)}
button:hover .gear,button:hover .gear i{background:var(--gold-lt)}

/* -------------------------------------------------------------------------
   COMMAND PALETTE (the grimoire)
   ---------------------------------------------------------------------- */
#paletteWrap{position:fixed;inset:0;z-index:800;background:rgba(8,5,3,.82);
  display:flex;align-items:flex-start;justify-content:center;padding-top:9vh;
  opacity:0;transition:opacity .16s linear}
#paletteWrap.shown{opacity:1}
.palette{width:min(780px,92vw);max-height:76vh;display:flex;flex-direction:column;
  background:var(--mahogany);border:8px solid var(--gold);
  box-shadow:14px 14px 0 var(--shadow);transform:translate3d(0,0,0);
  will-change:transform,opacity}
.palette .p-head{background:var(--wood);border-bottom:5px solid var(--wood-dk);
  padding:8px 12px;color:var(--gold-lt);font-size:12px;display:flex;gap:10px;align-items:center}
.palette .p-head .spacer{flex:1}
.palette input{width:100%;border:none;border-bottom:5px solid var(--wood-dk);
  background:var(--ink);font-size:17px;padding:12px 14px;color:var(--parchment)}
.p-results{overflow-y:auto}
.p-item{display:flex;gap:10px;align-items:center;padding:7px 12px;cursor:pointer;
  border-bottom:2px solid rgba(255,255,255,.05)}
.p-item:hover{background:rgba(255,255,255,.05)}
.p-item.sel{background:var(--wood);outline:3px solid var(--gold);outline-offset:-3px}
.p-kind{font-size:10px;color:var(--ink);background:var(--gold);padding:1px 6px;flex:none}
.p-kind.msg{background:var(--parchment-d)}
.p-kind.cat{background:var(--gold-lt)}
.p-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-sub{font-size:10px;color:var(--parchment-d);flex:none;max-width:32%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.p-main b{color:var(--gold-lt)}
.p-empty{padding:18px;color:var(--parchment-d)}

/* -------------------------------------------------------------------------
   JRPG CANDLE POINTER - marks the keyboard-focused hotspot
   ---------------------------------------------------------------------- */
#candlePointer{position:fixed;z-index:150;width:24px;height:36px;pointer-events:none;
  opacity:0;transition:opacity .18s linear;left:0;top:0}
#candlePointer.on{opacity:1}
#candlePointer .c-wax{position:absolute;bottom:0;left:6px;width:12px;height:20px;
  background:var(--parchment);border:2px solid #9c8c68}
#candlePointer .c-dish{position:absolute;bottom:-4px;left:1px;width:22px;height:6px;
  background:var(--gold);border:2px solid var(--wood-dk)}
#candlePointer .c-flame{position:absolute;bottom:21px;left:9px;width:6px;height:11px;
  background:var(--candle);box-shadow:0 0 0 4px rgba(255,207,122,.22)}
.obj.focused{outline:4px solid var(--gold-lt);outline-offset:6px}

/* =========================================================================
   ============================== PHASE 3 ==================================
   ========================================================================= */

/* -------------------------------------------------------------------------
   [SECTION: SKY & WEATHER]  What you see through the gothic window.
   Sky.apply() swaps these custom properties; the CSS fades between them.
   ---------------------------------------------------------------------- */
.window{background:var(--sky-far,#93a7b4)}
.window .sky{position:absolute;inset:0;overflow:hidden;
  background:var(--sky-grad,linear-gradient(180deg,#5b9bd5,#cfe6f5));
  transition:background 2.4s linear}
.window .skyline{position:absolute;left:0;right:0;bottom:0;height:22%;
  background:var(--sky-ground,#2f3b2c);opacity:.85;
  border-top:4px solid rgba(0,0,0,.35);transition:background 2.4s linear}
.window .sun-moon{position:absolute;width:30px;height:30px;
  left:var(--celestial-x,50%);top:var(--celestial-y,30%);
  margin:-15px 0 0 -15px;background:var(--celestial,#ffe6a8);
  opacity:var(--celestial-op,1);
  box-shadow:0 0 0 6px var(--celestial-halo,rgba(255,230,168,.22));
  transition:background 2.4s linear,opacity 2.4s linear}
.window .stars{position:absolute;inset:0;opacity:var(--star-op,0);
  transition:opacity 2.4s linear}
.window .stars i{position:absolute;width:2px;height:2px;background:#fff;
  animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.window .clouds{position:absolute;inset:0;opacity:var(--cloud-op,.75);
  transition:opacity 2.4s linear}
.window .cloud{position:absolute;animation:cloudDrift linear infinite;will-change:transform}
.window .cloud i{position:absolute;background:rgba(255,255,255,.82)}
@keyframes cloudDrift{
  0%  {transform:translate3d(-90px,0,0)}
  100%{transform:translate3d(330px,0,0)}
}
/* rain running down the inside of the panes */
.rain-glass{position:absolute;inset:0;overflow:hidden;z-index:2;
  opacity:0;transition:opacity 1.4s linear}
.rain-glass.on{opacity:1}
.rain-glass .drop{position:absolute;width:2px;
  background:linear-gradient(180deg,rgba(206,230,255,0),rgba(206,230,255,.85));
  animation-name:dropFall;animation-timing-function:linear;
  animation-iteration-count:infinite;will-change:transform}
@keyframes dropFall{
  0%  {transform:translate3d(0,-60px,0);opacity:0}
  8%  {opacity:.95}
  92% {opacity:.75}
  100%{transform:translate3d(0,420px,0);opacity:0}
}
body.paused .rain-glass .drop,body.paused .cloud,body.paused .stars i,
body.paused .note{animation-play-state:paused}

/* -------------------------------------------------------------------------
   [SECTION: GRAMOPHONE]
   ---------------------------------------------------------------------- */
.obj-gramo{left:var(--gramo-x);width:var(--gramo-w);height:var(--gramo-h)}
.obj-gramo .art{position:absolute;inset:0}
.g-base{position:absolute;left:6%;right:6%;bottom:0;height:34%;
  background:var(--wood);border:5px solid var(--wood-dk);
  box-shadow:inset 0 5px 0 var(--wood-lt)}
.g-base .g-vent{position:absolute;bottom:22%;left:18%;width:26px;height:5px;background:var(--wood-dk)}
.g-base .g-vent.two{bottom:44%}
.g-plate{position:absolute;left:10%;right:10%;bottom:32%;height:16px;
  background:var(--wood-lt);border:4px solid var(--wood-dk)}
.g-disc{position:absolute;left:50%;top:-9px;width:64px;height:14px;margin-left:-32px;
  background:var(--ink);border:3px solid #000}
.g-disc .g-spindle{position:absolute;left:50%;top:3px;width:4px;height:6px;
  margin-left:-2px;background:var(--gold)}
.g-disc.spin{animation:discSpin 1.6s linear infinite}
@keyframes discSpin{from{transform:scaleX(1)}50%{transform:scaleX(.86)}to{transform:scaleX(1)}}
.g-arm{position:absolute;right:16%;bottom:40%;width:30px;height:5px;
  background:var(--gold);transform:rotate(-16deg);transform-origin:right center}
.g-horn{position:absolute;left:4%;bottom:44%;width:60%;
  transform:rotate(-12deg);transform-origin:bottom right}
.g-horn i{display:block;margin:0 auto 0 0;height:9px;background:var(--gold);
  border:3px solid var(--wood-dk);border-bottom:none}
.g-horn i:last-child{border-bottom:3px solid var(--wood-dk);background:var(--gold-lt)}
.g-crank{position:absolute;right:0;bottom:16%;width:20px;height:6px;background:var(--wood-dk)}
.g-crank::after{content:"";position:absolute;right:-4px;top:-10px;width:6px;height:14px;
  background:var(--wood-dk)}
.obj-gramo.playing .g-horn{animation:hornPulse 2.2s ease-in-out infinite}
@keyframes hornPulse{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(-12deg) scale(1.035)}}
body.paused .obj-gramo .g-horn,body.paused .g-disc{animation-play-state:paused}

/* music notes drifting out of the horn */
.g-notes{position:absolute;left:0;top:-40px;width:100%;height:120px;pointer-events:none}
.note{position:absolute;color:var(--gold-lt);font-size:16px;line-height:1;
  text-shadow:2px 2px 0 var(--shadow);will-change:transform,opacity;
  animation:noteFloat linear forwards}
@keyframes noteFloat{
  0%  {transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  15% {opacity:1}
  100%{transform:translate3d(var(--nx,20px),-110px,0) rotate(var(--nr,18deg));opacity:0}
}

/* media drawer */
.drawer{width:min(720px,90vw);max-height:86vh;display:flex;flex-direction:column;
  background:var(--mahogany);border:8px solid var(--wood-dk);
  box-shadow:14px 14px 0 var(--shadow);transform:translate3d(0,0,0);
  will-change:transform,opacity;overflow:hidden}
.drawer .track-list{overflow-y:auto;flex:1;min-height:80px;max-height:38vh}
.track{display:flex;align-items:center;gap:10px;padding:7px 12px;cursor:pointer;
  border-bottom:2px solid rgba(255,255,255,.05)}
.track:hover{background:rgba(255,255,255,.05)}
.track.current{background:var(--wood);outline:3px solid var(--gold);outline-offset:-3px}
.track .t-num{color:var(--parchment-d);font-size:11px;width:22px;flex:none}
.track .t-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track .t-size{font-size:10px;color:var(--parchment-d);flex:none}
.player-bar{border-top:5px solid var(--wood-dk);background:var(--wood);padding:10px 12px}
.player-bar .now{color:var(--gold-lt);margin-bottom:8px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.seek{position:relative;height:16px;background:var(--ink);border:3px solid var(--wood-dk);
  cursor:pointer;margin-bottom:8px}
.seek .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold)}
.player-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.player-ctl .time{font-size:11px;color:var(--parchment-d);min-width:88px}

/* -------------------------------------------------------------------------
   [SECTION: CUSTOM SPRITES & PETS]
   ---------------------------------------------------------------------- */
#spriteHost{position:absolute;inset:0;pointer-events:none}
.deco{position:absolute;bottom:var(--floor-line);pointer-events:auto;
  cursor:default;will-change:transform}
.deco img{display:block;width:100%;height:100%;object-fit:contain;
  image-rendering:pixelated;pointer-events:none}
.deco.is-pet{cursor:pointer}
.deco.is-pet:hover{filter:brightness(1.15)}
.deco .pet-tag{position:absolute;top:-10px;right:-10px;background:var(--gold);
  color:var(--ink);font-size:9px;padding:1px 4px;border:2px solid var(--wood-dk);
  opacity:0;pointer-events:none}
.deco.is-pet:hover .pet-tag,body.editing .deco .pet-tag{opacity:1}

/* retro speech bubble above a pet.
   --sp-shift is set by Decor.clampBubble() to nudge it back on screen when
   the pet stands near an edge; the tail stays pointing at the sprite. */
.speech{position:absolute;bottom:100%;left:50%;margin-bottom:16px;width:264px;
  --sp-shift:0px;
  transform:translate3d(calc(-50% + var(--sp-shift)),0,0);
  background:#f4e8c1;color:#2a1a0e;
  border:4px solid #2a1a0e;
  box-shadow:0 0 0 3px #c9b58a,7px 7px 0 var(--shadow);
  padding:10px 12px;font-family:var(--font-pixel);font-size:12px;line-height:1.55;
  letter-spacing:.4px;z-index:80;cursor:pointer;
  image-rendering:pixelated}
.speech::after{content:"";position:absolute;top:100%;left:50%;
  margin-left:calc(-9px - var(--sp-shift));
  width:18px;height:12px;background:#f4e8c1;
  border-right:4px solid #2a1a0e;border-bottom:4px solid #2a1a0e}
.speech .sp-caret{display:none;color:#7a5a34}
.speech.typing .sp-caret{display:inline;animation:caretBlink .5s steps(2,end) infinite}
@keyframes caretBlink{0%,50%{opacity:1}51%,100%{opacity:0}}
.speech.go{animation:speechIn .18s cubic-bezier(.2,.9,.3,1)}
@keyframes speechIn{from{transform:translate3d(calc(-50% + var(--sp-shift)),8px,0);opacity:0}
                    to{transform:translate3d(calc(-50% + var(--sp-shift)),0,0);opacity:1}}
body.paused .speech .sp-caret{animation-play-state:paused}

/* a frame carrying a bookmark */
.frame.linked{box-shadow:inset 0 0 0 3px var(--gold-lt),6px 7px 0 rgba(0,0,0,.55)}
.frame.linked:hover{outline:3px solid var(--gold-lt);outline-offset:3px}
.frame[data-move]{cursor:pointer}
.frame .f-tag{position:absolute;top:100%;left:50%;transform:translateX(-50%);
  margin-top:6px;background:var(--ink);color:var(--gold-lt);border:2px solid var(--gold-dk);
  font-size:9px;padding:1px 5px;white-space:nowrap;max-width:150px;overflow:hidden;
  text-overflow:ellipsis;opacity:0;pointer-events:none}
.frame:hover .f-tag,body.editing .frame .f-tag{opacity:1}

/* sprite manager rows in settings */
.sprite-row{display:flex;align-items:center;gap:9px;padding:7px;margin-bottom:8px;
  background:var(--ink);border:3px solid var(--wood)}
.sprite-row .s-thumb{width:44px;height:44px;flex:none;border:2px solid var(--wood-dk);
  background:var(--wood-dk);object-fit:contain}
.sprite-row .s-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sprite-row .s-lines{font-size:10px;color:var(--parchment-d)}

/* -------------------------------------------------------------------------
   CHAT IMAGES + LIGHTBOX
   ---------------------------------------------------------------------- */
.bubble .b-img{display:block;max-width:100%;height:auto;margin-top:8px;
  border:3px solid var(--wood-dk);cursor:zoom-in;background:var(--ink)}
.chat-log.dragover{outline:5px dashed var(--gold);outline-offset:-8px}
.staged-thumbs{display:flex;gap:6px;flex-wrap:wrap}
.staged-thumbs img{width:38px;height:38px;object-fit:cover;border:2px solid var(--gold)}
#lightbox{position:fixed;inset:0;z-index:1000;background:rgba(8,5,3,.92);
  display:flex;align-items:center;justify-content:center;cursor:zoom-out;flex-direction:column;gap:12px}
#lightbox img{max-width:92vw;max-height:84vh;border:6px solid var(--wood-dk);
  box-shadow:12px 12px 0 var(--shadow);background:var(--ink)}

/* storage badge */
.badge-pill{display:inline-block;padding:2px 8px;border:3px solid var(--wood-dk);
  font-size:11px;color:var(--ink)}
.badge-pill.good{background:#6f9c48}
.badge-pill.warn{background:var(--gold)}
.badge-pill.bad{background:var(--danger);color:var(--parchment)}

/* =========================================================================
   ============================== PHASE 4 ==================================
   ========================================================================= */

/* -------------------------------------------------------------------------
   [SECTION: WALL DECOR]  Everything here hangs on the wall but is anchored
   to the floor line, exactly like the furniture, and lives on the mid plane.
   Positions are the usual x / height-above-floor pair.
   ---------------------------------------------------------------------- */
.frame,.sconce,.wallshelf{position:absolute;bottom:calc(var(--floor-line) + var(--wd-y,300px));
  left:var(--wd-x,10%)}

/* --- framed artwork --- */
.frame{width:var(--frame-w,84px);height:var(--frame-h,104px);
  background:linear-gradient(180deg,#6a4f22,#3a2a10);
  border:5px solid var(--gold-dk);
  box-shadow:inset 0 0 0 3px var(--gold),6px 7px 0 rgba(0,0,0,.55);padding:7px}
.frame .f-mat{width:100%;height:100%;border:3px solid #2a2015;background:#0d0906}
.frame svg{display:block;width:100%;height:100%}
.frame-astro   {--wd-x:24.0%; --wd-y:252px}
.frame-portrait{--wd-x:10.0%; --wd-y:382px}
.frame-botanic {--wd-x:18.5%; --wd-y:382px}

/* --- brass wall sconces flanking the window --- */
.sconce{width:38px;height:74px;--wd-y:406px}
#sconceL{--wd-x:35.8%}
#sconceR{--wd-x:65.2%}
.sconce .sc-plate{position:absolute;left:11px;bottom:0;width:16px;height:26px;
  background:var(--brass);border:3px solid #6d5620}
.sconce .sc-arm{position:absolute;left:15px;bottom:24px;width:8px;height:14px;
  background:#8a6d2a}
.sconce .sc-cup{position:absolute;left:6px;bottom:36px;width:26px;height:8px;
  background:var(--brass);border:3px solid #6d5620}
.sconce .sc-candle{position:absolute;left:14px;bottom:44px;width:10px;height:18px;
  background:var(--parchment);border:2px solid #9c8c68}
.sconce .sc-flame{position:absolute;left:16px;bottom:62px;width:6px;height:12px;
  background:var(--candle);will-change:transform,opacity}

/* --- floating wall shelf with inkwell, quill and books --- */
.wallshelf{width:150px;height:62px;--wd-x:10.5%; --wd-y:250px}
.wallshelf .ws-plank{position:absolute;left:0;bottom:10px;width:150px;height:11px;
  background:var(--wood-lt);border:3px solid var(--wood-dk)}
.wallshelf .ws-brace{position:absolute;bottom:0;width:9px;height:12px;background:var(--wood-dk)}
.wallshelf .ws-brace.l{left:16px}
.wallshelf .ws-brace.r{right:16px}
.wallshelf .ws-book{position:absolute;bottom:21px;border:2px solid var(--ink)}
.wallshelf .ws-book.b1{left:12px;width:34px;height:9px;background:#5c2530}
.wallshelf .ws-book.b2{left:15px;width:30px;height:8px;background:#2f4a34;bottom:30px}
.wallshelf .ws-book.b3{left:18px;width:26px;height:7px;background:#2c3a5b;bottom:38px}
.wallshelf .ws-ink{position:absolute;right:22px;bottom:21px;width:20px;height:16px;
  background:#141414;border:3px solid #000}
.wallshelf .ws-quill{position:absolute;right:20px;bottom:34px;width:5px;height:22px;
  background:var(--parchment);transform:rotate(20deg);transform-origin:bottom center}

/* -------------------------------------------------------------------------
   [SECTION: HEADER TOOLBAR]  Gold-framed pixel bar matching the wainscoting.
   ---------------------------------------------------------------------- */
#hud{padding:10px 14px 0;background:none}
#hud .bar{
  display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 40px,rgba(0,0,0,.10) 40px 46px),
    linear-gradient(180deg,#33240f 0%,#231809 62%,#170f06 100%);
  border:4px solid var(--gold-dk);
  box-shadow:inset 0 0 0 2px var(--gold),inset 0 3px 0 rgba(255,255,255,.05),
             7px 7px 0 var(--shadow);
}
#hud .bar .title{
  flex:1;color:var(--gold-lt);font-size:15px;letter-spacing:2px;
  text-shadow:2px 2px 0 var(--shadow);padding-left:4px}
#hud .stud{width:7px;height:7px;background:var(--gold);flex:none;
  box-shadow:0 0 0 2px var(--gold-dk)}
#hud .mode{
  font-size:10px;color:var(--gold-lt);background:rgba(0,0,0,.42);
  border:2px solid var(--gold-dk);padding:2px 7px;margin-right:2px}
#hud .bar button{border-color:var(--gold-dk);background:#3a2a15}
#hud .bar button:hover{background:var(--wood-lt);color:var(--gold-lt)}

/* -------------------------------------------------------------------------
   WALLPAPER PREVIEW in settings
   ---------------------------------------------------------------------- */
.wp-preview{width:100%;height:92px;border:3px solid var(--wood);background:#0d0906;
  background-size:cover;background-position:center;margin:8px 0}

/* flash whatever the palette jumped to */
.entry.flash{outline:5px solid var(--gold);outline-offset:3px}
.bubble.flash{outline:4px solid var(--gold);outline-offset:3px}
#chatPanel{opacity:1}
.chat,.palette{transform:translate3d(0,0,0)}
</style>
</head>
<body>

<!-- ===================== INTRO ======================================== -->
<div id="intro">
  <div class="crack"></div>
  <div class="plate">THE CHAMBER</div>
  <div class="door l"><div class="panel a"></div><div class="panel b"></div><div class="knob"></div></div>
  <div class="door r"><div class="panel a"></div><div class="panel b"></div><div class="knob"></div></div>
  <div class="hint">click to skip</div>
</div>

<!-- ===================== HUD ========================================== -->
<div id="hud" class="hidden">
  <div class="bar">
    <span class="stud"></span>
    <span class="title">THE CHAMBER</span>
    <span class="mode" id="storageMode"></span>
    <button id="btnPalette" class="tiny" title="Search everything (Ctrl+K)">&#8981; SEARCH</button>
    <button id="btnExport" class="tiny">EXPORT</button>
    <button id="btnImport" class="tiny">IMPORT</button>
    <!-- pixel gear: a square with four notches and a punched-out centre -->
    <button id="btnSettings" class="tiny" title="Settings">
      <span class="gear"><i></i><i></i><i></i><i></i><b></b></span>SETTINGS
    </button>
    <span class="stud"></span>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" class="hidden">
</div>

<!-- keyboard-focus pointer: a little candle that floats beside the hotspot -->
<div id="candlePointer"><span class="c-flame"></span><span class="c-wax"></span><span class="c-dish"></span></div>

<!-- rearrange-mode toolbar -->
<div id="editBar" class="hidden">
  <span class="hintline">DRAG TO MOVE &middot; SCROLL TO RESIZE</span>
  <span class="muted">size</span><span class="scaleval" id="editScale">100%</span>
  <button class="tiny" id="btnSizeDown">&minus;</button>
  <button class="tiny" id="btnSizeUp">+</button>
  <button class="tiny" id="btnSizeReset">RESET SIZE</button>
  <span class="muted">snap</span>
  <span class="switch on" id="snapSwitch"><i></i></span>
  <button class="tiny" id="btnResetLayout">RESET LAYOUT</button>
  <button class="gold" id="btnLockLayout">LOCK LAYOUT</button>
</div>

<!-- =====================================================================
     [SECTION: ROOM MARKUP]
     Three depth layers. Phase 2 parallax moves these at 4 / 10 / 18 px.
     Every .obj is anchored to bottom:var(--floor-line) - the shared baseline.
     ================================================================== -->
<div id="room">

  <!-- ---- BACK: wall, gothic window, floor ---- -->
  <div class="layer layer-back" data-depth="4">
    <div class="wall"></div>
    <div class="window">
      <!-- the sky is a live scene: gradient by hour, sun/moon, stars, clouds -->
      <div class="sky" id="sky">
        <div class="sun-moon" id="sunMoon"></div>
        <div class="stars" id="stars"></div>
        <div class="clouds" id="clouds"></div>
        <div class="skyline"></div>
      </div>
      <!-- rain runs on the INSIDE of the glass, under the mullions -->
      <div class="rain-glass" id="rainGlass"></div>
      <div class="arch">
        <i style="width:16%"></i><i style="width:30%"></i><i style="width:44%"></i>
        <i style="width:58%"></i><i style="width:72%"></i><i style="width:86%"></i>
        <i style="width:100%"></i>
      </div>
      <div class="mullion-v"></div>
      <div class="mullion-h" style="top:42%"></div>
      <div class="mullion-h" style="top:70%"></div>
    </div>

  </div>

  <!-- ---- MID: THE ROOM PLANE ----------------------------------------
       Floor, wainscoting, light shaft and EVERY piece of furniture live on
       this one layer. That is the fix for the floating-furniture bug: the
       floor and the things standing on it are a single plane, so they can
       never slide relative to each other during a parallax move.
       ---------------------------------------------------------------- -->
  <div class="layer layer-mid" data-depth="10">
    <div class="wainscot"></div>
    <div class="floor"><div class="rug"></div></div>
    <div class="shaft"></div>
    <div id="motes"></div>

    <!-- ==== WALL DECOR ==================================================
         These hang on the wall but live on the MID plane, so they stay
         locked to the floor and the furniture during a parallax move.
         All of them are data-move, so rearrange mode can reposition them.
         ============================================================== -->

    <!-- working wall clock: hands are rotated by the single rAF loop -->
    <div class="wallclock" data-move="clock" id="wallClock">
      <!-- pips are centred with calc so the dial stays true at any size -->
      <span class="pip" style="left:calc(50% - 3px);top:4px"></span>
      <span class="pip" style="left:calc(50% - 3px);bottom:4px"></span>
      <span class="pip" style="left:4px;top:calc(50% - 3px)"></span>
      <span class="pip" style="right:4px;top:calc(50% - 3px)"></span>
      <span class="hand h" id="handH"></span>
      <span class="hand m" id="handM"></span>
      <span class="hand s" id="handS"></span>
      <span class="cap"></span>
    </div>

    <!-- tear-off calendar: re-rendered when the date rolls over -->
    <div class="calendar" data-move="calendar" id="calendar">
      <div class="m" id="calMonth">---</div>
      <div class="d" id="calDay">--</div>
      <div class="w" id="calWeekday">---</div>
      <div class="tear"></div>
    </div>

    <!-- framed pixel artwork: astronomical chart -->
    <div class="frame frame-astro" data-move="frameAstro" title="Astronomical chart">
      <div class="f-mat">
        <svg viewBox="0 0 40 50" shape-rendering="crispEdges" aria-label="astronomical chart">
          <rect width="40" height="50" fill="#101a33"/>
          <circle cx="20" cy="25" r="15" fill="none" stroke="#3c5a8c" stroke-width="1"/>
          <circle cx="20" cy="25" r="10" fill="none" stroke="#4d76b3" stroke-width="1"/>
          <circle cx="20" cy="25" r="5"  fill="none" stroke="#6f9ad6" stroke-width="1"/>
          <rect x="19" y="24" width="3" height="3" fill="#f0d27a"/>
          <rect x="34" y="25" width="2" height="2" fill="#cfe0ff"/>
          <rect x="20" y="9"  width="2" height="2" fill="#cfe0ff"/>
          <rect x="10" y="33" width="2" height="2" fill="#cfe0ff"/>
          <rect x="5"  y="8"  width="1" height="1" fill="#ffffff"/>
          <rect x="33" y="42" width="1" height="1" fill="#ffffff"/>
          <rect x="7"  y="44" width="1" height="1" fill="#ffffff"/>
          <rect x="31" y="6"  width="1" height="1" fill="#ffffff"/>
        </svg>
      </div>
    </div>

    <!-- framed pixel artwork: Victorian portrait -->
    <div class="frame frame-portrait" data-move="framePortrait" title="Victorian portrait">
      <div class="f-mat">
        <svg viewBox="0 0 40 50" shape-rendering="crispEdges" aria-label="victorian portrait">
          <rect width="40" height="50" fill="#6d5a3f"/>
          <ellipse cx="20" cy="26" rx="15" ry="19" fill="#8d7654"/>
          <rect x="14" y="14" width="12" height="13" fill="#e0c9a6"/>
          <rect x="12" y="12" width="16" height="5"  fill="#2a2119"/>
          <rect x="11" y="15" width="3"  height="8"  fill="#2a2119"/>
          <rect x="26" y="15" width="3"  height="8"  fill="#2a2119"/>
          <rect x="16" y="19" width="2"  height="2"  fill="#2a2119"/>
          <rect x="22" y="19" width="2"  height="2"  fill="#2a2119"/>
          <rect x="18" y="24" width="4"  height="1"  fill="#a5714f"/>
          <rect x="12" y="28" width="16" height="14" fill="#241c30"/>
          <rect x="17" y="28" width="6"  height="6"  fill="#e8dcc4"/>
          <rect x="19" y="30" width="2"  height="6"  fill="#7d1f2a"/>
        </svg>
      </div>
    </div>

    <!-- framed pixel artwork: botanical study -->
    <div class="frame frame-botanic" data-move="frameBotanic" title="Botanical study">
      <div class="f-mat">
        <svg viewBox="0 0 40 50" shape-rendering="crispEdges" aria-label="botanical study">
          <rect width="40" height="50" fill="#e3d6b4"/>
          <rect x="19" y="14" width="2" height="30" fill="#4a6b34"/>
          <rect x="11" y="22" width="8" height="2"  fill="#5b8040"/>
          <rect x="9"  y="24" width="6" height="2"  fill="#4a6b34"/>
          <rect x="21" y="29" width="8" height="2"  fill="#5b8040"/>
          <rect x="25" y="31" width="6" height="2"  fill="#4a6b34"/>
          <rect x="11" y="35" width="8" height="2"  fill="#5b8040"/>
          <rect x="16" y="8"  width="8" height="6"  fill="#8d3d5c"/>
          <rect x="18" y="6"  width="4" height="3"  fill="#a84f70"/>
          <rect x="14" y="10" width="3" height="3"  fill="#a84f70"/>
          <rect x="23" y="10" width="3" height="3"  fill="#a84f70"/>
          <rect x="6"  y="44" width="28" height="1" fill="#a2937093"/>
        </svg>
      </div>
    </div>

    <!-- brass sconces flanking the window; flames flicker via the rAF noise -->
    <div class="sconce" data-move="sconceL" id="sconceL">
      <span class="sc-flame" id="sconceFlameL"></span>
      <span class="sc-candle"></span><span class="sc-cup"></span>
      <span class="sc-arm"></span><span class="sc-plate"></span>
    </div>
    <div class="sconce" data-move="sconceR" id="sconceR">
      <span class="sc-flame" id="sconceFlameR"></span>
      <span class="sc-candle"></span><span class="sc-cup"></span>
      <span class="sc-arm"></span><span class="sc-plate"></span>
    </div>

const pad2 = n => String(n).padStart(2, "0");
const dayKey = (d = new Date()) => d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());

function toast(msg, kind, ms){
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);

/* tiny UI-state only. Never data. */
const UI = {

          catch(e){ return {}; } },
  write(patch){

/* =========================================================================
   [SECTION: STORAGE]
   IndexedDB is primary. Three stores:
     kv        - the state document + rolling backups   (keyPath "k")
     messages  - one record per chat message, indexed by owner. Appending a
                 message is a single put, never a rewrite of the thread.
     files     - attachment records: metadata + FileSystemFileHandle + preview blob
   If IndexedDB is unavailable (Chrome blocks it on file:// origins) we fall
   back to localStorage so the app still works, in a degraded mode:
   no file handles, no blob previews.
   ========================================================================= */
/* -------------------------------------------------------------------------
   [SECTION: DESKTOP BACKEND]
   When the page runs inside the Electron shell, window.chamberDesktop exists
   and everything is kept in real files instead of IndexedDB:

     %APPDATA%\the-chamber\chamber.json    the whole document
     %APPDATA%\the-chamber\assets\*.bin    audio, sprites, wallpaper
     %APPDATA%\the-chamber\backups\*.json  rolling snapshots

   The document is mirrored in memory and flushed on a debounce, so the rest
   of the app keeps the same async Store API it already had. Nothing here is
   reachable from the browser build - Store.mode stays "idb" there.
   ---------------------------------------------------------------------- */
const Desktop = {
  api: (typeof window !== "undefined" && window.chamberDesktop) || null,
  doc: null,
  dirty: false,
  timer: null,
  blobCache: {},          // assetId -> Blob, so we do not re-read files constantly

  get on(){ return !!this.api; },

  async load(){
    this.doc = await this.api.load();
    this.doc.kv = this.doc.kv || {};
    this.doc.messages = this.doc.messages || [];
    this.doc.layout = this.doc.layout || [];
    this.doc.stores = this.doc.stores || {};
    for (const s of ["tracks","sprites","roomConfig","files"]) this.doc.stores[s] = this.doc.stores[s] || [];
    return this.doc;
  },

  /* debounced flush - the app writes often, the disk should not */
  touch(){
    this.dirty = true;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 400);
  },

  async flush(){
    if (!this.dirty || !this.doc) return;
    this.dirty = false;
    try { await this.api.save(this.doc); }
    catch(err){
      this.dirty = true;
      console.error("[chamber] desktop save failed", err);
      toast("Could not write to disk: " + (err && err.message ? err.message : err), "warn", 12000);
    }
  },

  /* records keep their metadata in the JSON; Blobs go to their own file */
  async stash(rec){
    const out = Object.assign({}, rec);
    if (rec.blob instanceof Blob){
      const id = rec.id;
      const buf = await rec.blob.arrayBuffer();
      await this.api.putAsset(id, buf);
      this.blobCache[id] = rec.blob;
      out.blob = null;
      out.__asset = id;
      out.__type = rec.blob.type || "application/octet-stream";
      out.__size = rec.blob.size;
    }
    return out;
  },

  async hydrate(rec){
    if (!rec || !rec.__asset) return rec;
    const out = Object.assign({}, rec);
    if (this.blobCache[rec.__asset]) { out.blob = this.blobCache[rec.__asset]; return out; }
    const buf = await this.api.getAsset(rec.__asset);
    if (buf){
      out.blob = new Blob([buf], { type: rec.__type || "application/octet-stream" });
      this.blobCache[rec.__asset] = out.blob;
    }
    return out;
  }
};

const Store = {
  db: null,
  ok: false,              // true => IndexedDB, false => localStorage fallback
  mode: "idb",            // "desktop" | "idb" | "local"
  persisted: false,       // true => the browser promised not to evict us
  quota: null,            // { usage, quota, pct } from the last estimate
  nagged: false,          // only nag about exporting once per session

  /* ---- ANTI-DATA-LOSS: ask the browser to stop evicting this origin ----
     Without this, "clear site data", storage pressure or an aggressive
     cleanup can silently drop months of notes. Chrome usually grants it
     for an installed/engaged origin and refuses otherwise, so a refusal is
     normal and must not look like an error. */
  async requestPersistence(){
    if (this.mode === "desktop"){ this.persisted = true; return true; }  // real files
    try {
      if (!navigator.storage || !navigator.storage.persist) return false;
      if (navigator.storage.persisted) this.persisted = await navigator.storage.persisted();
      if (!this.persisted) this.persisted = await navigator.storage.persist();
    } catch(err){
      console.warn("[chamber] persistence request failed", err);
      this.persisted = false;
    }
    return this.persisted;
  },

  /* how full is the origin? used for the badge and the export nag */
  async estimate(){
    try {
      if (!navigator.storage || !navigator.storage.estimate) return null;
      const e = await navigator.storage.estimate();
      this.quota = { usage:e.usage || 0, quota:e.quota || 0,
                     pct: e.quota ? (e.usage || 0) / e.quota : 0 };
      return this.quota;
    } catch(err){ return null; }
  },

  /* one discreet nudge when things look risky */
  async nagIfRisky(){
    if (this.mode === "desktop") return;      // nothing to nag about: it is a file
    if (this.nagged) return;
    const q = await this.estimate();
    const tight = q && q.pct >= CONFIG.QUOTA_WARN_AT;
    if (!tight && this.persisted) return;
    this.nagged = true;
    if (tight){
      toast("Storage is " + Math.round(q.pct * 100) + "% full. Export a JSON backup from Settings before the browser starts evicting data.", "warn", 14000);
    } else if (!this.persisted){
      toast("The browser would not mark this data as persistent, so clearing site data would wipe the chamber. Keep a JSON export in Settings.", "warn", 13000);
    }
  },

  async open(){
    /* Desktop shell wins outright: real files, nothing to evict. */
    if (Desktop.on){
      try {
        await Desktop.load();
        this.mode = "desktop";
        this.ok = true;              // blob-capable, same as IndexedDB
        this.persisted = true;       // files on disk cannot be evicted
        return;
      } catch(err){
        console.error("[chamber] desktop store failed, falling back", err);
        Desktop.api = null;
      }
    }
    try {
      this.db = await new Promise((resolve, reject) => {
        if (!self.indexedDB) return reject(new Error("no indexedDB"));
        const rq = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
        const timer = setTimeout(() => reject(new Error("indexedDB timeout")), 4000);
        rq.onupgradeneeded = () => {
          const db = rq.result;
          if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv", { keyPath:"k" });
          if (!db.objectStoreNames.contains("messages")) {
            const s = db.createObjectStore("messages", { keyPath:"id" });
            s.createIndex("owner", "owner", { unique:false });
          }
          if (!db.objectStoreNames.contains("files")) db.createObjectStore("files", { keyPath:"id" });
          // v2: custom furniture placement, one record per movable object
          if (!db.objectStoreNames.contains("roomLayout")) db.createObjectStore("roomLayout", { keyPath:"id" });
          // v3: gramophone audio blobs, and custom sprites / pets
          if (!db.objectStoreNames.contains("tracks"))  db.createObjectStore("tracks",  { keyPath:"id" });
          if (!db.objectStoreNames.contains("sprites")) db.createObjectStore("sprites", { keyPath:"id" });
          // v4: room dressing the user supplies - currently the wallpaper
          if (!db.objectStoreNames.contains("roomConfig")) db.createObjectStore("roomConfig", { keyPath:"id" });
        };
        rq.onsuccess = () => { clearTimeout(timer); resolve(rq.result); };
        rq.onerror   = () => { clearTimeout(timer); reject(rq.error || new Error("open failed")); };
        rq.onblocked = () => { clearTimeout(timer); reject(new Error("blocked")); };
      });
      this.ok = true;
    } catch(err){
      this.ok = false;
      console.warn("[chamber] IndexedDB unavailable, falling back to localStorage:", err);
    }
  },

  _req(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  _os(name, mode){ return this.db.transaction(name, mode).objectStore(name); },

  /* ---- key/value (state + backups) ---- */
  async kvGet(k){
    if (this.mode === "desktop") return Desktop.doc.kv[k] !== undefined ? Desktop.doc.kv[k] : null;
    if (this.ok){ const rec = await this._req(this._os("kv","readonly").get(k)); return rec ? rec.v : null; }
    const raw = localStorage.getItem("chamber:kv:" + k);
    return raw ? JSON.parse(raw) : null;
  },
  async kvSet(k, v){
    if (this.mode === "desktop"){ Desktop.doc.kv[k] = v; Desktop.touch(); return; }
    if (this.ok){ await this._req(this._os("kv","readwrite").put({ k:k, v:v })); return; }
    localStorage.setItem("chamber:kv:" + k, JSON.stringify(v));
  },

  /* ---- messages ---- */
  async msgsFor(owner){
    let list;
    if (this.mode === "desktop"){
      return Desktop.doc.messages.filter(m => m.owner === owner).sort((a,b) => a.seq - b.seq);
    }
    if (this.ok){ list = await this._req(this._os("messages","readonly").index("owner").getAll(owner)); }
    else {
      const raw = localStorage.getItem("chamber:msgs:" + owner);
      list = raw ? JSON.parse(raw) : [];
    }
    return list.sort((a,b) => a.seq - b.seq);
  },
  async msgPut(m){                       // append / edit a SINGLE message
    if (this.mode === "desktop"){
      const i = Desktop.doc.messages.findIndex(x => x.id === m.id);
      if (i >= 0) Desktop.doc.messages[i] = m; else Desktop.doc.messages.push(m);
      Desktop.touch();
      return;
    }
    if (this.ok){ await this._req(this._os("messages","readwrite").put(m)); return; }
    const key = "chamber:msgs:" + m.owner;
    const list = JSON.parse(localStorage.getItem(key) || "[]");
    const i = list.findIndex(x => x.id === m.id);
    if (i >= 0) list[i] = m; else list.push(m);
    localStorage.setItem(key, JSON.stringify(list));
  },
  async msgDelete(m){
    if (this.mode === "desktop"){
      Desktop.doc.messages = Desktop.doc.messages.filter(x => x.id !== m.id);
      Desktop.touch();
      return;
    }
    if (this.ok){ await this._req(this._os("messages","readwrite").delete(m.id)); return; }
    const key = "chamber:msgs:" + m.owner;
    const list = JSON.parse(localStorage.getItem(key) || "[]").filter(x => x.id !== m.id);
    localStorage.setItem(key, JSON.stringify(list));
  },
  async msgsAll(){
    if (this.mode === "desktop") return Desktop.doc.messages.slice();
    if (this.ok) return await this._req(this._os("messages","readonly").getAll());
    const out = [];
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k.indexOf("chamber:msgs:") === 0) out.push.apply(out, JSON.parse(localStorage.getItem(k) || "[]"));
    }
    return out;
  },

  /* ---- files (handles + previews) ---- */
  async filePut(rec){
    if (this.mode === "desktop"){
      /* A FileSystemFileHandle cannot be written to JSON, so on the desktop
         an attachment keeps its metadata, its typed path and its preview. */
      const slim = Object.assign({}, rec, { handle:null, blob:rec.preview || null });
      delete slim.preview;
      const stashed = await Desktop.stash(slim);
      const arr = Desktop.doc.stores.files;
      const i = arr.findIndex(x => x.id === rec.id);
      if (i >= 0) arr[i] = stashed; else arr.push(stashed);
      Desktop.touch();
      return;
    }
    if (this.ok){ await this._req(this._os("files","readwrite").put(rec)); return; }
    // fallback: metadata only, no handle, no blob
    const slim = Object.assign({}, rec); delete slim.handle; delete slim.preview;
    localStorage.setItem("chamber:file:" + rec.id, JSON.stringify(slim));
  },
  async fileGet(id){
    if (this.mode === "desktop"){
      const rec = Desktop.doc.stores.files.find(x => x.id === id);
      if (!rec) return null;
      const full = await Desktop.hydrate(rec);
      full.preview = full.blob || null;      // the app expects .preview
      return full;
    }
    if (this.ok) return await this._req(this._os("files","readonly").get(id));
    const raw = localStorage.getItem("chamber:file:" + id);
    return raw ? JSON.parse(raw) : null;
  },
  async filesAll(){
    if (this.mode === "desktop") return Desktop.doc.stores.files.slice();
    if (this.ok) return await this._req(this._os("files","readonly").getAll());
    const out = [];
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k.indexOf("chamber:file:") === 0) out.push(JSON.parse(localStorage.getItem(k)));
    }
    return out;
  },

  /* ---- permanently destroy everything owned by an entry/category id ----
     Called when trash expires or an item is destroyed by hand, so deleted
     notes cannot leave orphaned chat threads and attachments behind. */
